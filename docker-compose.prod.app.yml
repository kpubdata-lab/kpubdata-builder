# docker-compose.prod.app.yml — OCI 단일 VM(app-01) 프로덕션 스택.
#
# ADR 0017(풀스택 배포 토폴로지)에 따라 Builder는 단일 app VM에서 Docker로
# 운영한다. our-tax의 split-topology(ADR-0005)와 달리 별도 DB VM(db-01)이나
# Alembic migration one-shot, ETL 프로파일이 없다 — Builder는 외부 RDBMS 없이
# /data 볼륨(매니페스트 + 파생 SQLite 인덱스, ADR 0003/0010)만으로 상태를
# 영속화하기 때문이다.
#
# app-01에서의 사용:
#   cp .env.app.example .env
#   # .env 편집 (KPUBDATA_BUILDER_API_KEY, ALLOWED_ORIGINS, CREDENTIAL_MASTER_KEY, ...)
#   docker compose -f docker-compose.prod.app.yml up -d
#
#   # Caddy(공개 TLS 진입)를 함께 띄우려면:
#   docker compose -f docker-compose.prod.app.yml --profile caddy up -d
#
# 이미지는 프로덕션에서 GHCR(deploy 워크플로가 BUILDER_IMAGE로 주입)에서 pull한다.
# 로컬 검증 시에는 build 컨텍스트(.)로 fallback한다.

services:
  builder:
    image: ${BUILDER_IMAGE:-ghcr.io/kpubdata-lab/kpubdata-builder:latest}
    build:
      context: .
    container_name: kpubdata-builder
    restart: unless-stopped
    environment:
      # fail-closed (ADR 0006): API 키 없이는 컨테이너가 기동을 거부한다.
      KPUBDATA_BUILDER_API_KEY: ${KPUBDATA_BUILDER_API_KEY:?KPUBDATA_BUILDER_API_KEY is required (fail-closed, ADR 0006)}
      KPUBDATA_BUILDER_HOST: 0.0.0.0
      KPUBDATA_BUILDER_PORT: "8000"
      # 빌드 산출물/매니페스트/파생 SQLite 인덱스의 영속 루트. builder-data 볼륨에 매핑.
      KPUBDATA_BUILDER_OUTPUT_DIR: /data
      # CORS default-deny (ADR 0006): Studio(Cloudflare Pages) 오리진만 명시.
      KPUBDATA_BUILDER_ALLOWED_ORIGINS: ${KPUBDATA_BUILDER_ALLOWED_ORIGINS:-}
      # 사용자별 Provider credential AES-GCM master key (ADR 0012). 재기동 사이에
      # 반드시 동일 값을 재주입한다 — 교체 시 기존 credential 복호화 불가.
      KPUBDATA_BUILDER_CREDENTIAL_MASTER_KEY: ${KPUBDATA_BUILDER_CREDENTIAL_MASTER_KEY:-}
      # 테이블 카탈로그 루트 (#993). 없으면 /warehouse/* 가 전부
      # `warehouse_not_configured` 로 답해 Studio 의 Tables·SQL·Saved Analysis 가
      # 동작하지 않는다. builder-data 볼륨 안에 둔다.
      KPUBDATA_BUILDER_WAREHOUSE: /data/warehouse
      # 리소스 예산 (#993, docs/deploy.md §9). 아래 값들의 합이 deploy.resources 의
      # memory 한도 안에 들어와야 하고, tests/unit/test_prod_compose_budget.py 가
      # 그 식을 검사한다. 기본값은 3 GiB 컨테이너 기준이다.
      #   DuckDB 연결 수 = MAX_BUILDS × 4 (build 당 source) + MAX_PREVIEWS + 1 (composition)
      #   메모리 = DuckDB 연결 수 × DUCKDB_MEMORY_LIMIT + QUERY_MEMORY_BUDGET_MB + 기본 400 MB
      # 동시 build 수와 preview 수는 요청 스레드 수와 따로 정한다(#1028). 예전에는
      # MAX_WORKERS 하나가 요청 스레드와 비동기 build worker 를 함께 정해서, 2 로 두면
      # 동기 POST /build 2 + 비동기 2 = build 4 가 돌 수 있었고 요청 스레드도 2 로 줄었다.
      # MAX_BUILDS 는 두 경로를 합친 상한이고, 식이 곱하는 수가 바로 이 값이다.
      KPUBDATA_BUILDER_MAX_BUILDS: ${KPUBDATA_BUILDER_MAX_BUILDS:-2}
      KPUBDATA_BUILDER_MAX_PREVIEWS: ${KPUBDATA_BUILDER_MAX_PREVIEWS:-1}
      # 동기 POST /build 가 build 자리를 기다리는 상한(초). 넘으면 429 build_queue_full (#1040).
      KPUBDATA_BUILDER_BUILD_WAIT_SECONDS: ${KPUBDATA_BUILDER_BUILD_WAIT_SECONDS:-30}
      KPUBDATA_BUILDER_MAX_WORKERS: ${KPUBDATA_BUILDER_MAX_WORKERS:-10}
      KPUBDATA_DUCKDB_THREADS: ${KPUBDATA_DUCKDB_THREADS:-1}
      # 64MB 에서는 20행짜리 빌드도 ResourceLimitError 로 실패한다(실측). 그 아래로
      # 내리지 않는다.
      KPUBDATA_DUCKDB_MEMORY_LIMIT: ${KPUBDATA_DUCKDB_MEMORY_LIMIT:-128MB}
      KPUBDATA_DUCKDB_MAX_TEMP_SIZE: ${KPUBDATA_DUCKDB_MAX_TEMP_SIZE:-1GB}
      KPUBDATA_QUERY_MAX_CONCURRENCY: ${KPUBDATA_QUERY_MAX_CONCURRENCY:-1}
      KPUBDATA_QUERY_MAX_MEMORY_MB: ${KPUBDATA_QUERY_MAX_MEMORY_MB:-768}
      KPUBDATA_QUERY_MEMORY_BUDGET_MB: ${KPUBDATA_QUERY_MEMORY_BUDGET_MB:-768}
      # OIDC Bearer (선택, ADR 0009/0015, #992). Studio 는 Bearer 만 보내므로 Studio 가
      # 붙는 배포는 이것이 필요하다. 비워 두면 API 키 전용(단일 사용자) 배포 그대로다.
      # OIDC_ISSUER 를 설정하면 다중 사용자 배포가 된다: OIDC_AUDIENCE 와, 허용 목록
      # (OIDC_ALLOWED_*) 또는 관리자(KPUBDATA_BUILDER_ADMIN_SUBJECTS) 중 하나가 없으면
      # serve 가 기동을 거부한다(#635). realm 설정은 docs/deploy.md 의 Keycloak 절.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ALLOWED_HD: ${OIDC_ALLOWED_HD:-}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      KPUBDATA_BUILDER_ADMIN_SUBJECTS: ${KPUBDATA_BUILDER_ADMIN_SUBJECTS:-}
      KPUBDATA_BUILDER_AUTH_FAILURE_LIMIT: ${KPUBDATA_BUILDER_AUTH_FAILURE_LIMIT:-}
      KPUBDATA_BUILDER_TRUSTED_PROXIES: ${KPUBDATA_BUILDER_TRUSTED_PROXIES:-}
      # 사용자별 업로드 한도(#1045). 비워 두면 코드 기본값(50개 / 1 GiB / 30일)이다.
      KPUBDATA_BUILDER_UPLOAD_MAX_FILES: ${KPUBDATA_BUILDER_UPLOAD_MAX_FILES:-}
      KPUBDATA_BUILDER_UPLOAD_MAX_TOTAL_BYTES: ${KPUBDATA_BUILDER_UPLOAD_MAX_TOTAL_BYTES:-}
      KPUBDATA_BUILDER_UPLOAD_RETENTION_DAYS: ${KPUBDATA_BUILDER_UPLOAD_RETENTION_DAYS:-}
    ports:
      # 기본은 루프백이다. 예전 기본값("8000")은 모든 인터페이스에 공개돼서,
      # Caddy 없이 올리면 TLS 없는 8000 으로 API 키가 평문으로 오갔다. 헬스체크는
      # #642 에서 VM 안으로 옮겼으므로(rollout.sh 의 compose exec) 외부 노출이
      # 더는 배포 조건이 아니다.
      #
      # 정말로 공개해야 하면 BUILDER_BIND=0.0.0.0:8000 처럼 명시한다 — 노출은
      # 기본값이 아니라 선택이어야 한다.
      - "${BUILDER_BIND:-127.0.0.1:8000}:8000"
    networks:
      - app-net
    volumes:
      # /data는 반드시 로컬 블록 볼륨이어야 한다. SQLite를 네트워크 FS(NFS/Azure
      # Files)에 올리면 파일 잠금이 불안정하다 (ADR 0010 §5, deploy.md §6).
      - builder-data:/data
    healthcheck:
      # 무인증 /healthz (#372). python-slim에는 curl/wget이 없으므로 이미지에
      # 포함된 python urllib로 프로브한다 (Dockerfile HEALTHCHECK와 동일 방식).
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # 위 environment 의 리소스 예산과 함께 바꾼다 (#993). 512M 은 DuckDB 연결
          # 하나의 기본 한도(1GB)보다도 작았다.
          memory: ${BUILDER_MEMORY_LIMIT:-3G}

  # 공개 진입 리버스 프록시. Cloudflare → Caddy → builder.
  # Cloudflare SSL mode: Full(strict). `--profile caddy`로 opt-in.
  caddy:
    image: caddy:2.8-alpine
    container_name: kpubdata-builder-caddy
    restart: unless-stopped
    profiles:
      - caddy
    depends_on:
      builder:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      BACKEND_UPSTREAM: builder:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  builder-data:
  caddy-data:
  caddy-config:

networks:
  app-net:
    name: kpubdata-builder-app-net
