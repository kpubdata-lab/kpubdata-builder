site_name: "KPubData Engine"
site_url: "https://yeongseon.github.io/kpubdata-builder/"
repo_url: "https://github.com/yeongseon/kpubdata-builder"
repo_name: "yeongseon/kpubdata-builder"

theme:
  name: material
  language: ko
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - 비전: vision.md
  - 사용 가이드:
      - CLI 사용 가이드: guides/cli-usage.md
      - API 규약: API_CONTRACT.md
      - 도메인 모델: DOMAIN_MODEL.md
      - 내보내기 모델: EXPORT_MODEL.md
      - 에러 처리: guides/error-handling.md
      - OpenAPI 예제 추출: guides/openapi-examples.md
      - 배포 가이드: deploy.md
      - 예제:
          - 서울 아파트 실거래가: examples/seoul-apt-trade.md
  - 아키텍처:
      - 시스템 구조: ARCHITECTURE.md
      - 경계 규칙: BOUNDARY.md
      - BuildSpec 계약: BUILD_SPEC.md
      - 빌드 상태 머신: BUILD_STATE.md
      - 빌드 알고리즘 명세: ALGORITHM.md
      - 기능 처리 흐름: FEATURE_FLOWS.md
  - 퍼블리싱:
      - 퍼블리싱 가이드: publishing.md
      - HuggingFace 퍼블리싱 표준: hf-publishing-standards.md
      - 교훈 (Lessons Learned): lessons-learned.md
  - 개발 가이드:
      - 기여 방법: CONTRIBUTING.md
      - 에이전트 가이드: AGENTS.md
  - 프로젝트:
      - 요구사항 (PRD): PRD.md
      - 로드맵: ROADMAP.md
      - 변경 이력: CHANGELOG.md
  - ADR:
      - Builder as Orchestrator: adrs/0001-builder-as-orchestrator.md
      - Build 실행 모델: adrs/0002-build-execution-model.md
      - 영속 Build 저장소: adrs/0003-persistent-build-store.md
      - Plugin Exporter 계약: adrs/0004-plugin-exporter-contract.md
      - API 계약 단일 소스: adrs/0005-api-contract-single-source.md
      - 서비스 인증 & 배포: adrs/0006-service-auth-and-deployment.md
      - 버전 호환성 정책: adrs/0007-kpubdata-version-compatibility-policy.md
      - 비동기 build job 모델(제안): adrs/0008-async-build-job-model.md
      - 사용자 인증 모델(제안): adrs/0009-user-authentication-google-oidc.md
      - ArtifactStore·상태 백엔드(제안): adrs/0010-artifactstore-state-backend.md
      - BuildSpec 어시스턴트 그라운딩(제안): adrs/0011-buildspec-assistant-grounding.md
      - Provider Credential 경계: adrs/0012-provider-credential-boundary.md
      - API 계약 릴리스 정책: adrs/0013-api-contract-release-policy.md
      - Public API·File·URL Source 경계: adrs/0014-source-ingestion-file-url-boundary.md
      - 이메일·비밀번호 / OIDC IdP(제안): adrs/0015-email-password-oidc-idp-keycloak.md
      - CUBRID 상태 백엔드: adrs/0016-cubrid-state-backend.md
      - 풀스택 OCI 배포 토폴로지(제안): adrs/0017-fullstack-oci-deployment.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
