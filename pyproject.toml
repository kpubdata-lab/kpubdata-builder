[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpubdata-builder"
version = "0.4.0"
description = "Dataset artifact pipeline for KPubData — turns normalized records into publishable outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yeongseon Choe" }
]
keywords = [
  "korea", "public-data", "dataset", "pipeline", "builder", "export",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # Builder depends on the kpubdata Client API (Client.dataset(...).list, etc.).
  # kpubdata 0.6.0 removed 141 retired datasets (breaking) — builder references
  # none of them (verified 2026-09-09). Pin to the 0.6 line; compat policy: #213.
  "kpubdata>=0.6.0,<0.7",
  "cryptography>=50,<51",
  "polars>=1.0,<2",
  "pyyaml>=6.0,<7",
  "sqlglot>=30.17,<31",
  "typing_extensions>=4.5,<5",
  "urllib3>=2.7.0,<3",
]

[project.scripts]
kpubdata-builder = "kpubdata_builder.cli:main"

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9,<10",
  "mkdocs>=1.6,<2",
]
parquet = ["pyarrow>=15,<26"]
huggingface = ["huggingface-hub>=0.23,<2"]
# PyJWT 2.9+ 부터 issuer=list 지원 (#434). auth.py:_verify_bearer_token 이
# list(=여러 issuer)를 jwt.decode(issuer=...)로 넘기므로, 하한을 되돌리면
# 2.8.x 환경에서 모든 토큰이 InvalidIssuerError 로 거부된다.
auth = ["pyjwt[crypto]>=2.9,<3"]
# CUBRID 상태 백엔드(선택, ADR 0016). `[pycubrid]` extra 가 핵심이다 — sqlalchemy-cubrid
# 자체는 드라이버를 유입하지 않고, extra 없이 설치하면 dialect 만 생기고 연결 시점에
# `ImportError: Could not import CUBRIDdb`(legacy C-extension)로 죽는다.
# 하한은 1.7.1 — sqlalchemy-cubrid 와 pycubrid 가 같은 1.7.1 로 맞춰 배포된 조합이다.
# 기본 백엔드(sqlite/local FS)는 이 extra 없이 동작하므로 코어 dependencies 에는
# 넣지 않는다 — 무외부의존 기본값 유지. 배포 이미지는 3.12-slim.
cubrid = ["sqlalchemy-cubrid[pycubrid]>=1.7.1,<1.8"]
publish = ["huggingface-hub>=0.23,<2", "xmltodict>=0.13,<2", "kaggle>=1.6,<2"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0",
  # Windows에서 zoneinfo가 시스템 tz 데이터베이스를 찾지 못하는 경우를
  # 대비해 tzdata wheel을 보장한다(#553). Linux에서는 no-op다.
  "tzdata>=2024.1",
  # auth extra를 dev에 포함해 CI(mypy/ruff/pytest)에서 항상 타입 체크 가능 (#385).
  "pyjwt[crypto]>=2.9,<3",
  # CUBRID 백엔드 타입체크/스모크용. sqlalchemy-cubrid 1.7 과 pycubrid 1.x 는 둘 다
  # Python >=3.10 을 지원하므로(각 배포판 requires_python 확인), 이 프로젝트의
  # requires-python 전 구간에서 설치된다 — 환경 마커로 게이팅하지 않는다.
  "sqlalchemy-cubrid[pycubrid]>=1.7.1,<1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kpubdata_builder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

# CUBRID 백엔드 의존성은 optional extra 라 기본 설치에는 없다. 미설치 환경에서
# "cannot find module" 로 실패하지 않도록 missing import 를 무시한다 — 설치된
# 환경에서는 각 패키지의 실제 타입(py.typed)을 그대로 사용하므로 정확도는 유지된다.
[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "sqlalchemy_cubrid.*", "pycubrid.*"]
ignore_missing_imports = true

# 커버리지 게이트 (#594). 지금 수준(실측 90%)을 잠그는 것이 목적이지, 새 커버리지를
# 강제하는 것이 아니다 — 하한은 실측보다 2%p 낮게 두어 정상 변동으로 CI 가 붉어지지
# 않게 한다. `--cov` 는 기본 addopts 에 넣지 않는다: 테스트 잡이 5개(py3.10~3.13 +
# min-deps)라 전부에 계측을 걸면 같은 보호를 5배 비용으로 사는 셈이고, 로컬 `pytest`
# 도 두 배 느려진다. CI 의 전용 coverage 잡 하나가 게이트를 담당한다.
[tool.coverage.run]
source = ["src/kpubdata_builder"]

[tool.coverage.report]
fail_under = 88
show_missing = true
# cubrid 백엔드 구현체(store/build_index_cubrid.py, store/artifacts/cubrid.py,
# credentials/store_cubrid.py)는 기본 마커 `-m 'not cubrid'` 가 걷어내므로 이
# 잡에서는 0% 로 잡힌다. 일부러 omit 하지 않는다 — 실제로 이 레인이 실행하지 않는
# 코드이고, 검증은 별도 워크플로(.github/workflows/cubrid.yml, `pytest -m cubrid`)가
# 맡는다. 숨기면 총계만 좋아 보이고 사실이 가려진다.

[tool.pytest.ini_options]
# cubrid marker 테스트는 기본 제외(sqlalchemy·CUBRID 필요, optional extra).
# 실행: `pytest -m cubrid` (명령행 -m 이 이 기본값을 override 한다).
addopts = "-ra -m 'not cubrid and not network'"
testpaths = ["tests"]
markers = [
  "cubrid: CUBRID 백엔드 계약/통합 테스트 (기본 제외; sqlalchemy 필요, ADR 0016).",
  "network: 외부 인터넷 호출이 필요한 테스트 (기본 제외). 제3자 서비스의 가용성에 결과가 달려 있어 CI 를 그 서비스의 상태에 묶는다. 실행: pytest -m network.",
]

[tool.uv.sources]
kpubdata = { path = "../kpubdata", editable = true }
