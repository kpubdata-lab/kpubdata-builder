name: 버그 리포트
description: 예상과 다르게 동작하는 문제를 신고합니다
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        버그를 신고해 주셔서 감사합니다. 재현에 필요한 정보를 최대한 채워주세요.
        안정화 기간에는 먼저 해당 저장소와 연결된 Builder·Studio·SDK 저장소에서
        기존 Issue/PR을 검색하고, 같은 문제라면 그곳에 재현 증거를 추가해 주세요.
        새로 확인된 독립 버그나 보안 위험은 계속 신고할 수 있습니다.
        긴급 보안 문제를 보고하는 데 검색이나 서식이 장애물이 되어서는 안 됩니다.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 무엇이 잘못되었나요?
    validations:
      required: true
  - type: input
    id: related_issue
    attributes:
      label: 연관된 Issue/PR (선택)
      description: 같은 문제의 기존 이슈가 있다면 URL을, 독립 결함이면 그 차이를 요약해 주세요.
      placeholder: "예) #123 또는 다른 저장소의 Issue URL"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 문제를 재현하는 단계별 절차 또는 최소 재현 예시(BuildSpec, 명령어 등)
      placeholder: |
        1. `kpubdata-builder build specs/xxx.yaml` 실행
        2. ...
        3. 오류 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 / 오류 로그
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Python 버전, kpubdata-builder 버전, kpubdata 버전 등
      placeholder: |
        - OS: macOS 14 / Ubuntu 24.04
        - Python: 3.12
        - kpubdata-builder: x.y.z
    validations:
      required: false
