name: Dataset automation report

# Paused during stabilization (kpubdata POLICY 1.3).
# Discovery and approval monitoring support future dataset expansion, which is
# frozen. Run manually for diagnosis only; the workflow cannot write an issue.
# Keep the existing script and its tests for an explicitly approved unfreeze.
#
# No scheduled trigger, no pull_request trigger, no issues:write permission.
# A manual execution uses --dry-run even if an operator supplies a valid key.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset-automation-manual
  cancel-in-progress: false

jobs:
  report:
    name: Inspect dataset approvals and discover drafts (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Install dependencies
        run: uv sync --locked --no-sources

      - name: Inspect without creating or updating an issue
        env:
          KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          uv run --no-sources python scripts/dataset_automation_report.py \
            --dry-run --run-url "${RUN_URL}" --work-dir "${RUNNER_TEMP}"
