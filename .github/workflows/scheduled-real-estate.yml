# 부동산 실거래가 — monthly incremental (1st~10th)
name: "Scheduled: Real Estate"

on:
  schedule:
    - cron: "30 0 1-10 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-real-estate
  cancel-in-progress: false

jobs:
  apt-trade:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-real-estate-apt-trade
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/seoul_apartment_trades.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  apt-rent:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-real-estate-apt-rent
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/seoul_apartment_rent.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  notify-failure:
    needs: [apt-trade, apt-rent]
    if: ${{ failure() }}
    # One issue per workflow, in this repository, updated on a repeat (#1143).
    uses: ./.github/workflows/freshness-incident.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow: ${{ github.workflow }}
