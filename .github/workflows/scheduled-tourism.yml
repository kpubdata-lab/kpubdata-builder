# 관광공사 — weekly (Monday)
name: "Scheduled: Tourism"

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-tourism
  cancel-in-progress: false

jobs:
  tour-area:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-tourism-tour-area
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/tour_kor_area.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  tour-location:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-tourism-tour-location
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/tour_kor_location.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  tour-keyword:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-tourism-tour-keyword
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/tour_kor_keyword.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  tour-festival:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-tourism-tour-festival
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/tour_kor_festival.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  notify-failure:
    needs: [tour-area, tour-location, tour-keyword, tour-festival]
    if: ${{ failure() }}
    # One issue per workflow, in this repository, updated on a repeat (#1143).
    uses: ./.github/workflows/freshness-incident.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow: ${{ github.workflow }}
