name: CUBRID integration

# 실 CUBRID 서버 대상 백엔드 계약 테스트 (ADR 0016).
#
# 기본 CI(ci.yml)는 sqlite/local 만 검증한다. CUBRID dialect 의 실제 동작
# (upsert/LOB/CLOB/DDL 타입매핑·LIMIT·트랜잭션)은 여기서 실 CUBRID 로 확인한다.
# CUBRID 공식 이미지는 --privileged 를 요구해 GitHub Actions service container 로는
# 띄울 수 없으므로 `docker run --privileged` 로 기동한다(러너에 docker 존재).
#
# --no-sources: [tool.uv.sources]의 editable ../kpubdata 오버라이드를 무시하고
# pyproject 핀(>=0.6.0,<0.7)대로 PyPI 에서 kpubdata 를 해석한다(ci.yml 과 동일).

on:
  pull_request:
    paths:
      - "src/kpubdata_builder/store/**"
      - "src/kpubdata_builder/credentials/**"
      - "src/kpubdata_builder/service/app.py"
      - "tests/cubrid/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cubrid.yml"
  push:
    branches: [main]
    # The same paths as the pull request: until the backend is retired
    # (#1094), an unrelated merge has nothing to test here and only pays for
    # the privileged CUBRID container (#1182).
    paths:
      - "src/kpubdata_builder/store/**"
      - "src/kpubdata_builder/credentials/**"
      - "src/kpubdata_builder/service/app.py"
      - "tests/cubrid/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cubrid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubrid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cubrid:
    name: CUBRID backend contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start CUBRID
        run: |
          docker run -d --name cubrid --privileged \
            -e CUBRID_DB=kpubdata -p 33000:33000 cubrid/cubrid:11.3

      - name: Wait for CUBRID readiness
        run: |
          for i in $(seq 1 40); do
            if docker exec cubrid sh -lc 'csql -u dba -c "SELECT 1;" kpubdata' >/dev/null 2>&1; then
              echo "CUBRID is ready"
              exit 0
            fi
            echo "waiting for CUBRID to accept SQL... (${i}/40)"
            sleep 6
          done
          echo "::error::CUBRID did not become ready in time"
          docker logs cubrid | tail -80
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (py3.12 + cubrid extra)
        run: uv sync --extra dev --extra cubrid --no-sources --python 3.12

      - name: Run CUBRID contract tests
        env:
          # CUBRID 기본 dba/빈 비밀번호(개발용). broker 포트 33000.
          KPUBDATA_BUILDER_CUBRID_URL: cubrid+pycubrid://dba:@127.0.0.1:33000/kpubdata?charset=utf8
          KPUBDATA_BUILDER_STORAGE_BACKEND: cubrid
          # 이 잡의 존재 이유가 "실 CUBRID dialect 검증"이므로 SQLite 폴백을 금지한다.
          # 가드가 없으면 URL 주입이 빠졌을 때 fixture 가 조용히 in-memory SQLite 로
          # 내려앉아, CUBRID 를 한 줄도 건드리지 않은 채 잡이 초록으로 통과한다 (#587).
          KPUBDATA_BUILDER_REQUIRE_REAL_CUBRID: "1"
        run: uv run --no-sources pytest tests/cubrid -m cubrid -v

      - name: CUBRID logs on failure
        if: failure()
        run: docker logs cubrid | tail -120
