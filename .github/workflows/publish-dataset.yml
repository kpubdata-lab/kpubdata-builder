name: Publish dataset

# DATA_FRESHNESS.md의 업데이트 전략을 실행하는 재사용 가능한 퍼블리시 워크플로.
#
# - workflow_call: 데이터셋별 스케줄 워크플로가 config/mode를 넘겨 호출한다.
# - workflow_dispatch: 운영자가 수동(백필 포함)으로 실행한다.
#
# Atomic publish 원칙(로컬 빌드 → 검증 → 단일 HF commit)은 scripts/publish_to_hf.py가
# 담당한다. 시크릿(API key)이 없으면 라이브 실행을 건너뛰어 no-op으로 성공 처리한다.
# 데이터셋별 cron 스케줄은 시크릿/구성이 준비된 뒤 별도 스케줄 워크플로에서
# 본 워크플로를 호출해 활성화한다(DATA_FRESHNESS.md의 스케줄 표 참고).

on:
  workflow_call:
    inputs:
      config:
        description: 퍼블리시 config YAML 경로
        required: true
        type: string
      mode:
        description: "퍼블리시 모드 플래그 (--local-only | --dry-run | 빈 문자열=라이브)"
        required: false
        type: string
        default: "--local-only"
      timeout_minutes:
        description: 퍼블리시 잡 제한 시간(분)
        required: false
        type: number
        default: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY:
        required: false
      HF_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      config:
        description: 퍼블리시 config YAML 경로
        required: true
        type: string
      mode:
        description: "퍼블리시 모드 플래그 (--local-only | --dry-run | 빈 문자열=라이브)"
        required: false
        type: string
        default: "--local-only"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --extra dev --extra publish --extra legacy-publish --no-sources

      # Whatever config was asked for — scheduled or dispatched by hand — must pass the
      # same licence rule the tests hold every config to (#792). The input is a free
      # path, so the check sits here, not only in the test suite.
      - name: Licence check
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          case "${CONFIG}" in
            scripts/configs/*.yaml|scripts/configs/*/*.yaml) ;;
            *)
              echo "::error::config must be a YAML file under scripts/configs/: ${CONFIG}"
              exit 1
              ;;
          esac
          uv run --no-sources python scripts/check_config_licence.py "${CONFIG}"

      - name: Publish dataset (atomic, guarded by secrets)
        env:
          KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CONFIG: ${{ inputs.config }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "${KPUBDATA_DATAGO_API_KEY}" ]; then
            echo "::notice::KPUBDATA_DATAGO_API_KEY 미설정 — 라이브 실행을 건너뜁니다(no-op)."
            exit 0
          fi
          # 라이브 퍼블리시(--local-only/--dry-run 이 아닌 모드)는 HF_TOKEN 이 필요하다.
          # 빌드를 모두 수행한 뒤 업로드에서 뒤늦게 실패(late failure)하지 않도록
          # 실행 전에 토큰 존재 여부를 먼저 확인한다 (#171).
          case " ${MODE} " in
            *" --local-only "*|*" --dry-run "*)
              ;;
            *)
              if [ -z "${HF_TOKEN}" ]; then
                echo "::notice::HF_TOKEN 미설정 — 라이브 퍼블리시를 건너뜁니다(no-op)."
                exit 0
              fi
              ;;
          esac
          # --no-sources 는 여기서도 필요하다. uv run 은 실행 전에 환경을 다시
          # 해석하므로, 위 sync 에서 무시한 [tool.uv.sources] 의 editable
          # ../kpubdata 오버라이드가 이 줄에서 되살아난다. 러너에는 형제
          # 디렉터리가 없어 Distribution not found 로 죽는다.
          # --target hf 를 명시한다. 이 워크플로에는 KAGGLE_* secret 이 없어서,
          # 기본값이 all 이던 시절에는 HF 업로드가 성공한 뒤 Kaggle 인증에서
          # 실패해 "게시는 됐는데 빨간 run" 이 남았다.
          uv run --no-sources python scripts/publish_to_hf.py "${CONFIG}" --target hf ${MODE}
