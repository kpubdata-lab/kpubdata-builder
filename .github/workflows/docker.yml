name: Docker

# Dockerfile이 빌드 가능한 serve 이미지를 만드는지 검증한다 (#320, ADR 0006).
# docker build 자체가 인수 기준 "빌드 성공 + serve 진입점 포함"을 증명한다.
# uv sync --no-sources가 PyPI에서 kpubdata를 해석하므로 빌드 시 네트워크가 필요하다.
#
# What each way in publishes to ghcr.io/kpubdata-lab/kpubdata-builder (#1142):
#
#   pull_request                    builds and scans; publishes nothing
#   push to main                    `main`, `latest`, `sha-<commit>`
#   push of a tag v*                `v*` (a tag pushed by a person; one pushed by
#                                   release.yml's GITHUB_TOKEN does not fire this)
#   workflow_dispatch               the dispatched branch or tag, `sha-<commit>`
#   workflow_call from release.yml  the release tag (`ref`) — with `publish: true`,
#                                   whichever event started the release
#
# A release's tag is published by one run at a time: the concurrency group is the
# image's ref, the same for a tag push and for release.yml's call with that tag.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

  # release.yml calls this after it has tagged. A tag pushed with GITHUB_TOKEN does
  # not fire `push: tags`, so waiting for that trigger would leave the tag created
  # and the image never built (#718).
  workflow_call:
    inputs:
      ref:
        description: "Tag to build and publish."
        required: true
        type: string
      # Whether to publish is its own input, not read from the event (#1142). In a
      # called workflow `github` is the caller's: a release pull request merged into
      # main calls this as a `pull_request` event, and `publish` skipped every time.
      publish:
        description: "Publish the image. release.yml sets it; a pull request never does."
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: "The published image's digest; empty when nothing was published."
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  # The image's ref: `v1.2.3` called by release.yml and `refs/tags/v1.2.3` pushed
  # are one group, so the same release is never published by two runs at once.
  group: docker-${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
  # Only a pull request's build is superseded; a publish is never cut off half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.publish }}

jobs:
  build:
    name: docker build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The image tag comes from the git tag (type=ref,event=tag below) while the
      # version inside the image comes from the package metadata. Nothing kept them
      # in step, so an image labelled v0.1.0 could contain 0.4.0.dev0 (#690). Refuse
      # to publish rather than ship a label that contradicts its contents.
      - name: Version consistency
        env:
          CALLED_REF: ${{ inputs.ref }}
        run: |
          # When called by release.yml the ref is a tag but GITHUB_REF_TYPE says
          # `branch`, because that describes the caller. Use the input when there is
          # one, or the label and the contents can disagree unnoticed (#690).
          if [ -n "${CALLED_REF}" ]; then
            python scripts/check_version_consistency.py --tag "${CALLED_REF}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/check_version_consistency.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/check_version_consistency.py
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build serve image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: kpubdata-builder:ci
          # Each build keeps its own cache scope (one scope per image and platform set).
          # They all shared the default scope, where each `cache-to` replaces the
          # scope's index: the single-platform check, the two-platform publish and the
          # CUBRID image overwrote one another, and a run found only the layers of
          # whichever build wrote last. This one also reads what the last publish left.
          cache-from: |
            type=gha,scope=ci
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=ci

      # Each authentication configuration starts, or refuses to, the way a deployment
      # would (#1122): OIDC only, service key only, both, neither, an example key, OIDC
      # without an audience, and dev-mode with OIDC.
      - name: Authentication start-up smoke
        run: python3 scripts/image_auth_smoke.py --image kpubdata-builder:ci

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: kpubdata-builder:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  publish:
    name: publish GHCR image
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'pull_request' || inputs.publish }}
    outputs:
      digest: ${{ steps.build-publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/kpubdata-lab/kpubdata-builder
          tags: |
            type=raw,value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        id: build-publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          sbom: true
          provenance: mode=max

      # CUBRID 프로파일(ADR 0016)용 이미지. infra/cubrid/docker-compose.yml 의
      # BUILDER_IMAGE 기본값이 `:cubrid` 를 가리키는데 그 태그를 만드는 워크플로가
      # 없었다 — CUBRID 배포는 존재하지 않는 이미지를 pull 하려 했다.
      #
      # 기본 이미지와 다른 점은 cubrid extra 하나뿐이다. sqlalchemy-cubrid 는 순수
      # 파이썬이라 C 툴체인 없이 설치된다(Dockerfile 주석 참고). build-arg 는 Dockerfile 의
      # 기본값을 통째로 덮어쓰므로 기본 이미지의 extra(publish, auth)를 여기에 다시 적는다 —
      # auth 가 빠지면 이 이미지는 OIDC_ISSUER 를 설정한 배포에서 기동하지 못한다(#992).
      - name: Build and publish the CUBRID-profile image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            EXTRAS=publish auth cubrid
          tags: ghcr.io/kpubdata-lab/kpubdata-builder:cubrid
          labels: ${{ steps.meta.outputs.labels }}
          # Its own scope: its dependency layer differs from the default image's. The
          # layers before it are the default image's, so the publish scope is read too.
          cache-from: |
            type=gha,scope=cubrid
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=cubrid
          sbom: true
          provenance: mode=max

      - name: Print image digest
        run: echo "Published ghcr.io/kpubdata-lab/kpubdata-builder@${{ steps.build-publish.outputs.digest }}"
