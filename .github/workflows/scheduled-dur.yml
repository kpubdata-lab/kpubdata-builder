# DUR 의약품 — weekly full refresh (Saturday)
name: "Scheduled: DUR Medication"

on:
  schedule:
    - cron: "0 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-dur
  cancel-in-progress: false

jobs:
  dur-usjnt-taboo:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-usjnt-taboo
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_usjnt_taboo.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-pregnancy-taboo:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-pregnancy-taboo
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_pregnancy_taboo.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-age-taboo:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-age-taboo
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_age_taboo.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-older-adult-caution:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-older-adult-caution
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_older_adult_caution.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-dosage-caution:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-dosage-caution
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_dosage_caution.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-medication-period-caution:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-medication-period-caution
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_medication_period_caution.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-efficacy-duplication:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-efficacy-duplication
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_efficacy_duplication.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-product-info:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-product-info
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_product_info.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  dur-er-tablet-split-caution:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-dur-er-tablet-split-caution
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/dur_er_tablet_split_caution.yaml
      timeout_minutes: 60
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  notify-failure:
    needs:
      - dur-usjnt-taboo
      - dur-pregnancy-taboo
      - dur-age-taboo
      - dur-older-adult-caution
      - dur-dosage-caution
      - dur-medication-period-caution
      - dur-efficacy-duplication
      - dur-product-info
      - dur-er-tablet-split-caution
    if: ${{ failure() }}
    # One issue per workflow, in this repository, updated on a repeat (#1143).
    uses: ./.github/workflows/freshness-incident.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow: ${{ github.workflow }}
