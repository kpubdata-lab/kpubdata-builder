# Release under branch protection (kpubdata#586, #718).
#
# Four ways in, none of which writes to `main`.
#
#   workflow_dispatch, mode=release-please  release-please opens the release pull request
#   workflow_dispatch, mode=prepare         opens a release pull request by hand
#   workflow_dispatch, mode=release         gates what is declared now, then tags
#   pull_request closed on `release/*` or   the same, for the pull request path
#     `release-please--branches--main*`
#
# The release pull request is normally the one release-please opens (kpubdata#895, as
# kpubdata did in kpubdata#819): the version comes from the commit titles on `main`
# since the last tag, not from a person picking `bump`. It runs only inside the monthly
# release week, so it cannot open a release pull request the release job would refuse
# or one that lands outside the freeze. `mode=prepare` stays for what release-please
# does not do: a critical patch outside the window, which carries its
# `Critical-Patch: #N` line in the body it writes.
#
# `mode=release` exists because a first release is not a bump. This repository and
# Studio already declare the version their CHANGELOGs say they are preparing, so
# raising it would leave that version unreleased for ever. The version is read from
# `pyproject.toml`, never typed, so a wrong number has nowhere to enter.
#
# The release itself runs in three jobs, in this order, each only if the one before
# passed (#1324):
#
#   release   the gates: window, version, CHANGELOG, `uv lock --check`, an install
#             from the lock as it stands, lint, types and tests. Writes nothing.
#   image     docker.yml, called with the gated commit: build, runtime smokes and the
#             Trivy scan, and only after those the push to GHCR.
#   tag       the published digest is read back from the registry and scanned again,
#             and only then is the git tag pushed and the GitHub Release created,
#             naming that digest.
#
# A failing build, smoke or scan therefore leaves no tag and no release. A failure in
# `tag` itself can leave the image's version tag in GHCR with no git tag; re-running
# publishes it again from the same commit, and the git tag is never moved.
#
# Two GITHUB_TOKEN limits shape this:
#
#   - a tag pushed with GITHUB_TOKEN does not fire `push: tags`, so docker.yml is
#     called rather than waited for — and it is called before the tag exists.
#   - a pull request opened with GITHUB_TOKEN does not trigger `pull_request`
#     workflows, so a release pull request arrives without CI. Correctness does not
#     depend on it: the gates run below, before anything is tagged.
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "release-please = open or update the release pull request (release week only); prepare = open one by hand (critical patch); release = tag what is declared now"
        required: true
        type: choice
        options:
          - release-please
          - prepare
          - release
        default: release-please
      bump:
        description: "Which part of the version to raise (mode=prepare only; release-please reads the commit titles)"
        required: false
        type: choice
        options:
          - patch
          - minor
        default: patch
      critical_patch:
        description: "Release outside the monthly window as a critical patch (security or release-blocking fix)"
        required: false
        type: boolean
        default: false
      critical_issue:
        description: "The issue the critical patch fixes, e.g. #123 (required with critical_patch)"
        required: false
        type: string
        default: ""

  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    name: Open the release pull request
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # First, before a version is worked out or a branch exists (kpubdata#685).
      # Builder and Studio release once a month, in the week holding the month's last
      # Thursday (KST); outside it only a critical patch that names its issue.
      - name: Release window
        uses: kpubdata-lab/kpubdata/.github/actions/release-window@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          policy: monthly
          critical_patch: ${{ inputs.critical_patch }}
          critical_issue: ${{ inputs.critical_issue }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # One implementation, referenced rather than copied. The first draft of this
      # step was an inline shell heredoc — the thing kpubdata#588 pulled out of that
      # repository for being impossible to run without dispatching a real release.
      - name: Work out the new version
        id: bump
        uses: kpubdata-lab/kpubdata/.github/actions/next-version@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          bump: ${{ inputs.bump }}
          file: pyproject.toml

      # Not just pyproject.toml. `uv.lock` repeats the project's own version and
      # `uv lock --check` in CI compares them — writing one without the other turns
      # nine checks red, which is how #744 first went. `.release-please-manifest.json`
      # is what release-please raises from, so a release prepared by hand moves it too.
      #
      # kpubdata's script, run against this checkout. kpubdata's `set-version` action
      # is not used: it runs the script without `--root`, and the script's default
      # root is the action's own download of kpubdata, so here it rewrote kpubdata's
      # files and left Builder's alone (kpubdata#895). The ref is the same commit as
      # the kpubdata actions above; tests/unit/test_release_please.py holds that.
      - name: Fetch kpubdata's release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kpubdata-lab/kpubdata
          ref: 807c21f6a78f22b6ed64e19b38585225ec95e1f7
          path: .kpubdata-release
          sparse-checkout: scripts
          persist-credentials: false

      - name: Write the version
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          python3 .kpubdata-release/scripts/set_version.py "${VERSION}" --root "${GITHUB_WORKSPACE}"
          rm -rf .kpubdata-release

      # The release pull request carries its own CHANGELOG change: `[Unreleased]` becomes
      # this version, dated. An empty `[Unreleased]` stops here, before a branch exists.
      - name: Date the CHANGELOG section
        uses: kpubdata-lab/kpubdata/.github/actions/release-notes@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          command: promote
          version: ${{ steps.bump.outputs.new_version }}

      - name: Show what changed
        run: git --no-pager diff --stat

      # Before the pull request, not after. One that cannot pass this is one nobody
      # should be asked to look at.
      - name: Check the version sources agree
        run: python3 scripts/check_version_consistency.py --tag "${{ steps.bump.outputs.tag }}"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          CRITICAL_ISSUE: ${{ inputs.critical_patch && inputs.critical_issue || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${TAG}"
          git add -A
          git commit -m "chore: release ${TAG}"
          git push origin "release/${TAG}"
          printf '%s\n' \
            "\`${TAG}\` 릴리스 준비 (#718)." \
            "" \
            "병합되면 게이트와 이미지 빌드·smoke·스캔이 돌고, **통과한 뒤에** GHCR 이미지, 태그, 릴리스가 이어진다." \
            "실패하면 남는 것이 없다. 다시 눌러도 된다." \
            > /tmp/release-body.md
          # The merge path has no inputs, so a critical patch travels in the body: the
          # release job reads this line back (kpubdata#685).
          if [ -n "${CRITICAL_ISSUE}" ]; then
            printf '\nCritical-Patch: %s\n' "${CRITICAL_ISSUE}" >> /tmp/release-body.md
          fi
          gh pr create --base main --head "release/${TAG}" \
            --title "chore: release ${TAG}" --body-file /tmp/release-body.md

  # release-please opens the release pull request, and only that (kpubdata#895). It
  # works out the version from the commit titles on `main` since the last tag — in 0.x
  # a breaking change or a `feat` raises the minor and fixes alone the patch
  # (`bump-minor-pre-major`) — and opens, then keeps up to date, the pull request that
  # raises it. Everything else stays where it was:
  #
  #   - The CHANGELOG is written by people under `[Unreleased]` (`skip-changelog`);
  #     this job dates that section on the release branch, as prepare does.
  #   - `uv.lock` repeats the project's own version and release-please does not know
  #     it; kpubdata's set_version.py writes it, against this checkout.
  #   - Nothing is tagged here (`skip-github-release`). Merging the pull request starts
  #     the release job below, which checks the window, runs the gates and then tags.
  #   - No labels (`skip-labeling`).
  #
  # Only in the release week, and only by hand. Builder releases once a month and the
  # week is a freeze; a release pull request opened outside it could not be released
  # and would sit open for weeks. No schedule: the week starts with a person, as it did
  # with prepare. A critical patch outside the week goes through `mode=prepare`.
  #
  # The token. A pull request opened with GITHUB_TOKEN starts no `pull_request`
  # workflows, so its required checks never report. The owner chose a least-privilege
  # GitHub App (kpubdata#895, 2026-10-12): this job mints a short-lived installation
  # token from two secrets and gives it to release-please and to the push below, so the
  # pull request and its later pushes start CI like anyone else's.
  #
  #   RELEASE_APP_CLIENT_ID     the App's Client ID
  #   RELEASE_APP_PRIVATE_KEY   a private key generated for the App (the whole .pem)
  #
  # The token is minted with Contents write and Pull requests write and nothing else,
  # and is never used to merge or approve. Without the two secrets the job warns and
  # falls back to GITHUB_TOKEN: the pull request still opens, and a person closes and
  # reopens it to start the checks. With only one of the two the job fails — that is a
  # broken setup, not a missing one. tests/unit/test_release_please.py holds all this.
  release-please:
    name: Open or update the release pull request
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && inputs.mode == 'release-please' &&
      github.ref == 'refs/heads/main'
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID != '' }}
      HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # First, before anything is written. No critical patch here: that is prepare's.
      - name: Release window
        uses: kpubdata-lab/kpubdata/.github/actions/release-window@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          policy: monthly

      - name: Check the release App secrets
        id: app-secrets
        run: |
          if [ "${HAS_CLIENT_ID}" = "true" ] && [ "${HAS_PRIVATE_KEY}" = "true" ]; then
            echo "use=true" >> "$GITHUB_OUTPUT"
            echo "minting a release App token"
          elif [ "${HAS_CLIENT_ID}" = "true" ] || [ "${HAS_PRIVATE_KEY}" = "true" ]; then
            echo "::error title=Release App half configured::Set both RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY, or neither."
            exit 1
          else
            echo "use=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No release App token::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY are not set. Falling back to GITHUB_TOKEN: the release pull request opens, but its required checks do not start until a person closes and reopens it."
          fi

      - name: Mint the release App token
        id: app
        if: steps.app-secrets.outputs.use == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          skip-labeling: true

      # Only when release-please wrote the branch in this run. It rebuilds the branch
      # from `main` each time it does, so the commit below is made again rather than
      # carried over.
      - name: Read the release branch
        id: branch
        if: steps.please.outputs.pr
        env:
          PR: ${{ steps.please.outputs.pr }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          pr = json.loads(os.environ["PR"])
          print(f"name={pr['headBranchName']}")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.please.outputs.pr
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Read the version release-please chose
        id: version
        if: steps.please.outputs.pr
        run: |
          version=$(python3 -c "
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          print(re.search(r'^version = \"([^\"]+)\"', text, re.MULTILINE).group(1))
          ")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release-please chose ${version}"

      # The same script and commit as prepare's, for the same reason.
      - name: Fetch kpubdata's release scripts
        if: steps.please.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kpubdata-lab/kpubdata
          ref: 807c21f6a78f22b6ed64e19b38585225ec95e1f7
          path: .kpubdata-release
          sparse-checkout: scripts
          persist-credentials: false

      - name: Write the version into the lock file
        if: steps.please.outputs.pr
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .kpubdata-release/scripts/set_version.py "${VERSION}" --root "${GITHUB_WORKSPACE}"
          rm -rf .kpubdata-release

      # An empty `[Unreleased]` fails here: something releasable merged without saying
      # what it changes. The release job would refuse the same thing later, at the tag.
      - name: Date the CHANGELOG section
        if: steps.please.outputs.pr
        uses: kpubdata-lab/kpubdata/.github/actions/release-notes@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          command: promote
          version: ${{ steps.version.outputs.version }}

      - name: Check the version sources agree
        if: steps.please.outputs.pr
        run: python3 scripts/check_version_consistency.py --tag "v${{ steps.version.outputs.version }}"

      - name: Push what release-please does not write
        if: steps.please.outputs.pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "nothing to add: the lock file and the CHANGELOG already say ${VERSION}"
            exit 0
          fi
          git --no-pager diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: write the lock file and date the CHANGELOG for v${VERSION}"
          git push origin "HEAD:${BRANCH}"

  release:
    name: Gate the release
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       (startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    timeout-minutes: 30
    # Writes nothing: the tag and the GitHub Release are the `tag` job's, after the
    # image has passed (#1324).
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # On the pull request path, the merge commit itself — not `main`, which by then
      # may be whatever merged next, a different tree from the one gated below. On a
      # dispatch it is main's head, pinned immediately so the tag cannot land on
      # something that merged while the gates ran.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      # The merge path cannot take workflow inputs, so a critical patch is declared by a
      # `Critical-Patch: #N` line in the release pull request's body — the prepare job
      # writes it, and a person can add it. The body reaches the shell through the
      # environment, never by expansion.
      - name: Read a critical-patch declaration
        id: critical
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_PATCH: ${{ inputs.critical_patch }}
          INPUT_ISSUE: ${{ inputs.critical_issue }}
        run: |
          if [ "${EVENT}" = "pull_request" ]; then
            issue=$(printf '%s\n' "${PR_BODY}" | tr -d '\r' \
              | sed -n -E 's/^Critical-Patch:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' | head -n 1)
            patch=$([ -n "${issue}" ] && echo true || echo false)
          else
            issue="${INPUT_ISSUE}"
            patch="${INPUT_PATCH:-false}"
          fi
          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          echo "issue=${issue}" >> "$GITHUB_OUTPUT"

      # Before the gates, the tag and anything else is written (kpubdata#685). Prepare
      # refuses first, so this only stops a release pull request merged outside the rule.
      # Then the raised version sits on main untagged, and nothing needs undoing:
      # dispatch mode=release in the window, or now with critical_patch and
      # critical_issue. Re-running this job does not help — it replays the same event,
      # so a Critical-Patch line added to the body after the merge is not seen.
      - name: Release window
        uses: kpubdata-lab/kpubdata/.github/actions/release-window@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          policy: monthly
          critical_patch: ${{ steps.critical.outputs.patch }}
          critical_issue: ${{ steps.critical.outputs.issue }}

      - name: Pin the commit being released
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Read the version being released
        id: tag
        run: |
          version=$(python3 -c "
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          print(re.search(r'^version = \"([^\"]+)\"', text, re.MULTILINE).group(1))
          ")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}"

      # The branch name and the file disagree only if someone edited the pull request.
      # Tagging the wrong one is how an image ends up labelled with a version it does
      # not contain (#690).
      - name: The branch name and the file must agree
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # release-please's branch has one name for every release, so there the
          # version is in the title it wrote (`pull-request-title-pattern`). The name
          # is a prefix: release-please may append `--components--<package>`, which
          # kpubdata's first release-please pull request showed (kpubdata#830).
          case "${BRANCH}" in release-please--branches--main*) from_release_please=true ;; *) from_release_please=false ;; esac
          if [ "${from_release_please}" = "true" ]; then
            if [ "${TITLE}" != "chore: release ${TAG}" ]; then
              echo "::error::the pull request is titled '${TITLE}' but pyproject.toml says ${TAG}"
              exit 1
            fi
          elif [ "${BRANCH}" != "release/${TAG}" ]; then
            echo "::error::branch is ${BRANCH} but pyproject.toml says release/${TAG}"
            exit 1
          fi

      # Before the gates, not after. kpubdata#586 is about a release that failed with
      # a tag already created; spending half an hour to then say "tag exists" is the
      # same waste one step earlier.
      - name: The tag must not exist yet
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists. Nothing to release, or the version was not raised."
            exit 1
          fi
          echo "${TAG} is free"

      # The notes are the CHANGELOG section, not a list of pull request titles. Taken
      # before the gates so a missing or empty section stops the release while there
      # is still nothing to clean up.
      - name: Release notes from the CHANGELOG
        id: notes
        uses: kpubdata-lab/kpubdata/.github/actions/release-notes@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          command: extract
          version: ${{ steps.tag.outputs.tag }}

      - name: Check the version sources agree
        run: python3 scripts/check_version_consistency.py --tag "${{ steps.tag.outputs.tag }}"

      # `--no-sources` on every call, exactly as ci.yml does. `[tool.uv.sources]`
      # points kpubdata at `../kpubdata` for local development, and a runner has no
      # sibling checkout — without the flag the release fails with
      # "Distribution not found at: file:///home/runner/work/kpubdata-builder/kpubdata"
      # before it can run a single test. A release must resolve the published
      # dependency, which is the thing users will install.
      #
      # The lock is checked, then installed exactly as it stands (#1324): `--locked`
      # fails rather than re-resolve, so the gates run against the versions uv.lock
      # pins — the ones the image installs (the Dockerfile's `uv sync --locked
      # --no-sources`). `--frozen` is not used: uv refuses it together with
      # `--no-sources`.
      - name: The lock file is current
        run: uv lock --check --no-sources

      - name: Install dependencies
        run: uv sync --locked --extra dev --no-sources

      # Everything that has to be true before a tag exists. A failure here leaves no
      # tag, no release and nothing to clean up.
      - name: Run quality gates
        run: |
          uv run --no-sources ruff check .
          uv run --no-sources ruff format --check .
          uv run --no-sources mypy src
          uv run --no-sources pytest -ra

  image:
    name: Image
    needs: [release]
    # Called, not waited for: a tag pushed with GITHUB_TOKEN does not fire
    # `push: tags` (#690). Called with the gated commit, before any tag exists
    # (#1324): docker.yml's `build` job builds, runs the smokes and the Trivy scan, and
    # its `publish` job pushes only after that job passed.
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      tag: ${{ needs.release.outputs.tag }}
      # Always: a release pull request calls this as a `pull_request` event, which
      # docker.yml otherwise treats as "build, do not publish" (#1142).
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  # Only after the image passed and was published (#1324). No `if:` — this job must be
  # skipped whenever `release` or `image` did not succeed, and that is what `needs`
  # does by default.
  tag:
    name: Verify the image, then tag and release
    needs: [release, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    env:
      IMAGE: ghcr.io/kpubdata-lab/kpubdata-builder
      TAG: ${{ needs.release.outputs.tag }}
      SHA: ${{ needs.release.outputs.sha }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # The commit the gates ran on and the image was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      # A skipped publish job leaves the called workflow green. The release is not done
      # until the image it declares exists (#1142).
      - name: The release's image has a digest
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::no image was published for ${TAG}; nothing is tagged"
            exit 1
          fi
          echo "${IMAGE}:${TAG} was published as ${DIGEST}"

      # Again, after the build: a tag pushed while the image was building is not moved.
      - name: The tag must not exist yet
        run: |
          git fetch --tags --quiet origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists; it is not moved."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the registry serves under the version tag is what was built and pushed —
      # not an image another run pushed under the same tag in between.
      - name: The registry serves the published digest
        run: |
          served=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['digest'])")
          if [ "${served}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}:${TAG} is ${served}, but this run published ${DIGEST}"
            exit 1
          fi
          echo "${IMAGE}:${TAG} is ${DIGEST}"

      # The digest the release will name, scanned with the policy docker.yml's build
      # job applies: HIGH or CRITICAL with a fix available fails.
      - name: Trivy scan of the published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Release notes from the CHANGELOG
        id: notes
        uses: kpubdata-lab/kpubdata/.github/actions/release-notes@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          command: extract
          version: ${{ needs.release.outputs.tag }}

      # The kpubdata this release was tested with — the version uv.lock pinned while
      # the gates ran — goes into the notes, so the compatibility table in kpubdata
      # (docs/compatibility.md) is filled from a fact, not from the pyproject range
      # (#718). The image the release is goes in after it, by digest (#1324).
      - name: Record what the release was tested with
        env:
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          python3 scripts/release_facts.py "${NOTES}"
          printf "\nImage: \`%s@%s\` (\`%s:%s\`), built, smoke-tested and scanned from %s.\n" \
            "${IMAGE}" "${DIGEST}" "${IMAGE}" "${TAG}" "${SHA}" >> "${NOTES}"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${SHA}"
          git push origin "refs/tags/${TAG}"
          gh release create "${TAG}" --title "${TAG}" --notes-file "${NOTES}" --verify-tag
