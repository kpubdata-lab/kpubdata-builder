# Air quality — NOT scheduled. Publishing is stopped over source license limits (#759, #1244).
# Do not add a cron line back until the license review in #1244 is done.
name: "Scheduled: Air Quality"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-air-quality
  cancel-in-progress: false

jobs:
  air-quality:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-air-quality-publish
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/air_quality.yaml
      timeout_minutes: 45
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  notify-failure:
    needs: [air-quality]
    if: ${{ failure() }}
    # One issue per workflow, in this repository, updated on a repeat (#1143).
    uses: ./.github/workflows/freshness-incident.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow: ${{ github.workflow }}
