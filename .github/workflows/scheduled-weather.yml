# 기상청 — every 3 hours append-only
name: "Scheduled: Weather"

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-weather
  cancel-in-progress: false

jobs:
  village-forecast:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-weather-village-forecast
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/weather_village_fcst.yaml
      timeout_minutes: 45
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  ultra-short-term:
    uses: ./.github/workflows/publish-dataset.yml
    permissions:
      contents: read
    concurrency:
      group: scheduled-weather-ultra-short-term
      cancel-in-progress: false
    with:
      mode: ""
      config: scripts/configs/weather_ultra_srt_ncst.yaml
      timeout_minutes: 45
    secrets:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  notify-failure:
    needs: [village-forecast, ultra-short-term]
    if: ${{ failure() }}
    # One issue per workflow, in this repository, updated on a repeat (#1143).
    uses: ./.github/workflows/freshness-incident.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow: ${{ github.workflow }}
