name: CI

# PR 머지 전 코드 품질 게이트: lint(ruff) + type check(mypy) + 테스트 매트릭스.
# 데이터셋 발행 워크플로(publish-dataset.yml)와 분리된, 코드 품질 전용 CI다 (#214).
#
# --no-sources: [tool.uv.sources]의 editable ../kpubdata 오버라이드를 무시하고
# pyproject의 버전 핀(>=0.6.0,<0.7, #575)대로 PyPI에서 kpubdata를 해석한다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      # uv.lock 은 --no-sources 해상도(= CI 와 배포가 설치하는 것)를 기록한다.
      # 그런데 문서가 안내하는 로컬 명령 `uv sync --extra dev` 는 sources 를 켜고
      # 돌기 때문에 lock 의 kpubdata 를 registry -> editable "../kpubdata" 로
      # 뒤집고 해시를 지운다. 그 상태가 커밋되면 CI 가 설치하는 것과 lock 이
      # 서술하는 것이 갈리는데, 지금까지 그것을 잡는 검사가 없었다 (#625).
      - name: Lockfile matches the published resolution
        run: uv lock --check --no-sources

      - name: Install dependencies
        run: uv sync --extra dev --no-sources

      - name: Ruff (lint)
        run: uv run --no-sources ruff check .

      - name: Ruff (format check)
        run: uv run --no-sources ruff format --check .

      - name: mypy (type check)
        run: uv run --no-sources mypy src

      # ADR 0003 puts comments and docstrings in English. The debt is paid down
      # to zero (#710): any Korean comment or docstring now fails the build.
      - name: Korean comment gate
        run: uv run --no-sources python scripts/check_english_comments.py src tests scripts

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --no-sources --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sources pytest

  coverage:
    # 커버리지 게이트 (#594). 지금 도달한 수준이 조용히 내려가지 않게 잠근다.
    # 하한은 pyproject 의 [tool.coverage.report] fail_under 한 곳에서만 관리한다.
    # 테스트 매트릭스에 --cov 를 얹지 않고 이 잡 하나만 계측하는 이유: 5개 잡 전부에
    # 계측을 걸어도 얻는 정보는 같은데 비용만 5배다.
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --no-sources

      - name: Run tests with coverage
        run: uv run --no-sources pytest --cov --cov-report=term-missing

  min-deps:
    # kpubdata 호환성 정책(#213): 선언된 하한(>=0.6.0)에서 테스트 스위트가
    # 통과하는지 강제한다. 정상 해석 후 kpubdata를 하한으로 고정한다(전체
    # --resolution lowest-direct는 pyyaml 6.0이 빌드되지 않아 불가).
    # 하한은 pyproject에서 자동 추출하므로 핀 변경 시 이 잡을 수동 갱신할 필요가 없다.
    name: Minimum kpubdata floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies (normal resolution)
        run: uv sync --extra dev --no-sources

      - name: Pin kpubdata to its declared floor
        run: |
          floor=$(sed -n 's/.*kpubdata>=\([0-9][0-9.]*\).*/\1/p' pyproject.toml | head -1)
          echo "Pinning kpubdata to declared floor: $floor"
          test -n "$floor" || { echo "could not extract kpubdata floor from pyproject.toml"; exit 1; }
          uv pip install "kpubdata==$floor" --no-deps

      - name: Run tests at the floor
        run: uv run --no-sync pytest

  # One gate, so that editing the matrix is not also editing branch protection
  # (studio#416). Requiring a matrix-suffixed context means every matrix edit is a
  # protection edit, and the edit that gets forgotten leaves a required context that
  # is never produced. GitHub does not treat an absent check as a failure — it waits,
  # so every pull request stays BLOCKED with nothing to look at and the only way past
  # is `--admin`, which bypasses every other check too.
  #
  # Depending on the matrix instead of naming its entries means a new Python version
  # is covered the moment it is added, and a removed one takes nothing with it.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [lint, test, coverage, min-deps]
    # `always()` so a failed job still reaches this step. Without it the gate is
    # skipped when something upstream fails, and a skipped required check is the same
    # absence this job exists to remove.
    if: always()
    steps:
      - name: Every job this gate covers must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::CI gate failed — upstream results were: ${results}"
              exit 1
            fi
          done
          echo "every upstream job succeeded"
