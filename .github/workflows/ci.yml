name: CI

# PR 머지 전 코드 품질 게이트: lint(ruff) + type check(mypy) + 테스트 매트릭스.
# 데이터셋 발행 워크플로(publish-dataset.yml)와 분리된, 코드 품질 전용 CI다 (#214).
#
# --no-sources: [tool.uv.sources]의 editable ../kpubdata 오버라이드를 무시하고
# pyproject의 버전 핀(>=0.6.0,<0.7, #575)대로 PyPI에서 kpubdata를 해석한다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only a pull request's run is superseded. A run on main is that commit's record, so
  # each push gets a group of its own: in one shared group a newer run cancels the
  # pending one whatever cancel-in-progress says, and a burst of merges left the
  # middle commits untested.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      # uv.lock 은 --no-sources 해상도(= CI 와 배포가 설치하는 것)를 기록한다.
      # 그런데 문서가 안내하는 로컬 명령 `uv sync --extra dev` 는 sources 를 켜고
      # 돌기 때문에 lock 의 kpubdata 를 registry -> editable "../kpubdata" 로
      # 뒤집고 해시를 지운다. 그 상태가 커밋되면 CI 가 설치하는 것과 lock 이
      # 서술하는 것이 갈리는데, 지금까지 그것을 잡는 검사가 없었다 (#625).
      - name: Lockfile matches the published resolution
        run: uv lock --check --no-sources

      - name: Install dependencies
        run: uv sync --extra dev --no-sources

      - name: Ruff (lint)
        run: uv run --no-sources ruff check .

      - name: Ruff (format check)
        run: uv run --no-sources ruff format --check .

      - name: mypy (type check)
        run: uv run --no-sources mypy src

      # ADR 0003 puts comments and docstrings in English. The debt is paid down
      # to zero (#710): any Korean comment or docstring now fails the build.
      - name: Korean comment gate
        run: uv run --no-sources python scripts/check_english_comments.py src tests scripts

      # Independence Rule 6 (#830): Builder imports only kpubdata's public API — names
      # in the installed kpubdata's __all__, never a `_` module. The remaining private
      # uses are allowlisted in the script, each naming the kpubdata issue to replace it.
      - name: kpubdata public-API gate
        run: uv run --no-sources python scripts/check_kpubdata_imports.py

      # A `uses:` reference to another repository runs whatever its ref points at when
      # the job starts, so a branch or tag lets code reach the release and review
      # gates without a change here (#1003). Every one must be a full commit SHA.
      - name: Action pin gate
        run: python3 scripts/check_action_pins.py

      # The service contract tests pass a deliberate break as long as the document and
      # the code change together. This compares the contract with the base branch's:
      # any normative change must raise info.version, and a break must raise its major
      # version — the explicit approval for an intentional break (#693).
      - name: Contract compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          uv run --no-sources python scripts/check_contract_compat.py --base FETCH_HEAD

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Twice the slowest leg's p95 over 33 runs (2026-10): about 11 minutes for a plain
    # leg, 20 for the one that measures coverage.
    timeout-minutes: ${{ matrix.python-version == '3.12' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --no-sources --python ${{ matrix.python-version }}

      # -n auto: one worker per vCPU (pytest-xdist). The suite takes about 9 minutes on
      # one core; the runner has four.
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run --no-sources pytest -n auto

      # The coverage gate (#594) locks the level reached so far against a silent drop.
      # The floor lives in one place, pyproject's [tool.coverage.report] fail_under. One
      # leg measures it: every leg would report the same thing at four times the cost.
      # It is the 3.12 leg because the gate has always measured on 3.12, and it used to
      # be a job of its own that ran the whole suite a second time.
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run --no-sources pytest -n auto --cov --cov-report=term-missing

  docs:
    # The documentation site is built with `--strict`, where a broken link is an error.
    # That build ran only in docs.yml, on a push to main, so a link that could not be
    # resolved was found after it merged (#1026). Building here finds it in the pull
    # request; docs.yml still does the deploy.
    name: Docs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --extra docs --no-sources

      - name: Build docs (strict)
        run: uv run --no-sources mkdocs build --strict

  kpubdata-releases:
    # Compatibility is a claim about released versions (Independence Rules 11 and 12,
    # #832). This lists every released, unyanked kpubdata inside the range
    # pyproject.toml declares, from PyPI at run time, so a new release in range is
    # tested the day it appears. It fails rather than return a shorter list.
    #
    # The version uv.lock resolves is left out: the Tests matrix installs exactly that
    # one, so a min-deps leg for it ran the same suite on the same packages a second
    # time. When it is the only release in range, nothing is left and min-deps skips.
    name: List supported kpubdata releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: List releases in the declared range
        id: list
        run: |
          versions=$(uv run --no-project --python 3.12 --with packaging python scripts/kpubdata_release_matrix.py --exclude-locked uv.lock)
          echo "kpubdata releases under test beside the locked one: ${versions}" >> "$GITHUB_STEP_SUMMARY"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  min-deps:
    # kpubdata compatibility policy (#213, #832): the suite must pass against every
    # released kpubdata the declared range admits — the floor included, which is what
    # this job used to test alone. Normal resolution first, then kpubdata is replaced
    # (a full --resolution lowest-direct cannot build pyyaml 6.0).
    #
    # The matrix names are not required checks; `CI gate` below needs this job, so a
    # release added or dropped from the range changes no branch protection.
    name: kpubdata ${{ matrix.kpubdata }}
    needs: [kpubdata-releases]
    # An empty matrix is an error, so the job is skipped instead. `CI gate` accepts that
    # skip only when the list came back empty, never when the list job failed.
    if: needs.kpubdata-releases.outputs.versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kpubdata: ${{ fromJSON(needs.kpubdata-releases.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (normal resolution)
        run: uv sync --extra dev --no-sources

      - name: Pin kpubdata to ${{ matrix.kpubdata }}
        env:
          KPUBDATA_VERSION: ${{ matrix.kpubdata }}
        run: |
          uv pip install "kpubdata==${KPUBDATA_VERSION}" --no-deps
          installed=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('kpubdata'))")
          echo "kpubdata installed: ${installed}"
          test "${installed}" = "${KPUBDATA_VERSION}"

      - name: Run tests against kpubdata ${{ matrix.kpubdata }}
        run: uv run --no-sync pytest -n auto

  # DuckDB's floor (#866): 1.2.0 is pyproject's lower bound because it is the first
  # release with every sandbox setting Builder relies on. The lock resolves the newest
  # release, so without this job nothing would notice the floor stop working.
  duckdb-floor:
    name: DuckDB floor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (normal resolution)
        run: uv sync --extra dev --no-sources

      - name: Pin DuckDB to the declared floor
        run: |
          floor=$(sed -n 's/^ *"duckdb>=\([0-9.]*\),.*/\1/p' pyproject.toml)
          test -n "${floor}"
          uv pip install "duckdb==${floor}" --no-deps
          uv run --no-sync python -c "import duckdb; print('duckdb', duckdb.__version__)"

      - name: Run the DuckDB tests against the floor
        run: uv run --no-sync pytest tests/unit -k duckdb

  # Studio main's contract drift test against the contract this change carries (#1004).
  # Builder's own contract gates (check_contract_compat.py, test_service_contract.py)
  # end inside this repository, so a change that breaks Studio's response schemas
  # showed up only on Studio's next CI run. This runs the test Studio runs — the same
  # file, with BUILDER_CONTRACT pointing here instead of at Builder main.
  #
  # The job always runs and is covered by `CI gate`; when neither `contract/` nor this
  # job's own files changed, it only says so and passes. A change Studio can follow
  # only after it merges (Studio develops against Builder main, ADR 0004) names the
  # Studio issue in the pull request body — `Studio-Follow-Up:
  # kpubdata-lab/kpubdata-studio#N` — and drift is then reported as a warning naming
  # it (scripts/studio_drift_follow_up.py).
  studio-drift:
    name: Studio drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Did the contract change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
          elif ! git fetch --no-tags --depth=1 origin "${BEFORE}"; then
            echo "no earlier commit to compare with; running the drift test"
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="$(git diff --name-only FETCH_HEAD HEAD -- contract \
            .github/workflows/ci.yml scripts/studio_drift_follow_up.py)"
          if [ -n "${changed}" ]; then
            printf 'changed:\n%s\n' "${changed}"
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "the contract did not change; Studio drift is not checked"
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Studio follow-up named in the pull request
        id: follow-up
        if: steps.changed.outputs.run == 'true'
        env:
          # The body is read when the step runs, not from the event, so adding the line
          # and re-running the job is enough — a re-run replays the original event.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${PR_NUMBER}" ]; then
            exit 0
          fi
          PR_BODY="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          export PR_BODY
          number="$(python3 scripts/studio_drift_follow_up.py)"
          if [ -z "${number}" ]; then
            exit 0
          fi
          issue="$(gh api "repos/kpubdata-lab/kpubdata-studio/issues/${number}" \
            --jq '[.state, (.pull_request != null)] | @tsv')" || {
            echo "::error::Studio-Follow-Up names kpubdata-lab/kpubdata-studio#${number}, which does not exist"
            exit 1
          }
          if [ "${issue}" != "$(printf 'open\tfalse')" ]; then
            echo "::error::Studio-Follow-Up must name an open Studio issue; #${number} is not one (${issue})"
            exit 1
          fi
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Studio (main)
        if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kpubdata-lab/kpubdata-studio
          ref: main
          path: .studio
          persist-credentials: false

      - name: Setup Node
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .studio/package-lock.json

      - name: Install Studio dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: .studio
        run: npm ci --no-audit --no-fund

      - name: Studio's drift test against this contract
        if: steps.changed.outputs.run == 'true'
        working-directory: .studio
        env:
          BUILDER_CONTRACT: ${{ github.workspace }}/contract/builder-api.yaml
          FOLLOW_UP: ${{ steps.follow-up.outputs.number }}
        run: |
          if npx vitest run src/shared/lib/contractDrift.test.ts; then
            exit 0
          fi
          if [ -n "${FOLLOW_UP}" ]; then
            echo "::warning::Studio main drifts from this contract; kpubdata-lab/kpubdata-studio#${FOLLOW_UP} follows it up"
            exit 0
          fi
          echo "::error::Studio main drifts from this contract. Fix Studio first, or name the Studio issue that will follow with a 'Studio-Follow-Up: kpubdata-lab/kpubdata-studio#N' line in the pull request body"
          exit 1

  # The release freeze (kpubdata #701, kpubdata docs/compatibility.md §5.1): while
  # main is frozen — from the release week's Monday until Studio ships in that week —
  # only release pull requests may merge. The action exits 0 when the freeze does not
  # apply (not a pull request, or not targeting main), so this job is never skipped
  # and the gate below keeps its meaning.
  release-freeze:
    name: Release freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: kpubdata-lab/kpubdata/.github/actions/release-freeze@807c21f6a78f22b6ed64e19b38585225ec95e1f7  # kpubdata-lab/kpubdata main
        with:
          github_token: ${{ github.token }}

  # One gate, so that editing the matrix is not also editing branch protection
  # (studio#416). Requiring a matrix-suffixed context means every matrix edit is a
  # protection edit, and the edit that gets forgotten leaves a required context that
  # is never produced. GitHub does not treat an absent check as a failure — it waits,
  # so every pull request stays BLOCKED with nothing to look at and the only way past
  # is `--admin`, which bypasses every other check too.
  #
  # Depending on the matrix instead of naming its entries means a new Python version
  # is covered the moment it is added, and a removed one takes nothing with it.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, docs, kpubdata-releases, min-deps, duckdb-floor, studio-drift, release-freeze]
    # `always()` so a failed job still reaches this step. Without it the gate is
    # skipped when something upstream fails, and a skipped required check is the same
    # absence this job exists to remove.
    if: always()
    steps:
      # One skip is allowed: min-deps, when the release list job succeeded and left no
      # release beside the locked one. Failed, cancelled and any other skip still fail.
      - name: Every job this gate covers must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results="$(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"${NEEDS}")"
          releases="$(jq -r '."kpubdata-releases".outputs.versions // ""' <<<"${NEEDS}")"
          if [ -z "${results}" ]; then
            echo "::error::CI gate failed — it was given no upstream results"
            exit 1
          fi
          echo "upstream results: ${results//$'\n'/ }"
          failed=""
          for entry in ${results}; do
            job="${entry%%=*}"
            result="${entry#*=}"
            if [ "${result}" = "success" ]; then
              continue
            fi
            if [ "${job}" = "min-deps" ] && [ "${result}" = "skipped" ] && [ "${releases}" = "[]" ]; then
              echo "min-deps skipped: no released kpubdata in range beside the locked one"
              continue
            fi
            failed="${failed} ${entry}"
          done
          if [ -n "${failed}" ]; then
            echo "::error::CI gate failed — upstream results were:${failed}"
            exit 1
          fi
          echo "every upstream job succeeded"
