# Owner decision (2026-11-19): independent human PR approval is no longer mandatory.
# See kpubdata/docs/governance/POLICY.md section 14.1 and kpubdata PR #1072.
# Keep the old required check's name while branch protection is migrated: a missing
# required job would leave every PR blocked. Risk-based CI/title/security checks remain.
name: R3 review

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  r3-review:
    name: R3 review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report owner-approved review policy
        shell: bash
        run: |
          echo "External GitHub APPROVED reviews are optional (owner decision 2026-11-19)." >> "${GITHUB_STEP_SUMMARY}"
          echo "Required CI, PR-title, and security checks are unchanged." >> "${GITHUB_STEP_SUMMARY}"
