name: Security

# Supply-chain and secret checks (#691). Three questions, one job each:
#
#   dependency audit  does anything uv.lock installs have a known vulnerability?
#   secret scan       does any commit in history carry a credential?
#   CodeQL            does the Python source have a known-dangerous pattern?
#
# They run on every pull request and push to main, and weekly, because a dependency
# gains an advisory without anyone touching this repository. They are not part of
# ci.yml's `CI gate`: whether a new advisory should block every open pull request is a
# branch-protection decision (#520), not something this file decides.
#
# Timeouts are about twice each job's p95 over 40 runs (2026-10): CodeQL 2 minutes,
# the audit and the scan well under one.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"  # Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  # Only a pull request's run is superseded; a run on main is that commit's record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Audit what uv.lock pins — the --no-sources resolution CI and deployments
      # install — with every extra, so an optional dependency is not a blind spot.
      # --no-deps: the export is already the full, pinned closure.
      - name: Audit the locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras -o requirements.txt
          uvx pip-audit==2.10.1 -r requirements.txt --no-deps --disable-pip --progress-spinner off

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # A scheduled run scans main's whole history, not one pull request's commits.
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # history, not just the tip: a key removed later is still leaked

      # The binary, checksum-verified, rather than gitleaks-action — that action needs
      # a licence key for organisations and would add a secret to scan for secrets.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " ${archive}\$" | sha256sum -c -
          tar xzf "${archive}" gitleaks

      # Without --log-opts, gitleaks runs `git log --all`, which walks every ref
      # fetch-depth: 0 pulled in — including unmerged PR branches that have nothing
      # to do with this run (kpubdata-studio#685). Scope it to the commits this run
      # is actually responsible for.
      - name: Scope the scan to this run's own commits
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              # Only this PR's commits, base..head, so an unrelated open PR can't
              # fail this one.
              log_opts="${BASE_SHA}..${HEAD_SHA}"
              ;;
            push)
              if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                # A new branch: no prior tip to diff against, so scan what the
                # branch brought in.
                log_opts="$PUSH_SHA"
              else
                log_opts="${BEFORE_SHA}..${PUSH_SHA}"
              fi
              ;;
            *)
              # schedule, workflow_dispatch: no run-specific range, so scan the
              # default branch's full history rather than every branch.
              log_opts="origin/${DEFAULT_BRANCH}"
              ;;
          esac
          echo "log-opts=${log_opts}" >> "$GITHUB_OUTPUT"

      # Findings judged harmless are listed, with the reason, in .gitleaksignore.
      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner --log-level warn --log-opts="${{ steps.scope.outputs.log-opts }}"

  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: python
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:python
