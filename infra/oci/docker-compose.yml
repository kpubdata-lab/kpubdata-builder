# KPubData Builder — OCI Compute VM 단일 인스턴스 배포 (builder + CUBRID). ADR 0016.
#
# 전제(ADR 0009/0010/0016):
#   - 단일 replica (상태 백엔드가 단일 인스턴스 전제).
#   - Builder 는 internal ingress — 공개 인터넷에 노출하지 않는다. 아래 ports 는
#     127.0.0.1 로만 바인딩한다(같은 VM 의 Studio/리버스 프록시가 접근). 다른 호스트가
#     소비하면 VCN private subnet + OCI 보안 목록으로 제한하고 여기서 공개 바인딩하지 말 것.
#   - 산출물 바이트 + manifest FS 미러는 /data(블록 볼륨)에, BuildIndex·credential·manifest
#     정본은 CUBRID 에 저장된다(ADR 0016).
#
# 이미지: builder 는 EXTRAS="publish cubrid" 로 빌드한 이미지를 쓴다(README 참조).
# CUBRID 이미지 태그/버전은 sqlalchemy-cubrid 지원 범위(CUBRID 10.2–11.4) 내에서 고정한다.
services:
  cubrid:
    image: cubrid/cubrid:11.3
    privileged: true # CUBRID 공식 이미지 요구사항
    environment:
      CUBRID_DB: kpubdata
      CUBRID_COMPONENTS: SERVER,BROKER
    volumes:
      # CUBRID 데이터베이스 볼륨(블록 볼륨). 경로는 이미지 버전에 따라 다를 수 있으니
      # 배포 전 `docker inspect`/이미지 문서로 확인할 것(기본 CUBRID_DATABASES 경로).
      - /mnt/blockvol/cubrid:/home/cubrid/CUBRID/databases
    expose:
      - "33000" # compose 내부 네트워크에서만 노출(호스트 미공개)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cubrid service status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  builder:
    image: ${BUILDER_IMAGE:-ghcr.io/kpubdata-lab/kpubdata-builder:cubrid}
    depends_on:
      cubrid:
        condition: service_healthy
    environment:
      # fail-closed: API 키 없으면 기동 거부(docker-entrypoint.sh, ADR 0006).
      KPUBDATA_BUILDER_API_KEY: ${KPUBDATA_BUILDER_API_KEY:?set KPUBDATA_BUILDER_API_KEY in .env}
      KPUBDATA_BUILDER_STORAGE_BACKEND: cubrid
      # 기본 dba/빈 비밀번호는 개발용 — 운영에서는 CUBRID 사용자/비밀번호를 설정하고 URL 을 갱신할 것.
      KPUBDATA_BUILDER_CUBRID_URL: ${KPUBDATA_BUILDER_CUBRID_URL:-cubrid+pycubrid://dba:@cubrid:33000/kpubdata?charset=utf8}
      KPUBDATA_BUILDER_ALLOWED_ORIGINS: ${KPUBDATA_BUILDER_ALLOWED_ORIGINS:-}
      # OIDC Bearer(선택, ADR 0009). 설정 시 allowlist 중 하나 필수(fail-closed).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
    volumes:
      # 산출물 바이트(parquet/CSV/HF) + manifest.json FS 미러. BuildIndex/credential/manifest
      # 정본은 CUBRID 에 있으므로 이 볼륨은 바이트 저장·미러 용도다(ADR 0016).
      - /mnt/blockvol/data:/data
    ports:
      - "127.0.0.1:8000:8000" # internal only — 공개 노출 금지(ADR 0009)
    restart: unless-stopped
