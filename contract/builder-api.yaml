              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            더 이상 취소할 수 없는 job — 이미 `succeeded`/`failed`로 끝났거나,
            파이프라인이 마지막 안전 경계를 지나 정상 종료로 확정했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

