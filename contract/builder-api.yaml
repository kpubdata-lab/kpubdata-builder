openapi: 3.1.0
info:
  title: KPubData Builder Service API
  version: "1.76.0"
  description: >-
    KPubData Builder(패키지 `kpubdata-builder`) 서비스 계약. BuildSpec 검증, preview, build 실행, artifact 조회,
    계약 버전 조회를 제공한다. CLI와 HTTP service mode(#36)가 동일한 도메인 계약을
    공유한다. 본 문서는 BuilderService(service/app.py)의 dispatch 라우팅과 실제
    wire 형태를 기계 판독용(OpenAPI 3.1) 단일 소스로 고정하며, Studio 같은 소비자가
    타입 클라이언트를 생성하는 기준이 된다. v0.4에서는 동기식 build만 유지하며
    비동기/publish 엔드포인트는 제외된다(ADR 0002, #226). v1.5.0은 built dataset
    단위 조회(dataset_id로 여러 run을 grouping)와 Bronze/Silver/Gold stage
    summary/preview API를 추가했다(#488, additive). v1.6.0은 구조화된 Quality/Schema
    Drift 결과(PASS 포함 모든 evaluated check)와 dataset별 quality history/trend
    API를 추가한다(#486, additive — 기존 엔드포인트는 변경되지 않는다). `GET
    /builds/{run_id}/quality`는 `availability`(`available`/`partial`/`unavailable`)와
    `evaluated_checks`를 함께 반환해 "0건 평가"와 "애초에 계산된 적 없음"을
    구분한다(#514, additive). v1.7.0은 Silver/Gold read-only `/query`를
    추가한다(#504, additive). v1.8.0은 stable principal별 encrypted Provider
    credential CRUD와 Provider status/test API를 추가한다(#492, additive). v1.9.0은
    `/query` 응답에 child startup과 Polars engine 실행 시간을 추가한다(#523, additive).
    v1.76.0 records which SQL a saved analysis is written in (#875, additive): `SavedAnalysis` gains `sql_dialect` (`duckdb`, or `legacy-polars` for one saved before the DuckDB cutover), `engine`, `engine_version`, `query_contract_version` and `migration_required`. A legacy analysis is never re-run on DuckDB: `POST /analyses/{analysis_id}/run` answers 409 `analysis_migration_required` until its SQL is reviewed and saved as a new analysis. Existing stores gain the columns on start; their rows are the legacy ones.
    v1.74.0 runs SQL, rows, aggregates, profiles and exports on DuckDB (#874, ADR 0021 step 13): each in a child process over a DuckDB connection that may read only the pinned snapshot file and spill into its own directory, with no other file, network or extension access and its configuration locked. The validator now parses the DuckDB dialect and refuses introspective functions (settings, variables, versions, sequences …) and nondeterministic SQL (random values, UUIDs, the current time, `USING SAMPLE`/`TABLESAMPLE`) with `unsafe_query`. Results keep the types DuckDB gives them, in Builder's spelling, where they differ from the Polars engine: `COUNT(*)` is `int64` (was `uint32`) and an unnamed aggregate is named as DuckDB names it (`count_star()`, `sum(v)` — they were `len` or failed); a `SUM` of an integer column is `int128`, sent as a number or as exact decimal text by its values; `ORDER BY … DESC` puts nulls last (Polars put them first; rows and aggregates always did); `date + INTERVAL` now works and is a datetime; a column that is Null in Builder is `int32` (all null) in SQL results, while a page of rows still reports it Null; a zoned datetime is sent in UTC. A table with a column SQL cannot name (an empty name, or two names one letter case apart) answers `query_execution_failed` to SQL, while rows, aggregates and profiles still read it.
    v1.10.0은 `POST /preview`에 Source↔Silver diff와 sample_mode(first/random)
    옵션을 추가한다(#497, additive — 기존 필드는 유지된다). `limit`의 상한(1000)을
    새로 도입해 그 이상 값을 요청하면 400을 반환한다(behavioral tightening;
    이전에는 상한이 없었다). `limit`이 행 수만 제한하므로 wide dataset에서
    `diffs` 자체가 무제한 커질 수 있어, `diffs`도 별도 상한(1000)으로 자르고
    `diff_truncated`로 명시한다 — `transform_summary`의 집계는 잘리지 않는다.
    v1.11.0은 `GET /monitoring/summary`와 `GET /monitoring/builds`를
    추가한다(#516, additive — 기존 엔드포인트는 변경되지 않는다). Studio
    Monitoring 화면을 위한 시스템/집계 observability만 다루며 Run 단위 이벤트는
    별도(#496)다. Async build queue/worker 상태는 기존
    `AsyncBuildExecutor`/`AsyncBuildJobRegistry`(#511/#513)의 read-only
    snapshot을 반영한다 — 정상 Builder runtime에서는 `availability: available`
    이며 실제 0건과 `unavailable`을 구분한다. Builder API latency는
    healthy/degraded 임계값 근거가 없어 판정 없이 raw
    `sample_count`/`p95_latency_ms`만 제공한다. 대신
    `MonitoringSummaryResponse.status`(`healthy`/`degraded`)는 required
    subsystem(`api`/`queue`/`workers`/`artifact_store`)의 availability로부터
    계산되는 deterministic aggregate이며 latency threshold는 사용하지 않는다.
    Provider 상태는 요청마다 네트워크 프로브를 유발하므로(#492) 이번
    버전에서는 응답에도, aggregate status 판정에도 포함하지 않는다.
    v1.12.0은 BuildSpec.composition(JoinSpec)과 POST /build 응답의 composition
    키, manifest.composition(CompositionProvenance)을 추가한다(#506, additive
    — 기존 필드/엔드포인트는 변경되지 않는다). v1.13.0은 Public API·File·URL
    source를 동일한 canonical contract와
    Bronze→Silver→Gold pipeline으로 처리한다(#498, additive). BuildSpec
    `sources[]`에 `kind`(`public_api`/`file`/`url`)를 추가하며, `kind`를 생략한
    기존 source는 항상 `public_api`로 해석되어 기존 동작이 그대로 유지된다.
    `kind="file"` source를 위해 `POST /uploads`, `GET /uploads/{upload_id}`,
    `DELETE /uploads/{upload_id}`를 추가한다 — 업로드는 principal의 owner_id로
    격리되고 서버가 즉시 파싱 가능성을 검증한다. `kind="url"` source는 P0
    범위(GET, Auth=None, https만 허용)로 SSRF를 방어하는 safe fetch(DNS
    재검증, redirect마다 재검증, 응답 크기 상한)를 거친다. 두 kind 모두 기존
    Bronze artifact/provenance 계약을 그대로 재사용하며, provenance/manifest에
    로컬 파일 경로나 쿼리스트링 secret을 남기지 않는다.
    v1.14.0은 `GET /builds/{run_id}/events`를 추가한다(#496, additive — 기존
    엔드포인트는 변경되지 않는다). run 실행 과정(submitted/started/finished/
    failed, source fetch started/completed/failed, medallion
    stage(bronze/silver/gold/export) started/completed/failed, quality
    checkpoint)을 raw logger parsing 없이 append-only structured event
    timeline으로 조회한다. `limit`(기본 200, 상한 1000)과 `tail`로 bounded
    query를 제공하며, 반환은 항상 chronological ascending이다. event의
    ordering identifier(`seq`)는 store가 append 시점에 부여하는 monotonic
    값이라 병렬 source 간 실제 append 순서를 손실 없이 보존한다. Monitoring
    (#516, `GET /monitoring/summary`·`GET /monitoring/builds`)은 시스템/집계
    observability를 다루고, 이 endpoint는 단일 run의 event만 다룬다 — 역할이
    분리되어 있다. v1.15.0은 `/catalog` 응답(CatalogDataset)에 탐색용
    metadata(`description`/`tags`/`source_url`/`representation`/`operations`/
    `query_support`)를 추가한다(#490, additive — 기존 필드는 유지되며
    raw_metadata는 노출하지 않는다).
    v1.16.0은 async build job 표면을 계약에 문서화한다 — `POST /builds`(202
    접수/200 idempotent 재제출(#513)/409 완료 run 충돌/429 queue full)와
    `GET /builds/{run_id}`(잡 상태 polling, 성공 잡의 최종 build 응답 포함)을
    추가한다(#480, additive). 잡 상태 조회에 ownership 게이트를 적용해
    cross-owner의 build 출력 노출을 차단한다(behavioral tightening — 이전에는
    미검사였음).
    v1.17.0은 build publish 표면을 추가한다(#491) — `GET /builds/{run_id}/publish/readiness`(ready/blockers/warnings)와 `POST /builds/{run_id}/publish`(idempotent publish receipt, TOCTOU 재검사)를 추가한다(additive). HTTP target은 `huggingface`로 한정한다.
    v1.21.0은 publish 감사 로그 조회를 추가한다(#563, additive) — `GET /builds/{run_id}/publish/audit`(reconcile/reset 이력, 소유권 게이트, receipt 삭제 후에도 조회).
    v1.22.0은 `GET /datasets` 응답에 `total`을 추가한다(#488 후속, additive — 기존 필드/동작은 변경되지 않는다). `total`은 canonical dataset grouping과 ownership 필터를 적용한 뒤 pagination(limit) 이전의 접근 가능한 distinct dataset_id 개수이며, Studio Home의 DATASETS KPI가 `datasets` 길이나 limit을 total로 오인하지 않도록 authoritative aggregate를 제공한다. 같은 릴리스 범위에서 `/catalog` 응답의 `CatalogDataset`에 `request_parameters`와 `application`도 추가한다(additive — 기존 필드/동작은 변경되지 않는다). `raw_metadata`의 요청 파라미터 설명을 secret-free allowlist(`name`/`required`/`description`/`example`)로 직렬화한 것으로, `serviceKey` 등 시크릿 파라미터는 제외된다. Add Data가 선택한 Dataset의 필수 요청 파라미터를 사전에 안내하는 데 쓴다. metadata가 없는 dataset은 빈 배열. `application`은 공공데이터포털처럼 API Key 발급과 Dataset별 활용신청이 별개일 수 있는 경우의 안내(`{required, url}`)로, `raw_metadata.application`에서 그대로 전달하며 없으면 null이다 — Studio는 신청 완료/승인 여부를 추측하지 않는다.
    v1.40.0 adds `quota` to `CatalogDataset` (#778, additive): the provider's rate limit as the kpubdata spec's licence declares it, verbatim, or null when nothing is declared.
    v1.41.0 adds optional `semantic`, `display` and `unit` to column metadata (#813, additive; ADR 0019): `ColumnWireInfo`, the `/preview` schema items and `SilverColumnInfo`. They say what a column means, apart from how it is stored (`dtype`, `logical_type`) and sent (`wire_encoding`), and each carries its `origin`. They are metadata only: they never change a column's storage type, wire encoding or values. Absent when nothing describes the column.
    Client compatibility (#814): a response may gain optional fields in any minor version, and a client ignores fields it does not know — `additionalProperties: false` on a response schema describes what this version sends, not what a client should reject. A required field keeps its name and type until the next major version. `contract/fixtures/responses.json` gives every named 2xx response example as sent, with an added unknown field, and with a required field retyped, for a client's contract tests.
    v1.42.0 records how many rows a source's provider reported apart from how many were fetched (#816, additive). Each manifest `provenance` entry gains `fetched_row_count`, `source_reported_total` (`status` reported/unknown/inconsistent/not_summed/not_reported, `value` — `0` is a reported zero, null is not a number — `observed_at` and per-call `calls`) and `coverage` (`complete`/`partial`/`unknown` with `reasons`). Totals are never summed across pages or `param_grid` combinations. `WarehouseSnapshot` gains `coverage`, null when not recorded. A dataset's `status_axes.completeness` is `partial` when a source fetched fewer rows than its provider reported.
    v1.43.0 adds `POST /warehouse/rows` (#815, additive): one page of a pinned warehouse snapshot with a sort, filters, a column selection and a row count that says whether it was computed. `snapshot: current` is resolved once; the next pages pass the returned `snapshot_id` and read the same snapshot whatever is committed meanwhile. Rows that tie on every sort key keep the order they have in the snapshot, so page boundaries neither repeat nor skip them.
    v1.44.0 adds `POST /warehouse/aggregate` (#818, additive): named aggregates (`count_rows`, `count`, `count_null`, `count_distinct`, `sum`, `avg`, `min`, `max`) over a pinned snapshot's columns of a fitting type. `sum` needs `additive: true`; a group whose rows mix units of `unit_column` is refused (422 `mixed_units`) or split by unit. Every filtered row is aggregated before the groups are sorted and the top `limit` taken, and `result.completeness` (`full`/`top_n`) with `group_count` tells a client which it got; `input.sampled` is always false. Too many groups or too large a result is refused (422), never cut short.
    v1.70.0 records the Gold split algorithm (#871, additive): ratio splits are now `hash-sort-v2` — each row is ordered by `md5("<seed>:<row ordinal>")` and then its ordinal, and the order is cut into exactly the counts the ratios give, in DuckDB without a list of row indices in memory — and the manifest gains `split_algorithm`. Membership differs from the earlier `shuffle-v1` for the same seed; a manifest without the field used `shuffle-v1`. Key splits are unchanged.
    v1.71.0 requires a complete dataset card to publish (#694, additive): every Gold output carries `README.md` and `card.json` — the same sections: provenance (providing institution, source URL, licence under its declared name, collection time), processing (each declared transformation) and personal information (what Gold masked or published unmasked, and how the `pii` policy scanned) — copied into a Kaggle package and a Hugging Face layout. Publish readiness and a refused publish add `PublishIssue.code` `card_missing` (a run from before cards; rebuild it) and `card_incomplete` (a required section is empty; the message names it).
    v1.72.0 declares two error bodies clients already read (#947, #951, additive — the wire is unchanged). The 409 `revision_conflict` of `PUT /revisions/{kind}/{doc_id}` and `POST /revisions/{kind}/{doc_id}/revert` is `RevisionConflictError`: `Error` with `current_revision`, the revision to reload and retry from. The 403 `signup_pending` / `signup_rejected` an OIDC user the sign-up ledger does not admit gets from every authenticated operation (#785) is `components.responses.SignupNotApproved` (`SignupNotApprovedError`), declared once and named in `bearerAuth` and `Error.code` rather than on each operation, since many operations already declare their own 403. `contract/fixtures/responses.json` gains `error_fixtures`: every named non-2xx example, a shared response once.
    v1.73.0 gives `GET /admin/runs` a `total` (#948, additive): how many runs there are before `limit`, the build index's runs plus the queued and running jobs it does not hold yet. `AdminRunsResponse.count` is documented as what it always was — the runs in this response, after `limit` — not a total; `count < total` means older runs were left out.
    v1.75.0 declares `card.json` as `DatasetCard` (#955, additive): the dataset card's sections each Gold output has carried since v1.71.0 — `card_version`, `title`, `provenance[]` (`source`, `institution`, `url`, `license`, `collected_at`), `processing[]`, `personal_information` — now have a schema, and `GET /artifacts/{run_id}/{file_path}` says `gold/<source>/card.json` (and its copies in a Kaggle package or Hugging Face layout) follows it. Two facts that were only in sentences get fields: each provenance entry's `license_declared` and `license_provider` (null when not known) and `license_mismatch` (both known and the provider's terms are not the declared licence — the sentence `…; the provider declares: …`), and the top-level `processing_declared` (false when `processing` holds only `No transformation declared: …`). A client reads the fields, not the sentences, which stay for the README. A card written before v1.75.0 lacks the four fields.
    v1.69.0 tells a client where this deployment takes publish credentials from (#938, additive): `GET /version` gains `publish_credential` — `request` (multi-user: only the request's `X-Publish-Credential` header, #925), `stored` (single-user with `KPUBDATA_BUILDER_REQUIRE_OWN_PUBLISH_CREDENTIAL=true`: only the requester's stored credential, #635) or `stored_or_server` (single-user default: the stored credential, else the server's `HF_TOKEN` / `KAGGLE_*`). It is the policy readiness and publish apply, not whether a server or stored credential exists, so it is given to every authenticated caller; `GET /admin/config` is unchanged.
    v1.68.0 keeps declared PII masked on every read of Silver and Bronze (#900, additive): the columns Gold masks (kpubdata `license.pii_columns` and `SourceRef.gold.pii_columns`, less `gold.publish_unmasked`, and whatever the run's manifest recorded as masked) are masked the way Gold masks them — text to the mask token, any other dtype null — wherever Silver or Bronze rows are read. `POST /query` with `stage: silver` runs on a masked copy of the Silver table and names the masked columns in `QueryResponse.masked_columns`; `POST /preview` masks `sample`, `source_sample` and `diffs` and names them in the source's `masked_columns`; a Silver stage detail masks its `sample` and names them in `masked_columns`. `GET /artifacts/{run_id}/{file_path}` refuses every file under `bronze/{source}/` or `silver/{source}/` of a source with such a column: 403 `declared_pii_withheld` (`DeclaredPiiWithheldError`, naming the `columns`); Gold files are served as before. A source whose terms forbid redistribution is refused first (#688). When a public_api source's kpubdata declaration cannot be read, these reads fail closed rather than mask only what the manifest recorded: `/query`, `/preview` and the artifact file answer 503 `pii_declaration_unavailable` (`PiiDeclarationUnavailable`, naming the `dataset`), and a Silver stage detail withholds its sample (`sample_withheld: pii_declaration_unavailable`).
    v1.67.0 makes publish tokens live only as long as their request in a multi-user deployment (#925, ADR 0020 item 2 as confirmed on 2026-10-01). A Hugging Face or Kaggle publish credential is sent in the `X-Publish-Credential` request header (`<VARIABLE>=<value>` with `HF_TOKEN`, `KAGGLE_USERNAME` or `KAGGLE_KEY`, repeated or comma-separated) — never a URL query — and a malformed header answers 400 `invalid_publish_credential` on any route. In a multi-user deployment `GET /builds/{run_id}/publish/readiness`, `POST /builds/{run_id}/publish` and the reconcile probe use only that header: a stored `publish-*` credential is not read and the server `HF_TOKEN`/`KAGGLE_*` is never used, whatever `KPUBDATA_BUILDER_REQUIRE_OWN_PUBLISH_CREDENTIAL` says, so without the header readiness and publish report the `credential_required` blocker and `GET /admin/config` reports `publish_server_credential_fallback: false`. A Kaggle pair must arrive whole. The value is held in memory for the request only and is never stored, logged or returned. A single-user deployment ignores the header and is unchanged.
    v1.65.0 enforces each source's redistribution terms (#688, additive): kpubdata 0.8 declares per dataset whether its data may be redistributed — `allowed`, `non_commercial`, `forbidden` or `unknown` (a dataset that declares nothing is `unknown`, as is a file or URL source); a build takes its most restricted source's verdict. Publish readiness and a refused publish report it as `redistribution`, and it blocks: `forbidden` any publish, `unknown` a public one (`redistribution_unknown`), `non_commercial` one without the new option `confirm_non_commercial: true` (`non_commercial_unconfirmed`) or a public one without a non-commercial licence marker (`non_commercial_marker_missing`). Data whose terms are `forbidden` does not leave Builder: `POST /query`, `POST /preview`, the warehouse profile, query, rows, aggregate and export endpoints, analyses (create and run), export downloads and artifact file downloads (`GET /artifacts/{run_id}/{file_path}`, now declared) answer 403 `redistribution_forbidden` (declared as the `RedistributionForbidden` response; `Error` documents `code` and `redistribution`), and a Silver stage detail withholds its sample (`sample_withheld: redistribution_forbidden`). A publish the terms allow only privately (`unknown`, or `non_commercial`) first reads the destination's visibility: an existing public destination blocks it (`destination_public`), and so does one whose visibility cannot be read (`destination_visibility_unknown`). A refused publish's 409 carries `redistribution`; a successful one records it (`PublishRedistributionRecord`: the verdict, the kpubdata release and `confirm_non_commercial`) in the response and the receipt.
    v1.64.0 reconciles declared-PII masking with the `pii` scan gate (#902, additive): the Silver scan counts a declared column Gold will mask as handled, so `pii.mode: block` passes without `allow_columns`; a `gold.publish_unmasked` column is still scanned and needs `allow_columns` under `block`. `allow_columns` never unmasks a declared column and `publish_unmasked` never silences the gate. A masked column keeps its dtype: text holds `[masked]`, any other dtype becomes null; each `pii_masking.masked` entry says which (`masked_as`). kpubdata-declared fields the source does not carry are listed in `pii_masking.declared_absent` instead of being skipped silently.
    v1.63.0 tightens warehouse column profiles (#896, #897): profiling has its own 60-second timeout instead of the query timeout, and after a timeout the same snapshot answers 504 `query_timeout` for 5 minutes without profiling again. `ColumnProfile.nan_count` and `infinite_count` gain `minimum: 0`. The value-pattern PII check now reads `Categorical` and `Enum` columns as text and `List`/`Array` columns of text element by element (a row matches when any element does); a column of any other type that can hold text (`Struct`, `Object`, `Binary`, nested lists) is not pattern-checked and is `suspected` with the kind `unchecked_values`. The profile `algorithm_version` becomes 2, so cached profiles are recomputed.
    v1.62.0 masks declared PII in the published Gold by default (#689, additive): every column kpubdata's dataset spec declares in `license.pii_columns`, or the BuildSpec declares in `SourceRef.gold.pii_columns`, has each non-null value replaced by `[masked]` in Gold — the table exports, the dataset card, publishing, Gold `/query` and the warehouse read. Silver keeps the values. Nothing is detected from values. `SourceRef.gold.publish_unmasked` is the explicit opt-out for a declared column and adds a manifest warning. The manifest gains `pii_masking`, per Gold directory the masked and unmasked columns and who declared each. A composed Gold masks every declared column of both sides and has no opt-out.
    v1.61.0 reports kpubdata's code columns as identifiers (#702, additive): where a run's kpubdata dataset spec declares a field `semantic_kind: code` (kpubdata ADR 0006) and Builder stores it as text, its column metadata says `logical_type: identifier` — on `/query` and `/warehouse/query` `column_meta`, `/warehouse/rows`, `/warehouse/aggregate`, warehouse export `output.columns`, the `/preview` schema items and warehouse profile columns. An identifier's `wire_encoding` is always `string` and its values are the stored text, leading zeros kept; a client never converts it to a number. The declaration is also carried as `semantic` (`origin: core_spec`) with its `display` label, format and description where the spec has them. Builder does not guess identifiers from values: a column no spec declares a code, or a code stored as a number, keeps its storage logical type. `logical_type` stays an open string, so a client that does not know `identifier` shows the text it receives.
    v1.60.0 versions data checksums (#867, additive): each provenance entry names its `data_checksum_algorithm` — `canonical-multiset-v2` for new runs, a streaming order-independent multiset hash; an entry without it is `canonical-json-sort-v1`. Checksums of different algorithms are never compared. The manifest gains `inputs_fingerprint_algorithm` (`sources-sha256-v2`; absent means `sources-sha256-v1`) and `artifacts`, per Gold directory its `artifact_digest` (bytes, the same digest as a warehouse snapshot's) and `artifact_writer`, apart from the logical checksum.
    v1.59.0 adds document revisions (#820, additive): `PUT /revisions/{kind}/{doc_id}` saves a BuildSpec or an annotation as a new immutable revision based on `expected_revision` (409 on a concurrent save), idempotent by `idempotency_key`, with server-decided author and time and an audit entry; `POST .../revert` makes a new revision from an old one; `GET` reads the latest or one, and `.../history` lists them with the audit trail. Content carrying a credential is refused.
    v1.58.0 lets a `param_grid` fetch resume from a checkpoint (#648, owner decision D4, additive): each finished combination is appended to a checkpoint under the run, and rebuilding the same run fetches only the rest. Such a run's manifest gains `reproducibility` (`reproducible: false`, `reason: resumed_from_checkpoint`, per-source counts) so an R1 comparison leaves it out; a run fetched in one go has none.
    v1.57.0 decides `status_axes.health` (#781, owner decision D7): a BuildSpec may declare `refresh_cadence` (an ISO 8601 duration of weeks, days or hours), and a table whose last successful refresh is older than one cadence is `stale`, otherwise `healthy`; without a cadence or a successful refresh it stays `unknown`.
    v1.56.0 makes provider keys live only as long as their request or job in a multi-user deployment (#683, ADR 0012 amendment of 2026-09-30). A key is sent in the `X-Provider-Key` request header (`<provider>=<key>`, repeated or comma-separated) — never a URL query — and a malformed header answers 400 `invalid_provider_key` on any route. Nothing stored and nothing from the environment is used; `PUT /providers/{provider}/credential` answers 403 `credential_storage_disabled` and `GET` reports not configured. An async job's key is held in memory until the job ends, is cancelled or its TTL passes; runs a restart interrupted are failed as `credentials_required`. A single-user deployment is unchanged.
    v1.55.0 adds `SourceRef.gold` (#659, additive): the columns (`select`) and rows (`filters`) a source's Gold keeps, while Silver keeps everything; the manifest gains `gold_selection` with the rows in, out and dropped.
    v1.54.0 adds the Builder sign-up ledger (#785, option B of ADR 0012's 2026-09-30 amendment): an OIDC user on no `OIDC_ALLOWED_*` list signs up as `pending` and every authenticated request answers 403 `signup_pending` until an administrator approves them with `POST /admin/users/{user_id}/approve`; `POST /admin/users/{user_id}/reject` answers 403 `signup_rejected` from then on, even to a user a list admits. `GET /admin/users` lists the ledger. Administrators are never refused. A deployment without OIDC is unaffected.
    v1.53.0 gives `GET /admin/runs` each run's failure reason, `error` (#679, additive): administrators see a run's status, times, owner and why it failed, never its bytes (ADR 0012 amendment of 2026-09-30, option a).
    v1.52.0 refuses `url` sources in a multi-user deployment (#685, ADR 0012 amendment of 2026-09-30): `POST /preview`, `POST /build` and `POST /builds` answer 403 `url_source_forbidden`, naming each source, before any request is made. It also declares the 403 `provider_credential_required` these operations already gave (#786).
    v1.51.0 hides another owner's run in a multi-user deployment (#796, ADR 0012 amendment of 2026-09-30): every run route answers 404 `run not found` for it, exactly as for a run that does not exist, and `POST /query` answers the same 400 `invalid_context` it gives a missing run. The 403 `forbidden: not run owner` remains only outside multi-user mode, and for a build that names a run id another owner already holds.
    v1.50.0 makes provider connection tests reliable and remembered (#842): the test calls a dataset whose declared parameters give an example for every required one (dates excluded) and that needs no per-dataset application, and answers `not_testable` when there is none; `connected` names the dataset. `GET /providers` reports each provider's `last_test` for the caller, or null.
    v1.49.0 adds `GET /quality/issues` (#843, additive): warn and fail checks and schema drift findings from the latest run of every table the caller may see, one row each with its table, run and source, filtered by `status`, `dataset_id` and `category`, failures first, paged by an opaque cursor. `coverage` counts tables that were evaluated, not evaluated, partially evaluated or unreadable, so a table without results is never read as passing.
    v1.48.0 names each run's table and snapshot in `GET /builds` (#844, additive): `BuildSummary` gains `dataset_id`, `dataset_title`, `snapshot_id` and `snapshots`, and `GET /builds?dataset_id=` keeps one dataset's runs.
    v1.47.0 summarises each table's current snapshot in `GET /warehouse/tables` (#841, additive): `current_snapshot` gives its id, row count, commit time and coverage, and `dataset_id` the dataset it was built for, so a table list needs no call per table.
    v1.46.0 adds column profiles (#817, additive): `GET /warehouse/tables/{name}/profile` describes each column of one pinned snapshot — row count, null count and ratio, NaN and infinite counts, and min/max for numeric and temporal columns — exactly, over every row, under the same limits as a query. NaN and infinity are counted and excluded from ranges; a range over fewer than 10 values is withheld; a column whose values or name suggest personal data is not profiled unless the BuildSpec's `pii` policy accepts it. The profile is a separate artifact tied to the snapshot id, its content digest and the algorithm version.
    v1.45.0 adds query exports (#819, additive): `POST /warehouse/exports` keeps a pinned query's **complete** result as a zip of the data file (csv or jsonl; `machine` or `spreadsheet` profile), `manifest.json` and `NOTICE.md`, after checking the source's licence (no-derivatives licences refused) and PII policy. Over `max_rows` or the byte limit nothing is kept (422). The manifest names the snapshot, revision and digest, copies the licence terms verbatim, and carries provenance, coverage, `user_derived` and every value the spreadsheet profile altered. `GET /warehouse/exports`, `GET`/`DELETE /warehouse/exports/{export_id}` and `GET /warehouse/exports/{export_id}/download` check ownership and expiry at the time of the call.
    v1.39.0 adds saved analyses (#783, additive): `POST /analyses` runs a warehouse query once and saves it bound to the concrete snapshot id it read — never `current` — and places a `saved_analysis` hold on that snapshot while the query's lease is still held; `POST /analyses/{analysis_id}/run` runs it again against that snapshot, so a refresh does not change its input. Only result metadata is stored, not rows. `DELETE` releases the hold. Analyses are scoped like warehouse tables: another owner's is a 404.
    v1.38.0 reads committed warehouse tables (#797, additive): `GET /warehouse/tables` and `GET /warehouse/tables/{name}` list the caller's tables and a table's readable snapshots, and `POST /warehouse/query` runs read-only SQL against one of them. `snapshot: current` is resolved to a snapshot id once, under a lease, before the query starts, so a refresh committed while it runs does not change what it reads; the response names the snapshot that was read. A caller sees only the workspace its own builds commit into, so another owner's table answers 404 like one never built. `POST /query` is unchanged.
    v1.37.0 lets `POST /build` answer 409 with `warehouse_failures` when every source built but a table commit failed (#787, #788, additive): a build commits against the table revision it started from, so a refresh another build finished meanwhile is a conflict rather than overwritten. The manifest records the same failures.
    v1.36.0 adds `status_axes` to `DatasetSummary` and `DatasetDetailResponse` (#781, additive): refresh, completeness, health, access and maturity as separate fields, each `unknown` when there is nothing to go on. Refresh shows a queued or running async refresh; completeness comes from the latest run's manifest; health, access and maturity are `unknown` until their sources reach Builder.
    v1.35.0 adds `version` to `GET /version` (#777, additive): the installed application version, next to `api_version`, the wire contract version. They count different things (kpubdata ADR 0004 §3); Studio compares `version` with its own build to warn about a mismatched pair.
    v1.34.0 adds the `source_fetch_progress` build event (#648, additive): one per finished `param_grid` combination, with `metrics` `{done, total}`, so a long fetch reports progress. Cancellation is now also checked between combinations, so a cancelled run stops fetching at the next combination instead of at the end of the source.
    v1.33.0 lets a BuildSpec state its source's own licence terms (#764, additive): `license_name` and `license_link` join `license`, and are both required when `license` is `other` — the way Hugging Face records a licence outside its list. The Hugging Face card's front matter carries both. `attribution`, accepted since ADR 0018, is now listed in the schema too.
    v1.32.0 checks JOIN cardinality on the keys that intersect (#698, additive): `JoinSpec` gains `keys` (a composite key as `{left, right}` column pairs; `left_key`/`right_key` stay as the single-pair shorthand, and exactly one form is given), `cardinality` (`one_to_one`/`one_to_many`/`many_to_one`/`many_to_many`, verified against the keys present on both sides) and `on_null_key` (`warn`/`fail`). `CompositionProvenance` gains optional `keys`, `cardinality`, `observed_cardinality`, `left_unmatched_ratio`, `right_unmatched_ratio`, `expansion_ratio`, `left_null_key_rows` and `right_null_key_rows`; manifests written before 1.32.0 lack them. `duplicate_key_warning` now fires only when a key present on both sides repeats on both sides, so duplicates that never meet no longer warn or fail.
    v1.31.0 adds `GET /datasets/{dataset_id}/runs/{run_id}` (studio#418, additive): one run found by id rather than in the newest-first page `/runs` returns. The server decides membership and ownership — 404 when no run with that id belongs to the dataset, 403 when it does but not to the caller — so a permalink to an older run opens, and a client can tell a missing run from a forbidden one.
    v1.30.0 adds `logical_type` and `wire_encoding` to column metadata (#735, additive): `QueryResponse.column_meta`, the `/preview` schema items and `SilverColumnInfo`. A column with `wire_encoding: decimal_string` sends its values as exact decimal text — every Decimal column, and an integer column holding any value outside ±(2^53−1) — because a JSON number is read as a double and loses them. In-range integers and floats stay JSON numbers. Non-finite floats are sent as null. Which columns are identifiers is not decided here (#702).
    v1.29.0은 `POST /build` 응답에 `materialized` 를 추가한다(#703, additive) — 웨어하우스가 설정된 배포에서만 나타나고, source 별로 커밋된 테이블 snapshot 을 담는다. **설정되지 않은 배포에서는 키가 아예 없다** — 빈 객체는 "커밋된 것이 없다" 를 주장하고, 호출자는 그것을 "애초에 요청하지 않았다" 와 구별할 수 없다.

    v1.28.0은 관리자 전용 `GET /admin/runs`와 `GET /admin/config`를 추가한다(#679, additive — 기존 경로·동작은 변경되지 않는다). 두 경로는 **메타데이터만** 돌려준다 — 산출물 바이트도, credential 도 포함하지 않는다. 관리자가 아닌 principal 에게는 403 이다.
    v1.27.0은 `SourceRef`에 `param_grid`를 추가한다(#613, additive — 기존 필드/동작은 변경되지 않는다). 한 source 가 여러 파라미터 조합에 걸쳐 반복 호출하고 그 결과를 하나의 dataset 으로 이어붙일 수 있게 한다. 전개 순서는 계약이다(키 이름순 정렬, 마지막 키가 가장 빨리 변함, 축 안에서는 선언 순서 유지) — 순서가 바뀌면 Bronze 바이트가 바뀌어 재빌드 결정성이 깨지기 때문이다.
    v1.26.0은 `SchemaContract`에 `column_null_tokens`를 추가한다(#623, additive — 기존 필드/동작은 변경되지 않는다). 같은 의미의 결측이 컬럼마다 다르게 표기되는 원천을, 다른 컬럼의 의미를 바꾸지 않고 선언할 수 있게 한다. 한 컬럼에서 인정하는 결측 표현은 전역 `null_tokens` + 그 컬럼의 선언이다.
    v1.25.0은 `SchemaContract`에 `coalesce`와 `zfill`을 추가한다(#620, additive — 기존 필드/동작은 변경되지 않는다). `coalesce`는 세대별 alias 컬럼을 하나의 canonical 컬럼으로 모으고, `zfill`은 canonical 식별자를 선언된 폭으로 왼쪽 0 padding 한다. 같은 릴리스 범위에서 `casts`의 dtype 어휘에 `year_month`가 더해진다.
    v1.24.0은 `SchemaContract`에 `read_as`와 `null_tokens`를 추가한다(#613, additive — 기존 필드/동작은 변경되지 않는다). `read_as`는 레코드마다 타입이 다른 원천 컬럼을 선언으로 읽는 규칙이고(CSV는 파싱 단계에서 적용되어 앞자리 0이 보존된다), `null_tokens`는 결측을 나타내는 원천 표기를 캐스팅 전에 null로 모으는 선언이다.
    v1.23.0은 BuildSpec `sources[].schema`(`SchemaContract`)에 `rename`과 `derived`를 추가한다(#611, additive — 기존 필드/동작은 변경되지 않는다). `rename`은 원 필드명 → canonical 컬럼명 매핑으로 캐스팅보다 먼저 적용되며, `derived`는 `date_parts`/`join_key` typed 규칙으로 캐스팅 뒤에 새 컬럼을 만든다. 손으로 쓴 YAML만 지원하던 두 선언을 공개 계약에 올려 Studio와 타입 생성기가 발견/타이핑할 수 있게 한다.
    v1.20.0은 HTTP publish target 어휘를 확장한다(#550, additive) — `kaggle`(packaging의 `dataset-metadata.json` `id`가 destination과 일치해야 하며 `public` option 허용)과 `local`(`KPUBDATA_BUILDER_LOCAL_PUBLISH_ROOT` 안의 상대 `owner/name` 경로만 허용). `GET /publish/readiness`의 `destination` query는 선택이다.
    v1.19.0은 publish receipt 운영 경로를 추가한다(#551, additive) — `GET /builds/{run_id}/publish/receipt`(상태 조회, 소유자 불일치는 404), `POST /builds/{run_id}/publish/reconcile`(원격 상태 확인 후 `succeeded` 확정 또는 reset으로 재게시 허용; 판단 불가 시 503로 무변경), `DELETE /builds/{run_id}/publish/receipt`(명시적 reset, 감사 로그 기록).
    v1.18.0은 ADR 0008의 협력적 취소(cooperative cancellation)를 구현한다 —
    `POST /builds/{run_id}/cancel`을 추가한다(#481, additive). `queued` job은
    worker가 runner를 실행하기 전에 곧바로 `cancelled`로 종결되고(파이프라인
    산출물 0개), `running` job은 `cancelling`을 거쳐 **안전한 stage
    경계**(Bronze/Silver/Gold 산출물이 기록된 뒤, 다음 stage 시작 전)에서
    `cancelled`로 종결된다. worker thread를 강제로 죽이지 않으며, 실행 중인
    stage를 중간에 끊지 않는다. 이미 `succeeded`/`failed`인 job이나 파이프라인이
    정상 종료로 확정한 job에 대한 취소 요청은 409다. `BuildJobStatus` 어휘는
    기존 값을 그대로 재사용하며 새 상태를 만들지 않는다. 부분 산출물은 기본적으로
    삭제하지 않고 partial manifest와 함께 보존한다 — `BuildManifest`에
    `status`(`ok`/`failed`/`cancelled`)와 `partial`을 additive로 추가해, 취소된
    run이 성공 run으로 오인되지 않고 실행되지 않은 stage가 성공으로 기록되지
    않는다. run event 어휘에는 `run_cancelled`가 추가되며(run당 정확히 한 번,
    terminal 확정 시점) `BuildSummary.status`에도 `cancelled`가 관측 가능해진다.
servers:
  - url: http://localhost:8000
    description: 로컬 builder 개발 서버

security:
  - ApiKeyAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: 무인증 liveness probe (버전·메타 정보 없이 status만)
      security: []
      responses:
        "200":
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      operationId: getVersion
      summary: Builder API 계약 버전 조회
      responses:
        "200":
          description: 서비스/계약 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              examples:
                CurrentVersion:
                  summary: Contract and application versions
                  value:
                    service: kpubdata-builder
                    api_version: "1.69.0"
                    version: "0.4.0"
                    publish_credential: request
        "401":
          $ref: "#/components/responses/Unauthorized"

  /catalog:
    get:
      operationId: getCatalog
      summary: provider/dataset 카탈로그 조회 (BL2, #416)
      responses:
        "200":
          description: 사용 가능한 provider와 dataset 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
              examples:
                PublicDataCatalog:
                  summary: 탐색용 metadata를 포함한 공공데이터 카탈로그
                  value:
                    providers:
                      - name: datago
                        datasets:
                          - name: air_quality
                            title: 대기오염정보
                            description: 측정소별 대기오염 물질 농도 조회
                            tags: [environment, air]
                            source_url: https://www.data.go.kr/data/15073861/openapi
                            representation: api_json
                            operations: [get, list]
                            query_support:
                              pagination: offset
                              filterable_fields: [station_name]
                              sortable_fields: []
                              time_range: true
                              max_page_size: 1000
                            requires_service_key: true
                            request_parameters:
                              - name: sidoName
                                required: true
                                description: 조회할 시·도
                                example: 서울
                            application:
                              required: true
                              url: https://www.data.go.kr/data/15073861/openapi.do
                          - name: village_fcst
                            title: 단기예보
                            description: null
                            tags: []
                            source_url: null
                            representation: api_json
                            operations: [list]
                            query_support: null
                            requires_service_key: true
                            request_parameters: []
                            application: null
                      - name: ecos
                        datasets:
                          - name: key_statistic_list
                            title: 주요 경제지표
                            description: 한국은행 주요 경제지표 시계열
                            tags: [economy]
                            source_url: null
                            representation: api_json
                            operations: [list]
                            query_support: null
                            requires_service_key: false
                            request_parameters: []
                            application: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: 카탈로그 조회 실패

  /providers:
    get:
      operationId: listProviders
      summary: 런타임 Provider와 현재 principal의 configured 상태 조회
      responses:
        "200":
          description: Provider 목록. credential 원문과 owner_id는 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/status:
    get:
      operationId: getProviderStatus
      summary: 현재 principal credential로 Provider 연결 상태 확인
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 연결 상태 또는 not_configured 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
              examples:
                Connected:
                  summary: 저장된 credential로 연결 성공
                  value:
                    provider: datago
                    status: connected
                    configured: true
                    latency_ms: 84
                    checked_at: "2026-08-15T09:30:00+00:00"
                NotConfigured:
                  summary: credential이 아직 설정되지 않음
                  value:
                    provider: datago
                    status: not_configured
                    configured: false
                    latency_ms: 0
                    checked_at: "2026-08-15T09:30:00+00:00"
                ProviderTimeout:
                  summary: Provider 연결 제한 시간 초과
                  value:
                    provider: datago
                    status: failed
                    configured: true
                    latency_ms: 10003
                    checked_at: "2026-08-15T09:30:10+00:00"
                    error_category: timeout
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/test:
    post:
      operationId: testProviderConnection
      summary: 현재 principal credential로 lightweight connection test 실행
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 구조화된 connection test 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
              examples:
                Connected:
                  summary: lightweight 연결 시험 성공
                  value:
                    provider: datago
                    status: connected
                    configured: true
                    latency_ms: 91
                    checked_at: "2026-08-15T09:30:00+00:00"
                AuthenticationFailed:
                  summary: Provider가 credential을 거부함
                  value:
                    provider: datago
                    status: failed
                    configured: true
                    latency_ms: 72
                    checked_at: "2026-08-15T09:30:00+00:00"
                    error_category: auth
                    response_code: 401
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/credential:
    get:
      operationId: getProviderCredential
      summary: 현재 principal의 저장 credential 메타데이터 조회
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 원문을 제외한 credential 메타데이터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialGetResponse"
              examples:
                Configured:
                  summary: credential 원문을 노출하지 않는 저장 상태
                  value:
                    configured: true
                    masked: "********"
                    updated_at: "2026-08-15T09:25:00+00:00"
                NotConfigured:
                  summary: 저장된 credential 없음
                  value:
