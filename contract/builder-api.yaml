                  value:
                    dataset_id: seoul-air-quality
                    runs:
                      - run_id: air-quality-20260815
                        timestamp: "2026-08-15T09:30:07+00:00"
                        status: ok
                        pass_count: 2
                        warn_count: 1
                        fail_count: 0
                        evaluated_checks: 3
                        rule_pass_rate: 0.6666666666666666
                        validated_rows: 25
                      - run_id: air-quality-legacy
                        timestamp: null
                        status: ok
                        pass_count: 0
                        warn_count: 0
                        fail_count: 0
