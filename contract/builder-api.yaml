  /builds:
    post:
      operationId: submitBuild
      summary: 비동기 build job 제출 (#482, ADR 0008 #480)
      description: >-
        BuildSpec을 검증해 async build job으로 큐잉하고 즉시 초기 상태를 반환한다.
        동일 run_id의 active job이 있으면 idempotent하게 기존 잡 상태를 200으로
        반환하고(#513), 이미 완료된 run_id면 409, queue가 가득 차면 429를
        반환한다. 잡의 실행 결과는 `GET /builds/{run_id}`로 polling하고,
        협력적 취소는 `POST /builds/{run_id}/cancel`(#481)로 요청한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec:
                  type: string
                  description: BuildSpec을 YAML로 직렬화한 문자열
                run_id:
                  type: string
                  description: >-
                    클라이언트 지정 run_id(선택). 생략하면 서버가 발급한다.
                    안전한 path segment여야 한다.
            examples:
              SubmitBuild:
                summary: 비동기 build 제출
                value:
                  spec: |
                    dataset_id: seoul-air-quality
                    title: 서울 대기질 관측
                    description: 서울 지역 측정소별 대기오염 관측 데이터
                    sources:
                      - provider: datago
                        dataset: air_quality
                        alias: air
                    exports:
                      - kind: jsonl
                        output_path: artifacts/air-quality.jsonl
      responses:
        "202":
          description: build job이 접수되어 큐잉됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJob"
              examples:
                Accepted:
                  summary: 신규 접수된 queued job
                  value:
                    run_id: run-0123456789abcdef
                    status: queued
                    created_at: "2026-08-16T09:00:00+00:00"
                    updated_at: "2026-08-16T09:00:00+00:00"
                    created_by: oidc:user-a
        "200":
          description: 동일 run_id의 active job이 이미 존재함(idempotent 재제출, #513)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJob"
        "400":
          description: 잘못된 spec/run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            Refused before any provider request. `provider_credential_required` (#786):
            the deployment requires the requester's own provider key and there is none
            (`providers` lists them). `url_source_forbidden` (#685): a multi-user
            deployment does not allow `url` sources (`sources` lists each by index and
            path). `forbidden: not run owner` (#991): `run_id` names a run another owner
            already holds — queued, running, failed or completed — and nothing about that
            run is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: run_id가 이미 완료된 run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: async build queue가 가득 참
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: job 접수 실패(event 기록/큐잉 불가 — job은 생성되지 않음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listBuilds
      summary: "빌드 이력 목록 조회 (최신 수정 시각 기준 내림차순)"
