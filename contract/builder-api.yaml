  /builds/{run_id}/events:
    get:
      operationId: getBuildEvents
      summary: >-
        run의 append-only structured event timeline 조회 (#496). raw logger를
        파싱하지 않고, 실제 실행 boundary(run/source fetch/medallion
        stage/quality checkpoint)에서 남긴 구조화된 event만 반환한다. 반환은
        항상 chronological ascending이다 — `tail=true`도 최신 `limit`개를
        고르되 결과 자체는 뒤집지 않는다. 실패했다고 이전 성공 event를
        지우지 않으므로(append-only), partial run에서도 마지막 정상 event와
        실패 event를 함께 확인할 수 있다.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: limit
          in: query
          required: false
          description: "반환할 최대 event 수 (기본값: 200, 상한: 1000)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: tail
          in: query
          required: false
          description: >-
            true면 run 시작부터가 아니라 가장 최근 `limit`개를 선택한다(반환
            순서는 여전히 chronological ascending).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: run_id와 chronological ascending으로 정렬된 event 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildEventsResponse"
              examples:
                CompletedRun:
                  summary: 단일 source가 Bronze→Silver→Gold→Export까지 모두 성공한 run
                  value:
                    run_id: air-quality-20260815
                    events:
                      - seq: 1
                        timestamp: "2026-08-15T09:30:00+00:00"
                        run_id: air-quality-20260815
                        event: run_started
                        status: ok
                        source_key: null
                        stage: null
                        message: pipeline execution started
                        metrics: null
                      - seq: 2
                        timestamp: "2026-08-15T09:30:01+00:00"
                        run_id: air-quality-20260815
                        event: stage_completed
                        status: ok
                        source_key: air
                        stage: bronze
                        message: Bronze written
                        metrics: {records: 84321}
                      - seq: 3
                        timestamp: "2026-08-15T09:30:02+00:00"
                        run_id: air-quality-20260815
                        event: run_finished
                        status: ok
                        source_key: null
                        stage: null
                        message: build completed
                        metrics: null
                PartialFailure:
                  summary: 한 source가 bronze fetch에서 실패한 run — 이전 event는 남아 있다
                  value:
                    run_id: air-quality-partial
                    events:
                      - seq: 1
                        timestamp: "2026-08-15T09:30:00+00:00"
                        run_id: air-quality-partial
                        event: run_started
                        status: ok
                        source_key: null
                        stage: null
                        message: pipeline execution started
                        metrics: null
                      - seq: 2
                        timestamp: "2026-08-15T09:30:01+00:00"
                        run_id: air-quality-partial
                        event: source_fetch_failed
                        status: fail
                        source_key: air
                        stage: null
                        message: "pipeline failed for source 'air'"
                        metrics: null
                      - seq: 3
                        timestamp: "2026-08-15T09:30:01+00:00"
                        run_id: air-quality-partial
                        event: run_failed
                        status: fail
                        source_key: null
                        stage: null
                        message: 1 source(s) failed
                        metrics: null
        "400":
          description: 경로 안전하지 않은 run_id, 잘못된 limit, 또는 잘못된 tail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/publish/readiness:
    get:
      operationId: getPublishReadiness
      summary: >-
        run이 target에 게시 가능한지 side-effect-free로 확인한다 (#491). Publisher를
        호출하거나 원격 dataset을 만들지 않는다. `ready`는 항상 `blockers`가
        비어 있는지로 deterministic하게 계산되며, `warnings`는 게시 자체를
        막지 않는다. `POST .../publish`가 같은 판정을 서버에서 다시 수행하므로,
        이 응답을 신뢰해 blocker 재검증을 건너뛰면 안 된다(TOCTOU).
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: target
          in: query
          required: true
          description: 게시 대상 (기존 publisher registry의 HTTP-safe 부분집합)
          schema:
            type: string
            enum: [huggingface]
      responses:
        "200":
          description: readiness 판정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishReadinessResponse"
              examples:
                Ready:
                  summary: Gold + license + credential이 모두 준비된 run
                  value:
                    run_id: air-quality-20260815
                    target: huggingface
                    ready: true
                    blockers: []
                    warnings: []
                Blocked:
                  summary: license 미선언 + credential 미설정
                  value:
                    run_id: air-quality-20260815
                    target: huggingface
                    ready: false
                    blockers:
                      - code: license_missing
                        message: >-
                          BuildSpec.license must be declared before this dataset
                          can be published (#443)
                      - code: credential_unavailable
                        message: no server-side credential is configured for target 'huggingface'
                    warnings: []
        "400":
          description: 경로 안전하지 않은 run_id, target 누락, 또는 지원하지 않는 target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UnsupportedTarget:
                  summary: local은 HTTP publish target에서 제외된다(#491)
                  value:
                    error: "target 'local' is not available over the publish HTTP API"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/publish:
    post:
      operationId: publishBuild
      summary: >-
        readiness와 완전히 같은 검사를 서버에서 다시 수행한 뒤 기존 Publisher를
        호출한다 (#491). blocker가 하나라도 있으면 Publisher는 호출되지 않는다
        (호출 횟수 0). 새 Publisher를 만들지 않으며, `publishers.PUBLISHER_REGISTRY`
        (huggingface)의 기존 구현을 그대로 재사용한다. `destination`은
        filesystem path로 해석되지 않고 target별 canonical identifier(`owner/name`)
        형태만 허용된다.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
            examples:
              HuggingFace:
                value:
                  target: huggingface
                  destination: kpubdata/air-quality
                  options:
                    private: true
      responses:
        "200":
          description: 게시 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
              examples:
                Published:
                  value:
                    run_id: air-quality-20260815
                    target: huggingface
                    publisher: huggingface
                    destination: kpubdata/air-quality
                    reference: https://huggingface.co/datasets/kpubdata/air-quality
                    artifact_count: 3
                    status: ok
        "400":
          description: >-
            경로 안전하지 않은 run_id, 잘못된 요청 본문, 지원하지 않는 target,
            잘못된 destination 형태, 또는 target이 지원하지 않는 option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                InvalidDestination:
                  summary: destination이 filesystem path처럼 보임(path traversal)
                  value:
                    error: "'destination' must not contain path traversal segments"
                UnknownOption:
                  summary: huggingface가 지원하지 않는 option
                  value:
                    error: "unsupported option for target 'huggingface': 'visibility'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            readiness blocker가 있거나, 동일 operation이 진행/결과 불명 상태이거나,
            같은 run/target/destination이 다른 options로 이미 게시됨
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PublishBlockedResponse"
                  - $ref: "#/components/schemas/Error"
              examples:
                Blocked:
                  value:
                    error: "run is not ready to publish to 'huggingface'"
                    blockers:
                      - code: gold_unavailable
                        message: no successful Gold output is available for this run
                InProgress:
                  value:
                    error: publish operation is already in progress
                    code: publish_in_progress
                UnknownState:
                  value:
                    error: publish operation outcome is unknown; automatic retry is blocked
                    code: publish_state_unknown
                Conflict:
                  value:
                    error: this run and destination were already published with different options
                    code: publish_conflict
        "502":
          description: >-
            기존 Publisher 호출이 실패함(원격 인증/네트워크/provider 오류).
            Publisher가 던진 예외의 원문 메시지(secret/절대 filesystem path를
            담을 수 있음)는 절대 그대로 반환하지 않는다(#491) — 항상 이
            stable generic 메시지와 code만 나간다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                RemoteFailure:
                  value:
                    error: "publish failed due to an unexpected error"
                    code: publish_failed

  /builds/{run_id}/stages:
