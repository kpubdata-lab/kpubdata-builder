      summary: Run a warehouse query and save it bound to the snapshot it read (#783)
      description: >-
        Takes the `POST /warehouse/query` body plus `name`. The query runs once;
        `snapshot: current` is resolved to a snapshot id and that id is what is stored.
        A `saved_analysis` hold is placed on the snapshot before the query's lease is
        released, so garbage collection keeps it for as long as the analysis exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisRequest"
      responses:
        "200":
          description: The saved analysis and the result of the run that saved it.
