  /revisions/{kind}/{doc_id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [spec, annotation]}
      - name: doc_id
        in: path
        required: true
        schema: {type: string, maxLength: 200}
    put:
      operationId: saveRevision
      summary: Save a document as a new immutable revision (#820)
      description: >-
        `expected_revision` is the revision the edit was based on (0 for a new
        document); if another save came first the answer is 409 with the current
        revision — nothing is merged or overwritten. Repeating a save with the same
        `idempotency_key` returns the revision the first attempt made. Author and time
        are the server's. Content carrying a credential is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRevisionRequest"
      responses:
        "200":
          description: The saved revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
        "400":
          description: >-
            Invalid request, or `credential_in_content` — a credential-named field or a
            key-shaped value, named by path, never echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >-
            The document moved on (`revision_conflict`): `current_revision` is the latest
            revision, the one to reload and base the next save on (#947). Nothing is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionConflictError"
              examples:
                RevisionConflict:
                  summary: Another save came first
                  value:
                    error: the document is at revision 2
                    code: revision_conflict
                    current_revision: 2
    get:
      operationId: getRevision
      summary: The latest revision of a document, or `?revision=` one (#820)
      parameters:
        - name: revision
          in: query
          required: false
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
        "400":
          description: Invalid kind, doc_id or revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such document or revision in the caller's workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /revisions/{kind}/{doc_id}/history:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [spec, annotation]}
      - name: doc_id
        in: path
