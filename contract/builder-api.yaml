  /builds/{run_id}/quality:
    get:
      operationId: getBuildQuality
      summary: >-
        run의 구조화된 Quality 결과와 schema drift 조회 (#486). manifest에 저장된
        source_key별 QualityCheckResult(PASS 포함)와 SchemaDriftFinding을 그대로
        반환한다 — 로그를 파싱하지 않고 JSON으로 조회 가능하다. `availability`가
        `available`/`partial`/`unavailable`를 구분하므로, 빈 `quality_results`가
        "0건 평가"인지 "애초에 계산된 적 없음"인지 클라이언트가 판별할 수 있다(#514).
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: run의 quality_results/schema_drift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildQualityResponse"
              examples:
                EvaluatedQuality:
                  summary: PASS와 WARN 및 schema drift를 포함한 run quality
                  value:
                    run_id: air-quality-20260815
                    availability: available
                    evaluated_checks: 2
                    quality_results:
                      air:
                        - source_key: air
                          category: row_count
                          rule: min_rows
                          column: null
                          status: pass
                          actual: 25
                          threshold: 10
                          affected_rows: null
                          evaluated_rows: null
                          detail: null
                        - source_key: air
                          category: missing
                          rule: max_null_ratio
                          column: pm10_value
                          status: warn
                          actual: 0.04
                          threshold: 0.01
                          affected_rows: 1
                          evaluated_rows: 25
                          detail: null
                    schema_drift:
                      air:
                        - kind: column_added
                          column: station_code
                          detail: column added since previous successful run
                LegacyQualityUnavailable:
                  summary: quality 결과가 없던 legacy run
                  value:
                    run_id: air-quality-legacy
                    availability: unavailable
                    evaluated_checks: 0
                    quality_results: {}
                    schema_drift: {}
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                RunNotFound:
                  summary: manifest가 없는 run
                  value:
                    error: "manifest not found: missing-run"

  /quality/issues:
    get:
      operationId: listQualityIssues
      summary: Actionable quality findings across the caller's tables (#843)
      description: >-
        Reads each table's latest run. Every check with status `warn` or `fail` is a
        row (`kind: check`, the per-run `QualityCheckResult` unchanged), and so is every
        schema drift finding (`kind: drift`, `status: drift` — drift gates nothing and
        is never counted as a failure). Rows are ordered fail, warn, drift, then by
        table, source and rule. Filters apply before paging.
      parameters:
        - name: status
          in: query
          required: false
          description: Comma-separated or repeated; default all three.
          schema: {type: string}
        - name: dataset_id
          in: query
          required: false
          schema: {type: string, minLength: 1}
        - name: category
          in: query
          required: false
          description: A check category, or `schema_drift`.
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: cursor
          in: query
          required: false
          description: "`next_cursor` of the previous page."
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: One page of findings and the tables they were read from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityIssuesResponse"
        "400":
          description: An unknown status, an empty filter, a bad limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /quality/summary:
    get:
      operationId: getQualitySummary
      summary: >-
        최근 window(24h) cross-run quality aggregate (#486 후속, additive — API
        1.22.0). 접근 가능한 run들의 structured quality를 PASS/WARN/FAIL run 수로
        요약한다. Studio Home의 "QUALITY WARN (24H)" KPI가 임의 숫자 합성 없이
        authoritative aggregate를 읽도록 하는 bounded 집계다. 개별 run의
        `quality_results`/dataset/owner는 노출하지 않는다 — 그건 per-run
        `GET /builds/{run_id}/quality`의 몫이다. 시스템 observability
        (`GET /monitoring/summary`·`GET /monitoring/builds`, #516)와 도메인
        quality를 한 응답에 섞지 않는다. ENFORCE_OWNERSHIP+oidc principal이면
        본인이 접근 가능한 run만 집계한다(#505). legacy run(BuildSpec snapshot
        없음)은 structured quality가 없으므로 자연히 제외된다.
      parameters:
        - name: window
          in: query
          required: false
          description: "집계 기간. 현재 24h만 지원 (기본값: 24h)"
          schema:
            type: string
            enum: [24h]
            default: 24h
      responses:
        "200":
          description: 최근 window의 PASS/WARN/FAIL run 수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualitySummaryResponse"
              examples:
                RecentWindow:
                  summary: 최근 24h에 평가된 run 요약
                  value:
                    window: 24h
                    generated_at: "2026-09-01T09:30:00+00:00"
                    availability: available
                    total_runs: 7
                    evaluated_runs: 5
                    pass_runs: 3
                    warn_runs: 2
                    fail_runs: 1
        "400":
          description: 지원하지 않는 window 값
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /query:
    post:
      operationId: queryBuiltDataset
      summary: 서버가 resolve한 Silver/Gold table에 read-only SQL 실행
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              AveragePm10ByStation:
                summary: 서버가 resolve한 Silver table 집계
                value:
                  dataset_id: seoul-air-quality
                  run_id: air-quality-20260815
                  stage: silver
                  source: air
                  sql: SELECT station_name, AVG(pm10_value) AS avg_pm10 FROM dataset GROUP BY station_name ORDER BY avg_pm10 DESC
                  limit: 100
      responses:
        "200":
          description: bounded query result preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              examples:
                AveragePm10Result:
                  summary: bounded row 결과와 현재 1.9.0 실행 시간 필드
                  value:
                    columns: [station_name, avg_pm10]
                    column_meta:
                      - {name: station_name, logical_type: string, wire_encoding: string}
                      - {name: avg_pm10, logical_type: float64, wire_encoding: number}
                    rows:
                      - station_name: 종로구
                        avg_pm10: 31.5
                      - station_name: 중구
                        avg_pm10: 28.0
                    truncated: false
                    execution_ms: 7
                    startup_ms: 12
                    engine_execution_ms: 5
        "400":
          description: invalid context, unsafe SQL, syntax/execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UnsafeQuery:
                  summary: write statement가 포함된 SQL 거부
                  value:
                    error: only read-only SELECT queries are allowed
                    code: unsafe_query
                InvalidContext:
                  summary: dataset_id와 run snapshot이 일치하지 않음
                  value:
                    error: dataset does not match run snapshot
                    code: invalid_context
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            query context 소유권 위반(`forbidden`), 또는 build의 source 약관이 재배포를
            금지함(`redistribution_forbidden`, #688 — body에 `redistribution`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                Forbidden:
                  summary: 다른 principal 소유 run
                  value:
                    error: forbidden
                    code: forbidden
        "404":
          description: stage artifact unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ArtifactUnavailable:
                  summary: 요청 stage의 table artifact가 없음
                  value:
                    error: query artifact unavailable
                    code: artifact_unavailable
        "429":
          description: query 전용 capacity 포화. child process는 생성되지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                QueryBusy:
                  summary: query 전용 동시 실행 capacity 포화
                  value:
                    error: query is busy
                    code: query_busy
        "504":
          description: query process timeout 및 강제 종료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                QueryTimeout:
                  summary: 격리된 query process 제한 시간 초과
                  value:
                    error: query timed out
                    code: query_timeout
        "503":
          $ref: "#/components/responses/PiiDeclarationUnavailable"

  /warehouse/tables:
