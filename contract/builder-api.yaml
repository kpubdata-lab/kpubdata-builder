                    updated_at: "2026-08-16T09:00:03+00:00"
                    created_by: oidc:user-a
        "400":
          description: 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: run 소유자가 아님
          content:
            application/json:
