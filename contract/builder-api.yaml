          description: artifact 파일 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsResponse"
              examples:
                BuildArtifacts:
                  summary: run 디렉터리 기준 상대 경로 목록
                  value:
                    run_id: air-quality-20260815
                    files:
                      - buildspec.yaml
                      - manifest.json
                      - artifacts/air-quality.jsonl
                      - silver/air/table.parquet
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                RunNotFound:
                  summary: 존재하지 않는 run
                  value:
                    error: "run not found: missing-run"

  /artifacts/{run_id}/{file_path}:
    get:
      operationId: getBuildArtifactFile
      summary: 실행 워크스페이스의 산출물 파일 하나를 내려받기
      description: >-
        `file_path` is one entry of `GET /artifacts/{run_id}`'s `files`: a POSIX path
        relative to the run directory, sent with its `/` separators as they are (each
        segment may be percent-encoded). Declared since v1.63.0; the route itself is
        older (#323). The response's `Content-Type` follows the file's extension
        (`.json` is `application/json`). A Gold output's dataset card
        `gold/<source>/card.json` — and its copies in a Kaggle package or a Hugging Face
        layout under that directory — is a `DatasetCard` (#694, #955); no other file's
        body is described here.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: file_path
          in: path
          required: true
          description: Run-relative POSIX path; may span several segments.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The file's bytes, with the `Content-Type` of its extension. A `card.json`
            is a `DatasetCard` (a JSON object with `card_version`); other JSON files
            are not described by this operation.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DatasetCard"
                  - description: >-
                      Any other JSON artifact (manifest, exporter metadata), not described
                      here. A top-level object with `card_version` is a dataset card.
                    not:
                      type: object
                      required: [card_version]
              examples:
                DatasetCard:
                  summary: "`gold/<source>/card.json` — a licence mismatch and declared processing"
                  value:
                    card_version: 1
                    title: Seoul Air Quality
                    provenance:
                      - source: datago.air_quality
                        institution: 한국환경공단 에어코리아
                        url: https://www.data.go.kr/data/15073861/openapi.do
                        license: "CC-BY-4.0; the provider declares: KOGL-1"
                        collected_at: "2026-09-30 01:23 UTC"
                        license_declared: CC-BY-4.0
                        license_provider: KOGL-1
                        license_mismatch: true
                    processing:
                      - Renamed v to value
                      - Converted value to int
                    processing_declared: true
                    personal_information: >-
                      No column was declared personal information. Values were not scanned
                      for personal information (no pii policy).
                DatasetCardNoProcessing:
                  summary: "`card.json` of a source with nothing declared and no provider terms"
                  value:
                    card_version: 1
                    title: Uploaded Survey
                    provenance:
                      - source: survey
                        institution: Example Institute
                        url: uploaded file
                        license: CC-BY-4.0
                        collected_at: "2026-09-30 01:23 UTC"
                        license_declared: CC-BY-4.0
                        license_provider: null
                        license_mismatch: false
                    processing:
                      - "No transformation declared: values are as the source gave them."
                    processing_declared: false
                    personal_information: >-
                      No column was declared personal information. Values were scanned
                      (pii mode: warn); columns that looked like personal information were
                      reported, not removed.
        "400":
          description: 경로 안전하지 않은 run_id·file_path, 또는 파일이 아닌 경로
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The source terms forbid redistribution (#688, `redistribution_forbidden`),
            or the file is a Bronze or Silver file of a source with declared PII
            (#900, `declared_pii_withheld`): raw records and Parquet hold it as is,
            so they do not leave. Gold files hold it masked and are served.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RedistributionForbiddenError"
                  - $ref: "#/components/schemas/DeclaredPiiWithheldError"
              examples:
                DeclaredPiiWithheld:
                  summary: 선언된 PII가 평문으로 담긴 Silver 파일
                  value:
                    error: >-
                      silver files hold the declared PII columns siteTel in plain text,
                      so they cannot be downloaded; Gold holds the table with them masked
                    code: declared_pii_withheld
                    columns: [siteTel]
        "404":
          description: run 또는 파일을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/PiiDeclarationUnavailable"

  /builds/{run_id}:
    get:
      operationId: getBuildJob
      summary: 비동기 build job 상태 polling (#482, #480)
      description: >-
        active(queued/running) 또는 terminal(succeeded/failed) async build job의
        상태를 반환한다. 성공한 잡은 `response`에 최종 build 응답 본문을 포함하고,
        실패한 잡의 `response`는 오류 본문이거나 null이다(#921) — 사유는 `error`.
        active 구간(run directory/manifest가 아직 없는)도 async job registry로
        인지하며, ownership 판정은 `/builds/{run_id}/events`와 동일한
        canonical 규칙(manifest 우선, active는 registry snapshot의 stable
        owner_id)을 따른다. 잡 상태가 404면 이후에도 상태가 생성되지 않는다 —
        registry는 프로세스 메모리 상주라 서버 재시작 후 active 잡은 조회되지
        않는다(#482 restart semantics).
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: build job 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJob"
              examples:
                Running:
                  summary: 실행 중인 job
                  value:
                    run_id: run-0123456789abcdef
                    status: running
                    created_at: "2026-08-16T09:00:00+00:00"
                    updated_at: "2026-08-16T09:00:01+00:00"
                    created_by: oidc:user-a
                Succeeded:
                  summary: 완료된 job(최종 build 응답 포함)
                  value:
                    run_id: run-0123456789abcdef
                    status: succeeded
                    created_at: "2026-08-16T09:00:00+00:00"
                    updated_at: "2026-08-16T09:00:07+00:00"
                    created_by: oidc:user-a
                    response:
                      run_id: run-0123456789abcdef
                      status: ok
                Failed:
                  summary: 빌드 본문이 생기기 전에 실패한 job (#921)
                  value:
                    run_id: run-0123456789abcdef
                    status: failed
                    created_at: "2026-08-16T09:00:00+00:00"
                    updated_at: "2026-08-16T09:00:02+00:00"
                    created_by: oidc:user-a
                    response:
                      error: provider client unavailable
                    error: provider client unavailable
        "400":
          description: 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: run 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 알려지지 않은 run(완료 run 포함, registry에 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/cancel:
    post:
      operationId: cancelBuildJob
      summary: 비동기 build job 협력적 취소 요청 (#481, ADR 0008)
      description: >-
        active(`queued`/`running`) async build job의 취소를 요청한다. worker
        thread를 강제로 종료하지 않는다 — `queued` job은 worker가 runner를
        실행하기 전에 곧바로 `cancelled`로 종결되고(파이프라인 산출물 0개),
        `running` job은 즉시 `cancelling`으로 표시된 뒤 **안전한 stage
        경계**(Bronze/Silver/Gold 산출물이 기록된 뒤 다음 stage를 시작하기 전)에서
        `cancelled`로 종결된다. 실행 중인 stage를 중간에 끊지 않으므로 응답
        시점에 job이 아직 `cancelling`일 수 있다 — 최종 상태는
        `GET /builds/{run_id}`로 확인한다. 취소 시점까지 만들어진 산출물은
        삭제하지 않고 `partial: true` manifest(`status: cancelled`)와 함께
        보존한다. 이미 `cancelling`/`cancelled`인 job에 다시 요청해도 현재
        상태를 그대로 200으로 돌려주는 멱등 연산이다. ownership 판정은
        `GET /builds/{run_id}`와 동일한 canonical 규칙(manifest 우선, active는
        registry snapshot의 stable owner_id)을 따른다.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: >-
            취소가 접수됨(또는 이미 취소된 job에 대한 멱등 재요청). 본문은 전이
            직후의 job 스냅샷이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJob"
              examples:
                QueuedCancelled:
                  summary: 실행 전 queued job이 즉시 종결 취소됨
                  value:
                    run_id: run-0123456789abcdef
                    status: cancelled
                    created_at: "2026-08-16T09:00:00+00:00"
                    updated_at: "2026-08-16T09:00:02+00:00"
                    created_by: oidc:user-a
                RunningCancelling:
                  summary: running job에 취소를 요청함(다음 안전 경계에서 종결)
                  value:
                    run_id: run-0123456789abcdef
                    status: cancelling
                    created_at: "2026-08-16T09:00:00+00:00"
                    updated_at: "2026-08-16T09:00:03+00:00"
                    created_by: oidc:user-a
        "400":
          description: 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: run 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 알려지지 않은 run(registry에 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            더 이상 취소할 수 없는 job — 이미 `succeeded`/`failed`로 끝났거나,
            파이프라인이 마지막 안전 경계를 지나 정상 종료로 확정했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/manifest:
