  /preview:
    post:
      operationId: previewBuild
      summary: 각 소스의 스키마와 샘플 행 산출 (파일 미기록, 동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
            examples:
              AirQualityPreview:
                summary: 최대 2행의 대기질 preview 요청
                value:
                  spec: |
                    dataset_id: seoul-air-quality
                    title: 서울 대기질 관측
                    description: 서울 지역 측정소별 대기오염 관측 데이터
                    sources:
                      - provider: datago
                        dataset: air_quality
                        alias: air
                    exports:
                      - kind: jsonl
                        output_path: artifacts/air-quality.jsonl
                  limit: 2
      responses:
        "200":
          description: preview 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
              examples:
                AirQualityPreview:
                  summary: 정규화된 스키마, 표본, 통계와 품질 결과
                  value:
                    dataset_id: seoul-air-quality
                    previews:
                      - source_key: air
                        status: ok
                        error: null
                        schema:
                          - name: station_name
                            dtype: String
                            nullable: false
                            unique_count: 2
                            logical_type: string
                            wire_encoding: string
                          - name: pm10_value
                            dtype: Int64
                            nullable: true
                            unique_count: 2
                            logical_type: int64
                            wire_encoding: number
                        sample:
                          - station_name: 종로구
                            pm10_value: 31
                          - station_name: 중구
                            pm10_value: 28
                        total_rows: 25
                        statistics:
                          row_count: 25
                          null_counts:
                            station_name: 0
                            pm10_value: 1
                          duplicate_rate: 0.0
                        quality_results:
                          - source_key: air
                            category: row_count
                            rule: min_rows
                            column: null
                            status: pass
                            actual: 25
                            threshold: 1
                            affected_rows: null
                            evaluated_rows: null
                            detail: null
                        source_sample:
                          - station_name: 종로구
                            pm10_value: 31
                          - station_name: 중구
                            pm10_value: 28
                        sample_mode: first
                        diff_available: true
                        diffs: []
                        transform_summary:
                          changed_cells: 0
                          changed_rows: 0
                        diff_truncated: false
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, limit 타입 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
              examples:
                InvalidLimit:
                  summary: 양수가 아닌 preview limit
                  value:
                    error: "'limit' must be a positive integer"
        "403":
          description: >-
            Refused before any provider request. `provider_credential_required` (#786):
            the deployment requires the requester's own provider key and there is none
            (`providers` lists them). `url_source_forbidden` (#685): a multi-user
            deployment does not allow `url` sources (`sources` lists each by index and
            path).
            `redistribution_forbidden` (#688), after the fetch: the sources' terms forbid
            redistribution; the body carries `redistribution` (RedistributionVerdict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: principal credential로 Provider client를 생성할 수 없음
        "503":
          $ref: "#/components/responses/PiiDeclarationUnavailable"

  /build:
    post:
      operationId: createBuild
      summary: 파이프라인 실행 및 결과 반환 (동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
            examples:
              BuildAirQuality:
                summary: 명시적인 안전한 run_id로 동기 build 실행
                value:
                  spec: |
                    dataset_id: seoul-air-quality
                    title: 서울 대기질 관측
                    description: 서울 지역 측정소별 대기오염 관측 데이터
                    sources:
                      - provider: datago
                        dataset: air_quality
                        alias: air
                    exports:
                      - kind: jsonl
                        output_path: artifacts/air-quality.jsonl
                  run_id: air-quality-20260815
      responses:
        "200":
          description: 모든 소스 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSuccessResponse"
              examples:
                BuildCompleted:
                  summary: Bronze, Silver, Gold를 완료한 동기 build
                  value:
                    status: ok
                    run_id: air-quality-20260815
                    outcomes:
                      - source_key: air
                        status: ok
                        stages_completed: [bronze, silver, gold]
                        error: null
                    manifest: build/air-quality-20260815/manifest.json
                    api_version: "1.8.0"
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, run_id 타입/경로 안전성 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
              examples:
                UnsafeRunId:
                  summary: 경로 구분자를 포함한 run_id
                  value:
                    error: run_id must be a path-safe single segment
        "403":
          description: >-
            Refused before any provider request. `provider_credential_required` (#786):
            the deployment requires the requester's own provider key and there is none
            (`providers` lists them). `url_source_forbidden` (#685): a multi-user
            deployment does not allow `url` sources (`sources` lists each by index and
            path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >-
            Every source built, but a warehouse table was not committed (#788) — most
            often because another build committed it after this run started, so the
            newer snapshot stays current (#787). `warehouse_failures` names each source
            and the reason. The run's outputs and manifest exist; only the table did
            not move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSuccessResponse"
        "502":
          description: >-
            하나 이상의 소스 fetch/stage 실패. upstream 소스 의존 실패이며 매니페스트는
            partial 정책으로 남는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildFailureResponse"
              examples:
                ProviderFetchFailed:
                  summary: upstream fetch 실패 후 partial manifest를 남긴 build
                  value:
                    status: failed
                    run_id: air-quality-20260815
                    outcomes:
                      - source_key: air
                        status: failed
                        stages_completed: []
                        error: provider request failed
                    manifest: build/air-quality-20260815/manifest.json
                    api_version: "1.8.0"
                    error: provider request failed

  /artifacts/{run_id}:
    get:
      operationId: listBuildArtifacts
      summary: 실행 워크스페이스의 산출물 파일 목록 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
