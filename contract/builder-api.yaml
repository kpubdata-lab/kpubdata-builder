        - run_id
        - stage
        - source_key
        - status
        - available
        - provider
        - dataset
        - fetched_at
        - record_count
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [bronze]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        provider:
          type: [string, "null"]
        dataset:
          type: [string, "null"]
        fetched_at:
          type: [string, "null"]
        record_count:
          type: [integer, "null"]

    SilverColumnInfo:
      type: object
      additionalProperties: false
      required: [name, dtype, nullable, unique_count]
      properties:
        name:
          type: string
        dtype:
          type: string
        nullable:
