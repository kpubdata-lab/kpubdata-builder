  /warehouse/query:
    post:
      operationId: queryWarehouseTable
      summary: Read-only SQL against a pinned warehouse snapshot (#797)
      description: >-
        The SQL names the table as `dataset`, the same sandbox as `POST /query`.
        `snapshot: current` (the default) is resolved to a snapshot id once, under a
        lease, before the query starts: a refresh committed while it runs does not
        change what it reads, and garbage collection leaves the snapshot alone until it
        finishes. A snapshot id reads that snapshot, and only when it belongs to the
        named table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseQueryRequest"
            examples:
              CurrentSnapshot:
                summary: Query the current snapshot of a table
                value:
                  table: seoul-air-quality.air
                  sql: SELECT COUNT(*) AS n FROM dataset
                  limit: 10
      responses:
        "200":
          description: The snapshot that was read and the bounded result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseQueryResponse"
              examples:
                PinnedCount:
                  summary: A query read the pinned current snapshot
                  value:
                    snapshot:
                      table_id: tbl_7f3a
                      logical_name: seoul-air-quality.air
                      snapshot_id: snap_20260929_01
                      revision: 3
                    result:
                      columns: [station_name, pm10, amount]
                      column_meta:
                        - {name: station_name, logical_type: string, wire_encoding: string}
                        - {name: pm10, logical_type: int64, wire_encoding: number}
                        - {name: amount, logical_type: decimal, wire_encoding: decimal_string}
                      rows:
                        - {station_name: 종로구, pm10: 42, amount: "12.50"}
                      truncated: false
                      execution_ms: 412
                      startup_ms: 380
                      engine_execution_ms: 12
        "400":
          description: Invalid request, unsafe SQL, or a failed execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RedistributionForbidden"
        "404":
          description: >-
            No warehouse (`warehouse_not_configured`), no such table in the caller's
            workspace (`table_not_found`), no such snapshot of it or nothing committed
            yet (`snapshot_not_found`), or a snapshot without a table file
            (`artifact_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The snapshot cannot be read — it is being deleted or was never committed
            (`snapshot_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Query capacity is exhausted (`query_busy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The query timed out (`query_timeout`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /warehouse/rows:
    post:
      operationId: readWarehouseRows
      summary: One page of a pinned warehouse snapshot for a table screen (#815)
      description: >-
        Pins the snapshot like `POST /warehouse/query`: `current` (the default) is
        resolved to a snapshot id once, under a lease, and the response names it. Pass
        that `snapshot_id` for the next pages and every page reads the same snapshot,
        whatever refresh is committed in between. Rows are ordered by `sort` and then by
        their position in the snapshot, so rows that tie on every key keep one order and
        no page repeats or skips them. Nulls sort last in either direction. That position
        is valid inside one snapshot only and is not sent. `count` is `exact` or
        `not_computed` — a count that was not computed is null, never 0. Paging is by
        offset; `engine_execution_ms` reports what a page cost. Values use the same wire
        encoding as a query (see `WireEncoding`). Another owner's table is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseRowsRequest"
            examples:
              FirstPage:
                summary: The first page of the current snapshot, newest first
                value:
                  table: seoul-air-quality.air
                  page_size: 50
                  sort:
                    - {column: measured_at, direction: desc}
                  filters:
                    - {column: station_code, op: in, values: ["111121", "111123"]}
                  count: exact
      responses:
        "200":
          description: The snapshot read, one page of rows, and the count with its status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseRowsResponse"
              examples:
                FirstPage:
                  summary: A first page with more to come
                  value:
                    snapshot:
                      table_id: tbl_7f3a
                      logical_name: seoul-air-quality.air
                      snapshot_id: snap_20260929_01
                      revision: 3
                    columns: [station_code, measured_at, pm10]
                    column_meta:
                      - name: station_code
                        logical_type: identifier
                        wire_encoding: string
                        semantic: {kind: code, origin: core_spec}
                      - {name: measured_at, logical_type: datetime, wire_encoding: string}
                      - {name: pm10, logical_type: int64, wire_encoding: number}
                    rows:
                      - {station_code: "111121", measured_at: "2026-09-29T10:00:00", pm10: 42}
                    order:
                      - {column: measured_at, direction: desc}
                    page: {offset: 0, page_size: 1, returned: 1, has_more: true, next_offset: 1}
                    count: {status: exact, value: 48}
                    execution_ms: 431
                    startup_ms: 390
                    engine_execution_ms: 14
        "400":
          description: >-
            An invalid request (`invalid_request`) — an unknown field, a column the
            snapshot lacks, a filter value that does not fit the column's type — or a
            read that failed (`query_execution_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RedistributionForbidden"
        "404":
          description: >-
            No warehouse (`warehouse_not_configured`), no such table in the caller's
            workspace (`table_not_found`), no such snapshot of it (`snapshot_not_found`),
            or a snapshot without a table file (`artifact_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The snapshot cannot be read (`snapshot_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Query capacity is exhausted (`query_busy`); a page takes a query slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The read timed out (`query_timeout`). No count is reported as 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /warehouse/aggregate:
    post:
      operationId: aggregateWarehouseTable
      summary: A validated aggregate over a pinned warehouse snapshot (#818)
      description: >-
        Pins the snapshot like `POST /warehouse/query` and names it in the response;
        pass that `snapshot_id` to get the same answer again whatever is committed
        meanwhile. Only named functions over existing columns of a fitting type are
        accepted. `count_rows` counts rows, `count` a column's non-null values,
        `count_null` its nulls and `count_distinct` its distinct non-null values. `sum`
        needs `additive: true` — a numeric column is not additive by default — and a
        group with no non-null value sums to null, not 0. When the rows carry their
        unit in `unit_column`, a group mixing units is refused (`unit_policy: reject`,
        422 `mixed_units`) or split by unit (`split`); units are never converted. Every
        row that passes `filters` is aggregated, and only then are the groups sorted
        by `order_by` (ties by the group keys, nulls last) and the first `limit`
        returned; `result.group_count` says how many there were in all, so
        `result.completeness` tells a full result from a top-N one. Aggregates are
        never computed over a sample. Output column metadata is read from the
        aggregate's own types; no hint of an input column carries over. Runs in the
        query child process under the same timeout, memory cap and concurrency limit
        as a query. Another owner's table is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseAggregateRequest"
            examples:
              TopRegions:
                summary: The five regions with the most people, unit checked
                value:
                  table: stats.population
                  group_by: [region]
                  measures:
                    - {fn: sum, column: people, additive: true, as: total}
                    - {fn: count_rows, as: rows}
                  unit_column: unit
                  order_by:
                    - {key: total, direction: desc}
                  limit: 5
      responses:
        "200":
          description: The snapshot read, the groups, and whether they are all of them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseAggregateResponse"
              examples:
                TopRegions:
                  summary: The top two of three groups
                  value:
                    snapshot:
                      table_id: tbl_7f3a
                      logical_name: stats.population
                      snapshot_id: snap_20260930_01
                      revision: 4
                    columns: [region, unit, total, rows]
                    column_meta:
                      - {name: region, logical_type: string, wire_encoding: string}
                      - {name: unit, logical_type: string, wire_encoding: string}
                      - {name: total, logical_type: int64, wire_encoding: number}
                      - {name: rows, logical_type: int64, wire_encoding: number}
                    rows:
                      - {region: b, unit: 명, total: 90, rows: 3}
                      - {region: a, unit: 명, total: 60, rows: 3}
                    group_by: [region]
                    measures:
                      - {as: total, fn: sum, column: people, additive: true, unit_column: unit}
                      - {as: rows, fn: count_rows, column: null, additive: null, unit_column: null}
                    order:
                      - {key: total, direction: desc}
                    unit: {column: unit, policy: reject, check: single_unit}
                    input: {row_count: 8, sampled: false}
                    result: {completeness: top_n, group_count: 3, returned: 2, limit: 2}
                    execution_ms: 412
                    startup_ms: 380
                    engine_execution_ms: 9
        "400":
          description: >-
            An invalid request (`invalid_request`) — an unknown field or function, a
            column the snapshot lacks, a function the column's type does not allow,
            `sum` without `additive: true`, an `order_by` key that is neither a group
            column nor a measure — or an aggregate that failed (`query_execution_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RedistributionForbidden"
        "404":
          description: >-
            No warehouse (`warehouse_not_configured`), no such table in the caller's
            workspace (`table_not_found`), no such snapshot of it (`snapshot_not_found`),
            or a snapshot without a table file (`artifact_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The snapshot cannot be read (`snapshot_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The aggregate was computed but is refused rather than cut short:
            `mixed_units` (a group mixes units of `unit_column`), `too_many_groups`
            (more than 100000 groups before the top N) or `result_too_large` (the
            result exceeds what a response may carry). No rows are sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseAggregateRefusal"
        "429":
          description: Query capacity is exhausted (`query_busy`); an aggregate takes a query slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The aggregate timed out (`query_timeout`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /warehouse/exports:
    post:
      operationId: createWarehouseExport
      summary: Export a pinned query's full result through the policy checks (#819)
      description: >-
        Runs read-only SQL against a pinned snapshot (`current` is resolved once, like
        `POST /warehouse/query`) and keeps its **complete** result as a zip bundle: the
        data file, `manifest.json` and `NOTICE.md`. Policy is checked first: a source
        whose declared licence forbids derivatives (KOGL type 3 or 4, a Creative Commons
        `nd` licence) is refused before the query runs, since an export of a query is a
        derived work; text values matching the build's PII patterns are refused unless
        the source's PII policy is `allow` or lists the column in `allow_columns`. A
        result over `max_rows` or the byte limit is refused (422) and nothing is kept —
        never a short file presented as complete. The manifest records the SQL, the
        snapshot id, the table revision and the snapshot's artifact digest, the source's
        licence terms verbatim (never restated as another licence), its provenance and
        coverage, `user_derived: true`, and every value the `spreadsheet` profile altered.
        `machine` writes values exactly as the wire encoding sends them (UTF-8, no BOM,
        nothing altered). `spreadsheet` adds a BOM and prefixes text cells starting with
        `= + - @`, a tab or a CR with an apostrophe; the BOM does not stop a spreadsheet
        from dropping leading zeros, rounding large integers or converting dates. Runs
        synchronously in the query child process (memory cap, concurrency slot, a 60 s
        timeout). Exports expire after 24 hours; a workspace keeps at most 20.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseExportRequest"
            examples:
              Spreadsheet:
                summary: A query result for opening in a spreadsheet
                value:
                  table: seoul-air-quality.air
                  sql: SELECT station_code, pm10 FROM dataset
                  profile: spreadsheet
      responses:
        "200":
          description: The export, complete, with its manifest and where to download it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseExport"
              examples:
                Completed:
                  summary: A completed spreadsheet export
                  value:
