openapi: 3.1.0
info:
  title: KPubData Builder Service API
  version: "1.27.0"
  description: >-
    Builder 중심 서비스 계약. BuildSpec 검증, preview, build 실행, artifact 조회,
    계약 버전 조회를 제공한다. CLI와 HTTP service mode(#36)가 동일한 도메인 계약을
    공유한다. 본 문서는 BuilderService(service/app.py)의 dispatch 라우팅과 실제
    wire 형태를 기계 판독용(OpenAPI 3.1) 단일 소스로 고정하며, Studio 같은 소비자가
    타입 클라이언트를 생성하는 기준이 된다. v0.4에서는 동기식 build만 유지하며
    비동기/publish 엔드포인트는 제외된다(ADR 0002, #226). v1.5.0은 built dataset
    단위 조회(dataset_id로 여러 run을 grouping)와 Bronze/Silver/Gold stage
    summary/preview API를 추가했다(#488, additive). v1.6.0은 구조화된 Quality/Schema
    Drift 결과(PASS 포함 모든 evaluated check)와 dataset별 quality history/trend
    API를 추가한다(#486, additive — 기존 엔드포인트는 변경되지 않는다). `GET
    /builds/{run_id}/quality`는 `availability`(`available`/`partial`/`unavailable`)와
    `evaluated_checks`를 함께 반환해 "0건 평가"와 "애초에 계산된 적 없음"을
    구분한다(#514, additive). v1.7.0은 Silver/Gold read-only `/query`를
    추가한다(#504, additive). v1.8.0은 stable principal별 encrypted Provider
    credential CRUD와 Provider status/test API를 추가한다(#492, additive). v1.9.0은
    `/query` 응답에 child startup과 Polars engine 실행 시간을 추가한다(#523, additive).
    v1.10.0은 `POST /preview`에 Source↔Silver diff와 sample_mode(first/random)
    옵션을 추가한다(#497, additive — 기존 필드는 유지된다). `limit`의 상한(1000)을
    새로 도입해 그 이상 값을 요청하면 400을 반환한다(behavioral tightening;
    이전에는 상한이 없었다). `limit`이 행 수만 제한하므로 wide dataset에서
    `diffs` 자체가 무제한 커질 수 있어, `diffs`도 별도 상한(1000)으로 자르고
    `diff_truncated`로 명시한다 — `transform_summary`의 집계는 잘리지 않는다.
    v1.11.0은 `GET /monitoring/summary`와 `GET /monitoring/builds`를
    추가한다(#516, additive — 기존 엔드포인트는 변경되지 않는다). Studio
    Monitoring 화면을 위한 시스템/집계 observability만 다루며 Run 단위 이벤트는
    별도(#496)다. Async build queue/worker 상태는 기존
    `AsyncBuildExecutor`/`AsyncBuildJobRegistry`(#511/#513)의 read-only
    snapshot을 반영한다 — 정상 Builder runtime에서는 `availability: available`
    이며 실제 0건과 `unavailable`을 구분한다. Builder API latency는
    healthy/degraded 임계값 근거가 없어 판정 없이 raw
    `sample_count`/`p95_latency_ms`만 제공한다. 대신
    `MonitoringSummaryResponse.status`(`healthy`/`degraded`)는 required
    subsystem(`api`/`queue`/`workers`/`artifact_store`)의 availability로부터
    계산되는 deterministic aggregate이며 latency threshold는 사용하지 않는다.
    Provider 상태는 요청마다 네트워크 프로브를 유발하므로(#492) 이번
    버전에서는 응답에도, aggregate status 판정에도 포함하지 않는다.
    v1.12.0은 BuildSpec.composition(JoinSpec)과 POST /build 응답의 composition
    키, manifest.composition(CompositionProvenance)을 추가한다(#506, additive
    — 기존 필드/엔드포인트는 변경되지 않는다). v1.13.0은 Public API·File·URL
    source를 동일한 canonical contract와
    Bronze→Silver→Gold pipeline으로 처리한다(#498, additive). BuildSpec
    `sources[]`에 `kind`(`public_api`/`file`/`url`)를 추가하며, `kind`를 생략한
    기존 source는 항상 `public_api`로 해석되어 기존 동작이 그대로 유지된다.
    `kind="file"` source를 위해 `POST /uploads`, `GET /uploads/{upload_id}`,
    `DELETE /uploads/{upload_id}`를 추가한다 — 업로드는 principal의 owner_id로
    격리되고 서버가 즉시 파싱 가능성을 검증한다. `kind="url"` source는 P0
    범위(GET, Auth=None, https만 허용)로 SSRF를 방어하는 safe fetch(DNS
    재검증, redirect마다 재검증, 응답 크기 상한)를 거친다. 두 kind 모두 기존
    Bronze artifact/provenance 계약을 그대로 재사용하며, provenance/manifest에
    로컬 파일 경로나 쿼리스트링 secret을 남기지 않는다.
    v1.14.0은 `GET /builds/{run_id}/events`를 추가한다(#496, additive — 기존
    엔드포인트는 변경되지 않는다). run 실행 과정(submitted/started/finished/
    failed, source fetch started/completed/failed, medallion
    stage(bronze/silver/gold/export) started/completed/failed, quality
    checkpoint)을 raw logger parsing 없이 append-only structured event
    timeline으로 조회한다. `limit`(기본 200, 상한 1000)과 `tail`로 bounded
    query를 제공하며, 반환은 항상 chronological ascending이다. event의
    ordering identifier(`seq`)는 store가 append 시점에 부여하는 monotonic
    값이라 병렬 source 간 실제 append 순서를 손실 없이 보존한다. Monitoring
    (#516, `GET /monitoring/summary`·`GET /monitoring/builds`)은 시스템/집계
    observability를 다루고, 이 endpoint는 단일 run의 event만 다룬다 — 역할이
    분리되어 있다. v1.15.0은 `/catalog` 응답(CatalogDataset)에 탐색용
    metadata(`description`/`tags`/`source_url`/`representation`/`operations`/
    `query_support`)를 추가한다(#490, additive — 기존 필드는 유지되며
    raw_metadata는 노출하지 않는다).
    v1.16.0은 async build job 표면을 계약에 문서화한다 — `POST /builds`(202
    접수/200 idempotent 재제출(#513)/409 완료 run 충돌/429 queue full)와
    `GET /builds/{run_id}`(잡 상태 polling, 성공 잡의 최종 build 응답 포함)을
    추가한다(#480, additive). 잡 상태 조회에 ownership 게이트를 적용해
    cross-owner의 build 출력 노출을 차단한다(behavioral tightening — 이전에는
    미검사였음).
    v1.17.0은 build publish 표면을 추가한다(#491) — `GET /builds/{run_id}/publish/readiness`(ready/blockers/warnings)와 `POST /builds/{run_id}/publish`(idempotent publish receipt, TOCTOU 재검사)를 추가한다(additive). HTTP target은 `huggingface`로 한정한다.
    v1.21.0은 publish 감사 로그 조회를 추가한다(#563, additive) — `GET /builds/{run_id}/publish/audit`(reconcile/reset 이력, 소유권 게이트, receipt 삭제 후에도 조회).
    v1.22.0은 `GET /datasets` 응답에 `total`을 추가한다(#488 후속, additive — 기존 필드/동작은 변경되지 않는다). `total`은 canonical dataset grouping과 ownership 필터를 적용한 뒤 pagination(limit) 이전의 접근 가능한 distinct dataset_id 개수이며, Studio Home의 DATASETS KPI가 `datasets` 길이나 limit을 total로 오인하지 않도록 authoritative aggregate를 제공한다. 같은 릴리스 범위에서 `/catalog` 응답의 `CatalogDataset`에 `request_parameters`와 `application`도 추가한다(additive — 기존 필드/동작은 변경되지 않는다). `raw_metadata`의 요청 파라미터 설명을 secret-free allowlist(`name`/`required`/`description`/`example`)로 직렬화한 것으로, `serviceKey` 등 시크릿 파라미터는 제외된다. Add Data가 선택한 Dataset의 필수 요청 파라미터를 사전에 안내하는 데 쓴다. metadata가 없는 dataset은 빈 배열. `application`은 공공데이터포털처럼 API Key 발급과 Dataset별 활용신청이 별개일 수 있는 경우의 안내(`{required, url}`)로, `raw_metadata.application`에서 그대로 전달하며 없으면 null이다 — Studio는 신청 완료/승인 여부를 추측하지 않는다.
    v1.27.0은 `SourceRef`에 `param_grid`를 추가한다(#613, additive — 기존 필드/동작은 변경되지 않는다). 한 source 가 여러 파라미터 조합에 걸쳐 반복 호출하고 그 결과를 하나의 dataset 으로 이어붙일 수 있게 한다. 전개 순서는 계약이다(키 이름순 정렬, 마지막 키가 가장 빨리 변함, 축 안에서는 선언 순서 유지) — 순서가 바뀌면 Bronze 바이트가 바뀌어 재빌드 결정성이 깨지기 때문이다.
    v1.26.0은 `SchemaContract`에 `column_null_tokens`를 추가한다(#623, additive — 기존 필드/동작은 변경되지 않는다). 같은 의미의 결측이 컬럼마다 다르게 표기되는 원천을, 다른 컬럼의 의미를 바꾸지 않고 선언할 수 있게 한다. 한 컬럼에서 인정하는 결측 표현은 전역 `null_tokens` + 그 컬럼의 선언이다.
    v1.25.0은 `SchemaContract`에 `coalesce`와 `zfill`을 추가한다(#620, additive — 기존 필드/동작은 변경되지 않는다). `coalesce`는 세대별 alias 컬럼을 하나의 canonical 컬럼으로 모으고, `zfill`은 canonical 식별자를 선언된 폭으로 왼쪽 0 padding 한다. 같은 릴리스 범위에서 `casts`의 dtype 어휘에 `year_month`가 더해진다.
    v1.24.0은 `SchemaContract`에 `read_as`와 `null_tokens`를 추가한다(#613, additive — 기존 필드/동작은 변경되지 않는다). `read_as`는 레코드마다 타입이 다른 원천 컬럼을 선언으로 읽는 규칙이고(CSV는 파싱 단계에서 적용되어 앞자리 0이 보존된다), `null_tokens`는 결측을 나타내는 원천 표기를 캐스팅 전에 null로 모으는 선언이다.
    v1.23.0은 BuildSpec `sources[].schema`(`SchemaContract`)에 `rename`과 `derived`를 추가한다(#611, additive — 기존 필드/동작은 변경되지 않는다). `rename`은 원 필드명 → canonical 컬럼명 매핑으로 캐스팅보다 먼저 적용되며, `derived`는 `date_parts`/`join_key` typed 규칙으로 캐스팅 뒤에 새 컬럼을 만든다. 손으로 쓴 YAML만 지원하던 두 선언을 공개 계약에 올려 Studio와 타입 생성기가 발견/타이핑할 수 있게 한다.
    v1.20.0은 HTTP publish target 어휘를 확장한다(#550, additive) — `kaggle`(packaging의 `dataset-metadata.json` `id`가 destination과 일치해야 하며 `public` option 허용)과 `local`(`KPUBDATA_BUILDER_LOCAL_PUBLISH_ROOT` 안의 상대 `owner/name` 경로만 허용). `GET /publish/readiness`의 `destination` query는 선택이다.
    v1.19.0은 publish receipt 운영 경로를 추가한다(#551, additive) — `GET /builds/{run_id}/publish/receipt`(상태 조회, 소유자 불일치는 404), `POST /builds/{run_id}/publish/reconcile`(원격 상태 확인 후 `succeeded` 확정 또는 reset으로 재게시 허용; 판단 불가 시 503로 무변경), `DELETE /builds/{run_id}/publish/receipt`(명시적 reset, 감사 로그 기록).
    v1.18.0은 ADR 0008의 협력적 취소(cooperative cancellation)를 구현한다 —
    `POST /builds/{run_id}/cancel`을 추가한다(#481, additive). `queued` job은
    worker가 runner를 실행하기 전에 곧바로 `cancelled`로 종결되고(파이프라인
    산출물 0개), `running` job은 `cancelling`을 거쳐 **안전한 stage
    경계**(Bronze/Silver/Gold 산출물이 기록된 뒤, 다음 stage 시작 전)에서
    `cancelled`로 종결된다. worker thread를 강제로 죽이지 않으며, 실행 중인
    stage를 중간에 끊지 않는다. 이미 `succeeded`/`failed`인 job이나 파이프라인이
    정상 종료로 확정한 job에 대한 취소 요청은 409다. `BuildJobStatus` 어휘는
    기존 값을 그대로 재사용하며 새 상태를 만들지 않는다. 부분 산출물은 기본적으로
    삭제하지 않고 partial manifest와 함께 보존한다 — `BuildManifest`에
    `status`(`ok`/`failed`/`cancelled`)와 `partial`을 additive로 추가해, 취소된
    run이 성공 run으로 오인되지 않고 실행되지 않은 stage가 성공으로 기록되지
    않는다. run event 어휘에는 `run_cancelled`가 추가되며(run당 정확히 한 번,
    terminal 확정 시점) `BuildSummary.status`에도 `cancelled`가 관측 가능해진다.
servers:
  - url: http://localhost:8000
    description: 로컬 builder 개발 서버

security:
  - ApiKeyAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: 무인증 liveness probe (버전·메타 정보 없이 status만)
      security: []
      responses:
        "200":
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      operationId: getVersion
      summary: Builder API 계약 버전 조회
      responses:
        "200":
          description: 서비스/계약 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /catalog:
    get:
      operationId: getCatalog
      summary: provider/dataset 카탈로그 조회 (BL2, #416)
      responses:
        "200":
          description: 사용 가능한 provider와 dataset 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
              examples:
                PublicDataCatalog:
                  summary: 탐색용 metadata를 포함한 공공데이터 카탈로그
                  value:
                    providers:
                      - name: datago
                        datasets:
                          - name: air_quality
                            title: 대기오염정보
                            description: 측정소별 대기오염 물질 농도 조회
                            tags: [environment, air]
                            source_url: https://www.data.go.kr/data/15073861/openapi
                            representation: api_json
                            operations: [get, list]
                            query_support:
                              pagination: offset
                              filterable_fields: [station_name]
                              sortable_fields: []
                              time_range: true
                              max_page_size: 1000
                            requires_service_key: true
                            request_parameters:
                              - name: sidoName
                                required: true
                                description: 조회할 시·도
                                example: 서울
                            application:
                              required: true
                              url: https://www.data.go.kr/data/15073861/openapi.do
                          - name: village_fcst
                            title: 단기예보
                            description: null
                            tags: []
                            source_url: null
                            representation: api_json
                            operations: [list]
                            query_support: null
                            requires_service_key: true
                            request_parameters: []
                            application: null
                      - name: ecos
                        datasets:
                          - name: key_statistic_list
                            title: 주요 경제지표
                            description: 한국은행 주요 경제지표 시계열
                            tags: [economy]
                            source_url: null
                            representation: api_json
                            operations: [list]
                            query_support: null
                            requires_service_key: false
                            request_parameters: []
                            application: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: 카탈로그 조회 실패

  /providers:
    get:
      operationId: listProviders
      summary: 런타임 Provider와 현재 principal의 configured 상태 조회
      responses:
        "200":
          description: Provider 목록. credential 원문과 owner_id는 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/status:
    get:
      operationId: getProviderStatus
      summary: 현재 principal credential로 Provider 연결 상태 확인
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 연결 상태 또는 not_configured 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
              examples:
                Connected:
                  summary: 저장된 credential로 연결 성공
                  value:
                    provider: datago
                    status: connected
                    configured: true
                    latency_ms: 84
                    checked_at: "2026-08-15T09:30:00+00:00"
                NotConfigured:
                  summary: credential이 아직 설정되지 않음
                  value:
                    provider: datago
                    status: not_configured
                    configured: false
                    latency_ms: 0
                    checked_at: "2026-08-15T09:30:00+00:00"
                ProviderTimeout:
                  summary: Provider 연결 제한 시간 초과
                  value:
                    provider: datago
                    status: failed
                    configured: true
                    latency_ms: 10003
                    checked_at: "2026-08-15T09:30:10+00:00"
                    error_category: timeout
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/test:
    post:
      operationId: testProviderConnection
      summary: 현재 principal credential로 lightweight connection test 실행
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 구조화된 connection test 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
              examples:
                Connected:
                  summary: lightweight 연결 시험 성공
                  value:
                    provider: datago
                    status: connected
                    configured: true
                    latency_ms: 91
                    checked_at: "2026-08-15T09:30:00+00:00"
                AuthenticationFailed:
                  summary: Provider가 credential을 거부함
                  value:
                    provider: datago
                    status: failed
                    configured: true
                    latency_ms: 72
                    checked_at: "2026-08-15T09:30:00+00:00"
                    error_category: auth
                    response_code: 401
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
