                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RedistributionForbidden"
        "404":
          description: >-
            No warehouse, no such table or snapshot in the caller's workspace, or a
            snapshot without a table file — the same codes as `POST /warehouse/query`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The snapshot cannot be read or held (`snapshot_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Query capacity is exhausted (`query_busy`).
