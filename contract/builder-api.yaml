                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such document in the caller's workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /revisions/{kind}/{doc_id}/revert:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [spec, annotation]}
      - name: doc_id
        in: path
        required: true
        schema: {type: string, maxLength: 200}
    post:
      operationId: revertRevision
      summary: Revert to an earlier revision, as a new revision (#820)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRevisionRequest"
      responses:
        "200":
          description: The new revision, whose `reverted_from` names the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such document or revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The document moved on since `expected_revision` (`revision_conflict`):
            `current_revision` is the latest revision, the one to base a retry on (#947).
            Nothing is reverted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionConflictError"
              examples:
                RevisionConflict:
                  summary: Another save came first
                  value:
                    error: the document is at revision 3
                    code: revision_conflict
                    current_revision: 3

  /monitoring/summary:
    get:
      operationId: getMonitoringSummary
      summary: Builder API/Queue/Worker/Artifact Store 시스템 상태 요약 (#516)
      description: >-
        시스템 aggregate만 반환하며 개별 run의 dataset/owner/credential 정보는
        포함하지 않는다. Async build queue/worker(#511/#513)는 이 서비스가 항상
        생성하는 AsyncBuildExecutor의 read-only snapshot을 반영하므로 항상
        `availability: available`이다(#516). Provider 상태는 네트워크 프로브를
        유발하므로 이번 버전에서는 포함하지 않는다.
      responses:
        "200":
          description: 시스템 상태 요약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /monitoring/builds:
    get:
      operationId: getMonitoringBuilds
      summary: 시간대별 build 통계와 recent runs (#516)
      description: >-
        BuildIndex(ADR 0003) 기반 파생 집계. timezone은 UTC이며 bucket 경계는
        `[start, end)` 반열린이다. bucket 기준 timestamp는 `finished_at`이다.
        ENFORCE_OWNERSHIP+oidc principal일 때는 본인이 접근 가능한 run만
        집계·노출한다(#505).
      parameters:
        - name: window
          in: query
          required: false
          description: "집계 기간. 현재 24h만 지원 (기본값: 24h)"
          schema:
            type: string
            enum: [24h]
            default: 24h
        - name: bucket
          in: query
          required: false
          description: "집계 단위. 현재 hour만 지원 (기본값: hour)"
          schema:
            type: string
            enum: [hour]
            default: hour
      responses:
        "200":
          description: build 통계와 recent runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBuildsResponse"
        "400":
          description: 지원하지 않는 window/bucket 값
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/runs:
    get:
      operationId: adminListRuns
      summary: 모든 소유자의 run 상태 조회 (관리자 전용, #679)
      description: >-
        관리자 principal에게 모든 소유자의 run을 **메타데이터만** 반환한다.
        산출물 바이트·credential·응답 본문은 어떤 경우에도 포함하지 않는다 —
        이 제품은 BYOK이고, 관리자가 사용자 데이터를 열 수 있는지는 아직
        결정되지 않았다(#679). 소유자는 되돌릴 수 없는 `owner_id` 해시로만
        구분된다. 관리자가 아니면 403이다. The listing is the newest `limit` runs —
        in-progress jobs and indexed runs merged, newest first. `count` is how many
        this response carries; `total` is how many there are before `limit` (#948), so
        a client can say "N of M" and offer more only when `count < total`.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 모든 소유자의 run 메타데이터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRunsResponse"
              examples:
                LatestOfMore:
                  summary: "`?limit=2` — the newest 2 of 137 runs"
                  value:
                    runs:
                      - run_id: run-20261001-0002
                        status: running
                        started_at: null
                        finished_at: null
                        owner_id: oidc:68d2bc4134cb5db7c9be4d6132d6e25999d4610c7effd5af4b850e729ee1c401
                        error: null
                      - run_id: run-20261001-0001
                        status: failed
                        started_at: "2026-10-01T09:00:00Z"
                        finished_at: "2026-10-01T09:01:12Z"
                        owner_id: oidc:e1ee853cca59178c909b0e6b1dc13d6d2acad701b5c7dcb92ca9575ae8a913d6
                        error: "provider answered 429: too many requests"
                    count: 2
                    total: 137
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 관리자 역할이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: build index를 읽을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users:
    get:
      operationId: adminListUsers
      summary: The Builder sign-up ledger (#785)
      description: >-
        Every OIDC user who has signed in: an irreversible id, a display name (their
        verified email), the sign-up status and when it was decided. No credential or
        token is stored, so none is returned. Administrators only.
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        "200":
          description: Ledger entries, newest sign-up first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "400":
          description: An unknown status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{user_id}/approve:
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ledger's `user_id` — an irreversible owner hash.
        schema: {type: string}
    post:
      operationId: adminApproveUser
      summary: Mark a sign-up approved (#785)
      description: Administrators only; recorded in the admin audit log. Takes effect on the user's next request, with no restart.
      responses:
        "200":
          description: The user's ledger entry after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id has signed in (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{user_id}/reject:
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ledger's `user_id` — an irreversible owner hash.
        schema: {type: string}
    post:
      operationId: adminRejectUser
      summary: Mark a sign-up rejected (#785)
      description: Administrators only; recorded in the admin audit log. Takes effect on the user's next request, with no restart.
      responses:
        "200":
          description: The user's ledger entry after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id has signed in (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/config:
    get:
      operationId: adminGetConfig
      summary: 적용 중인 정책 설정 조회 (관리자 전용, #679)
      description: >-
        지금 적용 중인 정책의 **상태**만 반환한다. 토큰·키·issuer URL 같은
        설정 값은 포함하지 않는다. 관리자가 아니면 403이다.
      responses:
        "200":
          description: 적용 중인 정책 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 관리자 역할이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        서버에 KPUBDATA_BUILDER_API_KEY가 설정된 경우 필수. 미설정 시(로컬 개발 기본값)
        인증 없이 모든 요청이 허용된다 (#248).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Google OIDC ID 토큰 (ADR 0009). Authorization: Bearer <jwt>.
        OIDC_ISSUER 미설정 시 비활성 — 기존 ApiKeyAuth 배포에 영향 없음 (#385).
        Sign-up ledger (#785, #951): an OIDC user who is not an administrator and not yet
        admitted gets `components.responses.SignupNotApproved` — 403 `signup_pending`
        (waiting for an administrator's approval) or `signup_rejected` (refused; a
        rejection wins over an `OIDC_ALLOWED_*` list) — from **every** authenticated
        operation, before the operation runs. It is declared once there rather than on
        each operation: an operation has one 403 response, and many already use it for
        their own refusal, whose `Error.code` tells the two apart.

  responses:
    SignupNotApproved:
      x-status: 403
      description: >-
        The caller signed in with OIDC but the sign-up ledger does not admit them yet
        (#785, #951) — every authenticated operation can answer this 403 before it runs,
        whatever 403 it declares itself (see `bearerAuth`). `signup_pending`: waiting for
        an administrator's approval (`POST /admin/users/{user_id}/approve`); a client
        shows that the account is waiting, not that something failed. `signup_rejected`:
        an administrator refused the sign-up; retrying does not help. Administrators and
        API-key callers never get it. `x-status` names the status code, since no single
        operation references this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignupNotApprovedError"
          examples:
            SignupPending:
              summary: Waiting for an administrator's approval
              value:
                error: this account's sign-up is waiting for an administrator's approval
                code: signup_pending
            SignupRejected:
              summary: An administrator refused the sign-up
              value:
                error: this account's sign-up was rejected
                code: signup_rejected

    Unauthorized:
      description: X-API-Key가 누락되었거나 서버에 설정된 키와 일치하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            MissingOrInvalidApiKey:
              summary: 인증 정보가 없거나 일치하지 않음
              value:
                error: unauthorized

    PiiDeclarationUnavailable:
      description: >-
        A public_api source's kpubdata PII declaration could not be read (#900), so
        which of its columns are personal is not known and its Silver or Bronze rows
        do not leave: unknown is not permission (#688). Gold reads are unaffected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PiiDeclarationUnavailableError"
          examples:
            PiiDeclarationUnavailable:
              summary: PII 선언을 읽을 수 없음
              value:
                error: >-
                  the PII declaration of example.dataset could not be read, so query
                  results cannot leave Builder unmasked; try again, or read Gold
                code: pii_declaration_unavailable
                dataset: example.dataset

    RedistributionForbidden:
      description: >-
        The build's source terms forbid redistribution (#688), so its data does not
        leave Builder.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RedistributionForbiddenError"
          examples:
            RedistributionForbidden:
              summary: 재배포 금지 약관의 데이터
              value:
                error: the source terms forbid redistribution, so query results cannot leave Builder
                code: redistribution_forbidden
                redistribution:
                  verdict: forbidden
                  sources:
                    - source: example.dataset
                      verdict: forbidden
                      reason: "the dataset declares redistribution: forbidden"

  parameters:
    PublishCredential:
      name: X-Publish-Credential
      in: header
      required: false
      description: >-
        Multi-user deployment only (#925): the requester's own publish credential for this
        request, `<VARIABLE>=<value>` with `HF_TOKEN`, `KAGGLE_USERNAME` or `KAGGLE_KEY`,
        repeated or comma-separated. Never stored. A single-user deployment ignores it and
        keeps its stored and server credentials.
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      description: build 실행 식별자(경로 안전한 단일 세그먼트)
      schema:
        type: string

    DatasetId:
      name: dataset_id
      in: path
      required: true
      description: >-
        BuildSpec.dataset_id 값. slash/space 등 경로에 그대로 쓸 수 없는 문자를
        포함할 수 있으므로 클라이언트는 percent-encoding해야 한다(#488).
      schema:
        type: string

    Stage:
      name: stage
      in: path
      required: true
      description: 조회할 medallion stage
      schema:
        type: string
        enum: [bronze, silver, gold]

    ProviderName:
      name: provider
      in: path
      required: true
      description: kpubdata runtime catalog에 등록된 Provider 식별자
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"

    UploadId:
      name: upload_id
      in: path
      required: true
      description: >-
        POST /uploads가 발급한 불투명한 식별자(#498). 사용자가 지정한 값이 아니다.
      schema:
        type: string
        pattern: "^upl_[a-f0-9]{32}$"

  schemas:
    AdminUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name, status, first_seen_at, last_seen_at, decided_at, decided_by]
      properties:
        user_id:
          type: string
          description: The user's owner id — an irreversible hash of issuer and subject.
        display_name:
          type: [string, "null"]
          description: The verified email, else the subject's first eight characters.
        status:
          type: string
          enum: [pending, approved, rejected]
          description: >-
            `approved` by an administrator, or by an `OIDC_ALLOWED_*` list
            (`decided_by: allowlist`). `rejected` shuts the user out even when a list
            admits them.
        first_seen_at: {type: string}
        last_seen_at: {type: string}
        decided_at: {type: [string, "null"]}
        decided_by:
          type: [string, "null"]
          description: "`allowlist`, or the deciding administrator's owner id."

    AdminUsersResponse:
      type: object
      additionalProperties: false
      required: [users, count]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        count: {type: integer, minimum: 0}

    AdminRunsResponse:
      type: object
      additionalProperties: false
      required: [runs, count]
      properties:
        count:
          type: integer
          minimum: 0
          description: >-
            How many runs **this response** carries — `len(runs)`, after `limit` — not
            how many there are (#948). Unlike `AdminUsersResponse.count`, which is the
            whole ledger, it stops at `limit`; `total` is the number before it.
        total:
          type: integer
          minimum: 0
          description: >-
            How many runs this listing draws from before `limit` is applied (#948):
            every run the build index holds plus the queued and running jobs it does not
            hold yet, each counted once. `count < total` means older runs were left
            out. Sent from contract 1.73.0; a client talking to an older Builder finds
            it absent and knows only `count`. Counted in the same request as the
            listing, so a build finishing meanwhile can move it by one; it is never
            less than `count`.
        runs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [run_id, status]
            properties:
              run_id:
                type: string
              status:
                type: string
              started_at:
                type: [string, "null"]
              finished_at:
                type: [string, "null"]
              owner_id:
                type: [string, "null"]
                description: 되돌릴 수 없는 소유자 해시. 사용자 신원을 담지 않는다.
              error:
                type: [string, "null"]
                description: >-
                  The run's failure reason, key-shaped values masked (#679); null when it
                  did not fail or gave none. Administrators see a run's metadata, never its
                  bytes — every byte-serving route treats them like any non-owner.
    AdminConfigResponse:
      type: object
      additionalProperties: false
      required: [enforce_ownership, publish_server_credential_fallback]
      properties:
        enforce_ownership:
          type: boolean
        publish_server_credential_fallback:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 사람이 읽는 오류 요약 메시지
        code:
          type: string
          description: >-
            클라이언트 분기용 안정적인 오류 코드(새 endpoint에서 사용). 예:
            `redistribution_forbidden`(#688) — build의 source 약관이 재배포를 금지해
            데이터가 Builder 밖으로 나갈 수 없음. 이때 body에 `redistribution`이 함께 온다.
            `declared_pii_withheld`(#900) — 선언된 PII가 평문으로 담긴 Bronze·Silver
            산출물 파일이라 내려받을 수 없음. 이때 body에 `columns`가 함께 온다.
            `pii_declaration_unavailable`(#900, 503) — public_api 소스의 kpubdata PII
            선언을 읽지 못해 Silver·Bronze 읽기를 거부함. 이때 body에 `dataset`이 온다.
            `signup_pending` / `signup_rejected`(#785, #951, 403) — any authenticated
            operation, for an OIDC user the sign-up ledger does not admit
            (`SignupNotApprovedError`, `components.responses.SignupNotApproved`).
            `revision_conflict`(#820, #947, 409) — a revision save or revert based on a
            stale revision; the body carries `current_revision` (`RevisionConflictError`).
        redistribution:
          description: >-
            `code: redistribution_forbidden`일 때만 온다(#688): 판정과 source별 이유.
          allOf:
            - $ref: "#/components/schemas/RedistributionVerdict"

    RevisionConflictError:
      description: >-
        `Error` with the revision the document is at (#947): the 409 `revision_conflict`
        of `PUT /revisions/{kind}/{doc_id}` and `POST /revisions/{kind}/{doc_id}/revert`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code, current_revision]
          properties:
            code:
              type: string
              enum: [revision_conflict]
            current_revision:
              type: integer
              minimum: 0
              description: >-
                The document's latest revision — reload it and base the next save on
                it (`expected_revision`); 0 when the document has no revision yet.

    SignupNotApprovedError:
      description: >-
        `Error` for an OIDC user the sign-up ledger does not admit (#785, #951): the body
        of `components.responses.SignupNotApproved`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [signup_pending, signup_rejected]

    QueryRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, run_id, stage, sql]
      properties:
        dataset_id: {type: string}
        run_id: {type: string}
        stage: {type: string, enum: [silver, gold]}
        source: {type: string}
        sql: {type: string, maxLength: 65536}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}

    CreateAnalysisRequest:
      type: object
      additionalProperties: false
      required: [name, table, sql]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        table:
          type: string
          description: A table's logical name in the caller's workspace.
        snapshot:
          type: string
          default: current
          description: "`current`, or a snapshot id of this table. The resolved id is stored."
        sql: {type: string, maxLength: 65536}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}

    SavedAnalysis:
      type: object
      additionalProperties: false
      required: [analysis_id, name, sql, limit, bindings, result_meta, created_at]
      properties:
        analysis_id: {type: string}
        name: {type: string}
        sql: {type: string}
        limit: {type: integer, minimum: 1, maximum: 500}
        bindings:
          type: array
          description: >-
            The snapshot each table was read at — concrete ids, never `current`. One
            entry until multi-table queries (#704).
          items:
            type: object
            additionalProperties: false
            required: [table, snapshot_id]
            properties:
              table: {type: string}
              snapshot_id: {type: string}
        result_meta:
          type: object
          additionalProperties: false
          required: [columns, column_meta, row_count, truncated, executed_at]
          description: What the saving run returned. Rows are not stored.
          properties:
            columns:
              type: array
              items: {type: string}
            column_meta:
              type: array
              items:
                $ref: "#/components/schemas/ColumnWireInfo"
            row_count: {type: integer, minimum: 0}
            truncated: {type: boolean}
            executed_at: {type: string}
        created_at: {type: string}
        sql_dialect:
          type: string
          description: >-
            The SQL dialect the analysis was saved in (#875): `duckdb` since the DuckDB
            cutover (#874); `legacy-polars` for an analysis saved before it.
        engine:
          type: string
          description: The engine that ran it when it was saved (`duckdb`, or `polars`).
        engine_version:
          type: [string, "null"]
          description: That engine's version; null for a legacy analysis.
        query_contract_version:
          type: [string, "null"]
          description: The API contract version it was saved under; null for a legacy analysis.
        migration_required:
          type: boolean
          description: >-
            True when the analysis was saved in another SQL dialect. It is not re-run
            (`POST /analyses/{analysis_id}/run` answers 409 `analysis_migration_required`):
            review its SQL in DuckDB SQL and save it as a new analysis.

    AnalysisListResponse:
      type: object
      additionalProperties: false
      required: [analyses]
      properties:
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/SavedAnalysis"

    CreateAnalysisResponse:
      type: object
      additionalProperties: false
      required: [analysis, result]
      properties:
        analysis:
          $ref: "#/components/schemas/SavedAnalysis"
        result:
          $ref: "#/components/schemas/QueryResponse"

    AnalysisDeletedResponse:
      type: object
      additionalProperties: false
      required: [analysis_id, deleted]
      properties:
        analysis_id: {type: string}
        deleted: {type: boolean, const: true}

    SaveRevisionRequest:
      type: object
      additionalProperties: false
      required: [content, expected_revision]
      properties:
        content:
          $ref: "#/components/schemas/JsonValue"
          description: 'A spec is `{"yaml": "<BuildSpec YAML>"}`; an annotation any JSON.'
        expected_revision: {type: integer, minimum: 0}
        note: {type: string}
        idempotency_key: {type: string, minLength: 1, maxLength: 200}

    RevertRevisionRequest:
      type: object
      additionalProperties: false
      required: [to_revision, expected_revision]
      properties:
        to_revision: {type: integer, minimum: 1}
        expected_revision: {type: integer, minimum: 0}

    DocumentRevision:
      type: object
      additionalProperties: false
      required: [kind, doc_id, revision, note, author, created_at, reverted_from]
      properties:
        kind: {type: string, enum: [spec, annotation]}
        doc_id: {type: string}
        revision: {type: integer, minimum: 1}
        content:
          $ref: "#/components/schemas/JsonValue"
        note: {type: [string, "null"]}
        author:
          type: string
          description: The saving principal's owner id — decided by the server.
        created_at: {type: string}
        reverted_from: {type: [integer, "null"]}

    RevisionHistoryResponse:
      type: object
      additionalProperties: false
      required: [revisions, audit]
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRevision"
        audit:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [revision, action, author, at]
            properties:
              revision: {type: integer}
              action: {type: string, enum: [save, revert]}
              author: {type: string}
              at: {type: string}

    WarehouseTable:
      type: object
      additionalProperties: false
      required: [table_id, logical_name, current_snapshot_id, revision]
      properties:
        table_id: {type: string}
        logical_name:
          type: string
          description: "`<dataset_id>.<source_key>` — the name to query the table by."
        current_snapshot_id:
          type: [string, "null"]
          description: The snapshot a query reads by default; null before the first commit.
        revision:
          type: integer
          minimum: 0
          description: Increments every time the current snapshot moves.
        current_snapshot:
          description: >-
            The current snapshot summarised, so a list needs no call per table (#841);
            null before the first commit. A value the catalog does not have is null,
            never 0.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [snapshot_id, row_count, committed_at, coverage]
              properties:
                snapshot_id: {type: string}
                row_count: {type: [integer, "null"], minimum: 0}
                committed_at: {type: [string, "null"]}
                coverage:
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/SnapshotCoverage"
        dataset_id:
          type: [string, "null"]
          description: >-
            The dataset this table was built for, from the BuildSpec of the run that
            committed the current snapshot (#841); null when that cannot be read. Do not
            derive it by splitting `logical_name` — a dataset id may contain a dot.

    WarehouseTableListResponse:
      type: object
      additionalProperties: false
      required: [tables]
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseTable"

    WarehouseSnapshot:
      type: object
      additionalProperties: false
      required: [snapshot_id, run_id, state, row_count, created_at, committed_at]
      properties:
        snapshot_id: {type: string}
        run_id:
          type: string
          description: The build that produced it.
        state: {type: string, enum: [committed, quarantined]}
        row_count: {type: [integer, "null"], minimum: 0}
        created_at: {type: string}
        committed_at: {type: [string, "null"]}
        coverage:
          description: >-
            Whether the fetch behind the snapshot collected what the provider reported
            (#816). Null when not recorded — a snapshot committed before 1.42.0 or from
            a source without a fetch record. Null is unknown, not complete.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SnapshotCoverage"

    SourceProvenance:
      type: object
      additionalProperties: true
      required: [provider, dataset, fetched_at, record_count, data_checksum]
      properties:
        provider: {type: string}
        dataset: {type: string}
        fetched_at: {type: string}
        record_count: {type: integer, minimum: 0}
        data_checksum: {type: string}
        data_checksum_algorithm:
          type: string
          description: >-
            What made `data_checksum` (#867): `canonical-multiset-v2` for runs from
            1.60.0. Absent in older manifests, which used `canonical-json-sort-v1`.
            Checksums made by different algorithms are not comparable — equal strings do
            not mean equal data.
        api_version: {type: string}
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        fetched_row_count:
          type: integer
          minimum: 0
          description: Rows actually fetched (#816). Absent in manifests written before 1.42.0.
        source_reported_total:
          $ref: "#/components/schemas/SourceReportedTotal"
        coverage:
          $ref: "#/components/schemas/FetchCoverage"

    SourceReportedTotal:
      type: object
      additionalProperties: false
      required: [status, value, observed_at]
      description: >-
        What the provider said the total was (#816). Never a sum: pages repeat one
        call's total, and `param_grid` combinations can overlap, so several calls give
        `not_summed` with each call's total under `calls`.
      properties:
        status:
          type: string
          enum: [reported, unknown, inconsistent, not_summed, not_reported]
          description: >-
            `reported` — one call, and `value` is its total. `unknown` — the provider
            stated none. `inconsistent` — pages of one call disagreed. `not_summed` —
            several calls. `not_reported` — a file or URL source, with no provider total.
        value:
          type: [integer, "null"]
          minimum: 0
          description: The total when `status` is `reported` (0 is a reported zero); null otherwise.
        observed_at:
          type: string
          description: When the total was read (the fetch's completion time).
        calls:
          type: array
          items:
            $ref: "#/components/schemas/CallTotal"

    CallTotal:
      type: object
      additionalProperties: false
      required: [index, value, status, fetched_row_count, pages]
      properties:
        index:
          type: integer
          minimum: 0
          description: 0 for a plain source; the combination's position in `param_combinations` otherwise.
        value: {type: [integer, "null"], minimum: 0}
        status:
          type: string
          enum: [reported, unknown, inconsistent]
        fetched_row_count: {type: integer, minimum: 0}
        pages: {type: integer, minimum: 0}

    FetchCoverage:
      type: object
      additionalProperties: false
      required: [status, reasons]
      description: >-
        Whether the fetch collected what the provider reported (#816). `complete` —
        every call returned exactly its reported total. `partial` — some call returned
        fewer. `unknown` — nothing trustworthy to compare with. Show a partial snapshot
        as partial wherever its rows are shown, charted or exported.
      properties:
        status:
          type: string
          enum: [complete, partial, unknown]
        reasons:
          type: array
          items: {type: string}

    SnapshotCoverage:
      type: object
      additionalProperties: false
      required: [status, reasons, fetched_row_count, source_reported_total]
      description: The fetch coverage recorded with a warehouse snapshot (#816).
      properties:
        status:
          type: string
          enum: [complete, partial, unknown]
        reasons:
          type: array
          items: {type: string}
        fetched_row_count: {type: [integer, "null"], minimum: 0}
        source_reported_total:
          type: object
          additionalProperties: false
          required: [status, value, observed_at]
          properties:
            status:
              type: string
              enum: [reported, unknown, inconsistent, not_summed, not_reported]
            value: {type: [integer, "null"], minimum: 0}
            observed_at: {type: string}

    SnapshotProfileResponse:
      type: object
      additionalProperties: false
      required: [snapshot, profile]
      properties:
        snapshot:
          type: object
          additionalProperties: false
          required: [table_id, logical_name, snapshot_id, revision]
          properties:
            table_id: {type: string}
            logical_name: {type: string}
            snapshot_id: {type: string}
            revision: {type: integer, minimum: 0}
        profile:
          $ref: "#/components/schemas/SnapshotProfile"

    SnapshotProfile:
      type: object
      additionalProperties: false
      required:
        [snapshot_id, artifact_digest, algorithm_version, computed_at, scope, accuracy,
         min_range_values, row_count, columns]
      properties:
        snapshot_id: {type: string}
        artifact_digest:
          type: string
          description: The snapshot content digest the profile was computed from.
        algorithm_version: {type: integer, minimum: 1}
        computed_at: {type: string}
        scope:
          type: object
          additionalProperties: false
          required: [mode, sampled, sample_size]
          properties:
            mode: {type: string, enum: [full]}
            sampled: {type: boolean}
            sample_size: {type: [integer, "null"], minimum: 0}
        accuracy: {type: string, enum: [exact]}
        min_range_values:
          type: integer
          minimum: 1
          description: A range over fewer finite values than this is withheld.
        row_count: {type: integer, minimum: 0}
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnProfile"

    ColumnProfile:
      type: object
      additionalProperties: false
      required:
        [name, storage_type, logical_type, time_zone, sensitivity, status, null_count,
         null_ratio, nan_count, infinite_count, range]
      description: >-
        One column. A `withheld` column (suspected personal data the BuildSpec does not
        accept) has only its name, types and sensitivity; every statistic is null.
      properties:
        name: {type: string}
        storage_type: {type: string}
        logical_type:
          type: string
          description: >-
            As `ColumnWireInfo.logical_type`: `identifier` for a text column the source's
            kpubdata spec declares a code (#702); `storage_type` still says how it is stored.
        time_zone:
          type: [string, "null"]
          description: A datetime column's time zone; null when naive or not a datetime.
        sensitivity:
          type: object
          additionalProperties: false
          required: [status, kinds]
          properties:
            status:
              type: string
              enum: [not_detected, suspected, allowed_by_spec]
              description: >-
                `not_detected` is not a guarantee: only value patterns and column-name
                heuristics are checked. Value patterns are checked on `String`,
                `Categorical` and `Enum` columns and on `List`/`Array` columns of those
                (a row matches when any element does). A column of another type that can
                hold text (`Struct`, `Object`, `Binary`, nested lists) is not
                pattern-checked and is `suspected` with the kind `unchecked_values`;
                numeric, boolean and temporal columns hold no text to check.
            kinds:
              type: array
              items: {type: string}
        status: {type: string, enum: [profiled, withheld]}
        null_count: {type: [integer, "null"], minimum: 0}
        null_ratio:
          type: [number, "null"]
          description: null for an empty table or a withheld column — not 0.
        nan_count:
          type: [integer, "null"]
          minimum: 0
          description: Float columns only; null otherwise.
        infinite_count:
          type: [integer, "null"]
          minimum: 0
          description: Float columns only; null otherwise.
        range:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ColumnRange"

    ColumnRange:
      type: object
      additionalProperties: false
      required: [status]
      description: >-
        `exact` min/max over finite, non-null values, sent by `wire_encoding`;
        `withheld_small_group` when fewer than `min_range_values` values exist;
        `no_values` when none do; `not_applicable` for non-numeric, non-temporal
        columns. `excluded_count` is how many NaN or infinite values were left out.
      properties:
        status:
          type: string
          enum: [exact, withheld_small_group, no_values, not_applicable]
        min:
          $ref: "#/components/schemas/JsonValue"
        max:
          $ref: "#/components/schemas/JsonValue"
        wire_encoding: {type: string, enum: [number, decimal_string, string]}
        value_count: {type: integer, minimum: 0}
        excluded_count: {type: integer, minimum: 0}

    WarehouseTableDetailResponse:
      type: object
      additionalProperties: false
      required: [table_id, logical_name, current_snapshot_id, revision, snapshots]
      properties:
        table_id: {type: string}
        logical_name: {type: string}
        current_snapshot_id: {type: [string, "null"]}
        revision: {type: integer, minimum: 0}
        snapshots:
          type: array
          description: Readable snapshots, newest first.
          items:
            $ref: "#/components/schemas/WarehouseSnapshot"

    WarehouseQueryRequest:
      type: object
      additionalProperties: false
      required: [table, sql]
      properties:
        table:
          type: string
          description: A table's logical name in the caller's workspace.
        snapshot:
          type: string
          default: current
          description: "`current`, or a snapshot id of this table."
        sql: {type: string, maxLength: 65536}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}

    WarehouseRowsRequest:
      type: object
      additionalProperties: false
      required: [table]
      properties:
        table:
          type: string
          description: A table's logical name in the caller's workspace.
        snapshot:
          type: string
          default: current
          description: "`current` for the first page; the returned `snapshot_id` for the next."
        offset:
          type: integer
          minimum: 0
          default: 0
        page_size:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        columns:
          type: array
          minItems: 1
          description: Columns to return, in this order. All columns when omitted.
          items: {type: string}
        sort:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [column]
            properties:
              column: {type: string}
              direction:
                type: string
                enum: [asc, desc]
                default: asc
        filters:
          type: array
          maxItems: 16
          description: >-
            Conditions that must all hold. `value` (for eq/ne/lt/lte/gt/gte) and
            `values` (for `in`, at most 100) are cast to the column's type, so a
            Decimal, a large integer or a date is sent the way it was received — as its
            exact text.
          items:
            type: object
            additionalProperties: false
            required: [column, op]
            properties:
              column: {type: string}
              op:
                type: string
                enum: [eq, ne, lt, lte, gt, gte, in, is_null, is_not_null]
              value:
                type: [string, number, boolean]
              values:
                type: array
                items:
                  type: [string, number, boolean]
        count:
          type: string
          enum: [exact, none]
          description: >-
            `exact` counts the rows that pass the filters; `none` skips the count. The
            default is `exact` without filters and `none` with them. Without filters the
            snapshot's own row count is returned either way.

    WarehouseRowsResponse:
      type: object
      additionalProperties: false
      required:
        - snapshot
        - columns
        - column_meta
        - rows
        - order
        - page
        - count
        - execution_ms
        - startup_ms
        - engine_execution_ms
      properties:
        snapshot:
          type: object
          additionalProperties: false
          required: [table_id, logical_name, snapshot_id, revision]
          description: The snapshot this page read. Pass `snapshot_id` for the next page.
          properties:
            table_id: {type: string}
            logical_name: {type: string}
            snapshot_id: {type: string}
            revision: {type: integer, minimum: 0}
        columns:
          type: array
          items: {type: string}
        column_meta:
          type: array
          items:
            $ref: "#/components/schemas/ColumnWireInfo"
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        order:
          type: array
          description: >-
            The sort keys applied. Ties are then broken by the row's position in the
            snapshot, which is internal and not a cell key across snapshots.
          items:
            type: object
            additionalProperties: false
            required: [column, direction]
            properties:
              column: {type: string}
              direction: {type: string, enum: [asc, desc]}
        page:
          type: object
          additionalProperties: false
          required: [offset, page_size, returned, has_more, next_offset]
          properties:
            offset: {type: integer, minimum: 0}
            page_size: {type: integer, minimum: 1}
            returned: {type: integer, minimum: 0}
            has_more: {type: boolean}
            next_offset:
              type: [integer, "null"]
              minimum: 0
              description: The offset of the next page, or null on the last one.
        count:
          type: object
          additionalProperties: false
          required: [status, value]
          properties:
            status:
              type: string
              enum: [exact, estimated, not_computed]
              description: >-
                `exact` — counted. `not_computed` — not asked for; `value` is null, not
                0. `estimated` is reserved and not sent yet.
            value:
              type: [integer, "null"]
              minimum: 0
        execution_ms: {type: integer, minimum: 0}
        startup_ms: {type: integer, minimum: 0}
        engine_execution_ms: {type: integer, minimum: 0}

    WarehouseAggregateRequest:
      type: object
      additionalProperties: false
      required: [table, measures]
      properties:
        table:
          type: string
          description: A table's logical name in the caller's workspace.
        snapshot:
          type: string
          default: current
          description: "`current`, or a `snapshot_id` returned before to get the same answer again."
        group_by:
          type: array
          maxItems: 4
          description: Columns to group by. None is one group over every filtered row.
          items: {type: string}
        measures:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [fn]
            properties:
              fn:
                type: string
                enum: [count_rows, count, count_null, count_distinct, sum, avg, min, max]
                description: >-
                  `count_rows` takes no column. `sum` and `avg` need a numeric column,
                  `min` and `max` a numeric, temporal or text one.
              column: {type: string}
              as:
                type: string
                description: >-
                  The output column's name. Defaults to `count_rows` or `<fn>_<column>`;
                  must differ from the group columns and the other measures.
              additive:
                type: boolean
                description: >-
                  Required and `true` for `sum`, not allowed otherwise: the caller states
                  that the column may be added up. It is echoed back, not verified.
        filters:
          type: array
          maxItems: 16
          description: >-
            Conditions that must all hold, as in `POST /warehouse/rows`. Applied before
            aggregating.
          items:
            type: object
            additionalProperties: false
            required: [column, op]
            properties:
              column: {type: string}
              op:
                type: string
                enum: [eq, ne, lt, lte, gt, gte, in, is_null, is_not_null]
              value:
                type: [string, number, boolean]
              values:
                type: array
                items:
                  type: [string, number, boolean]
        order_by:
          type: array
          maxItems: 8
          description: >-
            Group columns or measure names to sort the groups by, before `limit`. Ties
            are broken by the group keys, ascending; nulls sort last.
          items:
            type: object
            additionalProperties: false
            required: [key]
            properties:
              key: {type: string}
              direction:
                type: string
                enum: [asc, desc]
                default: asc
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: How many groups to return after sorting. Never limits the input rows.
        unit_column:
          type: string
          description: >-
            A column holding each row's unit. Each group must have one unit (null counts
            as one) unless `unit_policy` is `split`; the unit is sent beside the group.
        unit_policy:
          type: string
          enum: [reject, split]
          default: reject
          description: >-
            `reject` refuses a group mixing units (422 `mixed_units`); `split` groups by
            the unit as well. Only with `unit_column`.

    WarehouseAggregateResponse:
      type: object
      additionalProperties: false
      required:
        - snapshot
        - columns
        - column_meta
        - rows
        - group_by
        - measures
        - order
        - unit
        - input
        - result
        - execution_ms
        - startup_ms
        - engine_execution_ms
      properties:
        snapshot:
          type: object
          additionalProperties: false
          required: [table_id, logical_name, snapshot_id, revision]
          description: The snapshot aggregated. Pass `snapshot_id` to aggregate it again.
          properties:
            table_id: {type: string}
            logical_name: {type: string}
            snapshot_id: {type: string}
            revision: {type: integer, minimum: 0}
        columns:
          type: array
          description: Group columns, then the unit column when checked, then the measures.
          items: {type: string}
        column_meta:
          type: array
          description: Read from the aggregate's own types; no input column hint carries over.
          items:
            $ref: "#/components/schemas/ColumnWireInfo"
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        group_by:
          type: array
          items: {type: string}
        measures:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [as, fn, column, additive, unit_column]
            properties:
              as: {type: string}
              fn: {type: string}
              column: {type: [string, "null"]}
              additive:
                type: [boolean, "null"]
                description: The caller's assertion for `sum`; null for other functions.
              unit_column:
                type: [string, "null"]
                description: Where this measure's unit is read from; null when not checked or not a value measure.
        order:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, direction]
            properties:
              key: {type: string}
              direction: {type: string, enum: [asc, desc]}
        unit:
          type: object
          additionalProperties: false
          required: [column, policy, check]
          properties:
            column: {type: [string, "null"]}
            policy: {type: string, enum: [reject, split]}
            check:
              type: string
              enum: [not_checked, single_unit, split]
              description: >-
                `not_checked` — no `unit_column`, so nothing is known about units.
                `single_unit` — every group had one unit. `split` — groups are per unit.
        input:
          type: object
          additionalProperties: false
          required: [row_count, sampled]
          properties:
            row_count:
              type: integer
              minimum: 0
              description: Rows that passed the filters, all of which were aggregated.
            sampled:
              type: boolean
              description: Always false. Aggregates are never computed over a sample.
        result:
          type: object
          additionalProperties: false
          required: [completeness, group_count, returned, limit]
          properties:
            completeness:
              type: string
              enum: [full, top_n]
              description: >-
                `full` — every group is in `rows`. `top_n` — the first `limit` groups
                after sorting; `group_count` says how many there were.
            group_count: {type: integer, minimum: 0}
            returned: {type: integer, minimum: 0}
            limit: {type: integer, minimum: 1}
        execution_ms: {type: integer, minimum: 0}
        startup_ms: {type: integer, minimum: 0}
        engine_execution_ms: {type: integer, minimum: 0}

    WarehouseAggregateRefusal:
      type: object
      required: [error, code, snapshot]
      description: An aggregate refused rather than cut short. Carries no rows.
      properties:
        error: {type: string}
        code:
          type: string
          enum: [mixed_units, too_many_groups, result_too_large]
        snapshot:
          type: object
          required: [table_id, logical_name, snapshot_id, revision]
          properties:
            table_id: {type: string}
            logical_name: {type: string}
            snapshot_id: {type: string}
            revision: {type: integer, minimum: 0}
        unit_column: {type: string}
        mixed_group_count: {type: integer, minimum: 1}
        samples:
          type: array
          description: Up to five mixed groups, by group key, with the units found (null included).
          items:
            type: object
            required: [group, units]
            properties:
              group:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
              units:
                type: array
                items:
                  $ref: "#/components/schemas/JsonValue"
        group_count: {type: integer, minimum: 0}
        max_groups: {type: integer, minimum: 1}
        max_bytes: {type: integer, minimum: 1}

    WarehouseQueryResponse:
      type: object
      additionalProperties: false
      required: [snapshot, result]
      properties:
        snapshot:
          type: object
          additionalProperties: false
          required: [table_id, logical_name, snapshot_id, revision]
          description: What the query read — record it to run the same query again.
          properties:
            table_id: {type: string}
            logical_name: {type: string}
            snapshot_id: {type: string}
            revision:
              type: integer
              minimum: 0
              description: The table revision when the snapshot was pinned.
        result:
          $ref: "#/components/schemas/QueryResponse"

    QueryResponse:
      type: object
      additionalProperties: false
      required: [columns, column_meta, rows, truncated, execution_ms, startup_ms, engine_execution_ms]
      properties:
        columns:
          type: array
          items: {type: string}
        column_meta:
          type: array
          description: >-
            One entry per column, in `columns` order: what the column was and how its
            values are sent (#735).
          items:
            $ref: "#/components/schemas/ColumnWireInfo"
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        truncated: {type: boolean}
        execution_ms:
          type: integer
          minimum: 0
          description: >-
            QueryEngine.execute 진입부터 child payload 수신·검증과 child join까지의
            parent end-to-end monotonic wall time(ms). 기존 필드 의미를 유지한다.
        startup_ms:
          type: integer
          minimum: 0
          description: >-
            Parent의 QueryEngine.execute 진입부터 spawned child가 import와 잠긴 DuckDB 연결
            (`dataset` view) 준비를 끝내고 질의를 시작하기 직전까지의 monotonic time(ms).
        engine_execution_ms:
          type: integer
          minimum: 0
          description: >-
            Child에서 질의 직전부터 DuckDB 실행과 결과 fetch 완료 직후까지의 engine
            monotonic time(ms) (#874 이전에는 Polars).
        masked_columns:
          allOf:
            - $ref: "#/components/schemas/MaskedColumns"
          description: >-
            `stage: silver` only (#900): the query ran on a copy of the Silver table
            with these declared PII columns masked, so no expression over them saw an
            original value. Gold is masked where it is built.

    ValidationError:
      type: object
      description: >-
        validate/build/preview의 spec 검증 실패 응답. SpecLoadError는
        {status:"error", error}, ValidationError는 {status:"invalid", problems}로
        나뉜다.
      required: [status]
      properties:
        status:
          type: string
          enum: [error, invalid]
        error:
          type: string
          description: status=error일 때의 파싱 오류 메시지
        problems:
          type: array
          description: status=invalid일 때의 검증 문제 목록
          items:
            type: string

    WireEncoding:
      type: string
      enum: [number, decimal_string, string, boolean, json]
      description: >-
        How a column's values are sent (#735). `decimal_string`: exact decimal text, for
        every Decimal column and for an integer column holding any value outside
        ±(2^53−1) — do not convert these with Number(). `number`: a JSON number
        (non-finite floats are null). `string`: text, or ISO 8601 for dates and times.
        **Decided per response, not per column type** (#794): an integer column is
        `number` in a response whose values all fit and `decimal_string` in one where a
        value does not, so the same column can arrive either way across pages, previews
        and queries. Read `wire_encoding` from each response's column metadata; do not
        cache it from an earlier one. A value outside this list, which a newer Builder may
        add, is shown as raw text: never read it as a number.

    ColumnMetaOrigin:
      type: string
      enum: [user_annotation, core_spec, catalog, engine_inferred]
      description: >-
        Where a column hint came from (#813, ADR 0019). When several sources describe a
        column, each hint is taken from the highest one, in this order: a user's
        annotation, the KPubData dataset spec, the catalog, a Builder inference. A hint with
        origin `engine_inferred` is an estimate and is shown as one.

    ColumnSemanticHint:
      type: object
      additionalProperties: false
      required: [kind, origin]
      description: >-
        What kind of value the column holds (#813). Metadata only: it does not change
        the column's storage type, wire encoding, casts, aggregation or row identity.
        One consequence is reported (#702): a text column whose kind is `code` has
        `logical_type: identifier`, still stored and sent as the same text.
      properties:
        kind:
          type: string
          description: >-
            `code`, `measure`, `date`, `period`, `text` or `flag` today — a kpubdata
            spec's `semantic_kind` is carried verbatim. An open string, not an enum: a
            newer Builder may send a kind a client does not know, and the client then
            shows the raw value rather than failing.
        origin:
          $ref: "#/components/schemas/ColumnMetaOrigin"

    ColumnDisplayHint:
      type: object
      additionalProperties: false
      required: [origin]
      description: >-
        How to present the column (#813). Core `FieldDescriptor.title` maps to `label`,
        `description` to `description`, `FieldConstraints.format` to `format`.
      properties:
        label:
          type: string
        description:
          type: string
        format:
          type: string
          description: A display format as the source states it, e.g. `YYYYMM`. Not parsed.
        origin:
          $ref: "#/components/schemas/ColumnMetaOrigin"

    ColumnUnitHint:
      type: object
      additionalProperties: false
      required: [name, origin]
      description: >-
        The unit a measure is counted in (#813). `scale` multiplies the sent value for
        display (1000: a sent 12 is 12,000 of `name`); the sent value is never rescaled.
      properties:
        name:
          type: string
        scale:
          type: number
        origin:
          $ref: "#/components/schemas/ColumnMetaOrigin"

    ColumnWireInfo:
      type: object
      additionalProperties: false
      required: [name, logical_type, wire_encoding]
      properties:
        name:
          type: string
        logical_type:
          type: string
          description: >-
            The column dtype without parameters, e.g. `int64`, `decimal`, `datetime`, or
            `identifier` for a text column the source's kpubdata spec declares a code
            (#702): a postcode, a PNU, a legal-dong code. An identifier is always sent as
            `string` and never converted to a number. An open string: a client shows a
            value of an unknown logical type as the text it receives.
        wire_encoding:
          $ref: "#/components/schemas/WireEncoding"
        semantic:
          $ref: "#/components/schemas/ColumnSemanticHint"
        display:
          $ref: "#/components/schemas/ColumnDisplayHint"
        unit:
          $ref: "#/components/schemas/ColumnUnitHint"

    JsonValue:
      description: 표준 JSON으로 직렬화 가능한 값(null, scalar, array, object)
      type: [string, number, boolean, object, array, "null"]
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      items:
        $ref: "#/components/schemas/JsonValue"

    BuildSpec:
      type: object
      description: >-
        선언적 빌드 명세(snake_case). dataset_id/title/description/sources/exports는
        필수이고 나머지 필드는 선택이다. 세부 스키마는 spec 모델
        (spec/models.py)을 따른다. 제거된 transforms/normalization_mode 필드는
        허용하지 않는다.
      additionalProperties: true
      allOf:
        - not:
            required: [transforms]
        - not:
            required: [normalization_mode]
      required: [dataset_id, title, description, sources, exports]
      properties:
        dataset_id:
          type: string
        title:
          type: string
        description:
          type: string
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        exports:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExportTarget"
        metadata:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        publish:
          type: boolean
          default: false
        splits:
          oneOf:
            - $ref: "#/components/schemas/SplitSpec"
            - type: "null"
        pii:
          oneOf:
            - $ref: "#/components/schemas/PiiPolicy"
            - type: "null"
        license:
          type: [string, "null"]
          description: >-
            SPDX identifier, or `other` for a licence outside the standard list — then
            `license_name` and `license_link` are required (#764).
        license_name:
          type: [string, "null"]
          description: >-
            Name of the licence when `license` is `other`, e.g.
            `korea-public-data-unrestricted`, `kogl-type-1` (#764).
        license_link:
          type: [string, "null"]
          description: Where the licence's terms are stated, when `license` is `other` (#764).
        attribution:
          type: [string, "null"]
          description: >-
            Attribution text shown on the dataset card. Every KOGL type requires it,
            and a licence identifier alone cannot satisfy that (ADR 0018).
        refresh_cadence:
          type: [string, "null"]
          pattern: "^P(?:\\d+W|\\d+D|T\\d+H|\\d+DT\\d+H)$"
          description: >-
            How often the table is expected to be refreshed, an ISO 8601 duration of
            weeks, days or hours (`P1D`, `PT6H`, `P1W`, `P1DT12H`) (#781). Months and
            years are refused — their length varies. It decides `status_axes.health`.
        quality:
          oneOf:
            - $ref: "#/components/schemas/QualityPolicy"
            - type: "null"
        composition:
          description: >-
            두 source를 join해 하나의 결합 Gold dataset을 추가로 만드는 계약
            (#506). None이면 기존과 동일하게 source별 독립 Gold만 생성한다.
          oneOf:
            - $ref: "#/components/schemas/CompositionSpec"
            - type: "null"

    SourceRef:
      type: object
      description: >-
        Canonical source 참조(#498). `kind`로 public_api(기본, 하위 호환)/file/url을
        구분한다. `kind`를 생략한 source는 항상 `public_api`로 해석되며
        provider/dataset이 필수다. `file`은 upload_id+format(+encoding)이,
        `url`은 endpoint(+method+format)가 필수다 — kind별 조건부 필수/금지
        조합은 OpenAPI object schema로 표현하지 않고(이 계약의 기존 패턴과 동일하게
        `additionalProperties`로 열어두고) `spec/loader.py`·`validator.py`가
        엄격히 강제한다. url source는 P0 범위(GET, Auth=None)의 SSRF-safe fetch만
        허용하며 https가 아닌 scheme·userinfo가 포함된 endpoint는 거부된다.
        제거된 normalization_mode 필드는 허용하지 않는다.
      additionalProperties: true
      not:
        required: [normalization_mode]
      properties:
        kind:
          type: string
          enum: [public_api, file, url]
          default: public_api
        provider:
          type: string
          description: kind="public_api"에서 필수.
        dataset:
          type: string
          description: kind="public_api"에서 필수.
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: >-
            list 호출에 전달할 원시 파라미터. `param_grid`와 함께 쓰면 전개된
            모든 조합에 공통으로 붙는 값이 된다(예: `numOfRows`).
        param_grid:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/JsonValue"
            minItems: 1
          default: {}
          description: >-
            여러 파라미터 조합에 걸쳐 반복 호출하기 위한 선언(#613). 값마다
            리스트를 주면 데카르트 곱으로 전개되고, 각 조합의 결과가 하나의
            Bronze artifact로 이어붙는다. `kind="public_api"`에서만 유효하다.
            전개 순서는 고정이다 — 키를 이름순으로 정렬하고 마지막 키가 가장
            빨리 변하며, 각 축 안에서는 선언된 값 순서를 지킨다. 순서가 바뀌면
            Bronze 바이트가 바뀌어 재빌드 결정성이 깨진다. 같은 키를 `params`와
            양쪽에 두는 선언은 거부된다.
        alias:
          type: string
          default: ""
        schema:
          oneOf:
            - $ref: "#/components/schemas/SchemaContract"
            - type: "null"
        upload_id:
          type: string
          pattern: "^upl_[a-f0-9]{32}$"
          description: kind="file"에서 필수. POST /uploads가 발급한 식별자.
        format:
          type: string
          enum: [csv, json, jsonl, parquet]
          description: >-
            kind="file"에서 필수(업로드 시 검증된 format과 정확히 일치해야 함).
            kind="url"에서는 선택(json/jsonl/csv만 허용, 생략 시 응답
            Content-Type로 추론).
        encoding:
          type: string
          default: utf-8
          description: kind="file"에서 텍스트(csv/json/jsonl) 디코딩에 쓰는 인코딩.
        endpoint:
          type: string
          format: uri
          description: kind="url"에서 필수. https만 허용한다(SSRF 정책, #498).
        method:
          type: string
          enum: [GET]
          default: GET
          description: kind="url"에서만 쓰이며 P0는 GET만 허용한다.
        gold:
          type: object
          additionalProperties: false
          description: >-
            The columns and rows this source's Gold keeps (#659). Silver keeps every
            column and row; `filters` run first, then `select` picks and orders
            columns. Not allowed with `composition`. Declared PII columns are masked
            in Gold by default (#689).
          properties:
            select:
              type: array
              items: {type: string}
            pii_columns:
              type: array
              items: {type: string}
              description: >-
                Silver columns this BuildSpec declares PII, on top of those kpubdata's
                spec declares (#689). A name Silver lacks fails the source.
            publish_unmasked:
              type: array
              items: {type: string}
              description: >-
                Declared PII columns to publish unmasked anyway (#689). Each one is
                recorded as a manifest warning; unmasked is never the default. The
                `pii` scan gate still counts such a column: under `mode: block` it
                must also be in `pii.allow_columns` (#902).
            filters:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [column, op]
                properties:
                  column: {type: string}
                  op:
                    type: string
                    enum: [eq, ne, gt, ge, lt, le, in, not_null]
                  value:
                    $ref: "#/components/schemas/JsonValue"

    SchemaContract:
      type: object
      description: Silver 정규화 및 required-column/dtype 검증 계약
      properties:
        required:
          type: array
          items:
            type: string
          default: []
        dtypes:
          type: object
          additionalProperties:
            type: string
          default: {}
        casts:
          type: object
          additionalProperties:
            type: string
          default: {}
        rename:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: >-
            원 필드명 → canonical 컬럼명 매핑(#611). 캐스팅보다 먼저 적용되므로
            required/dtypes/casts/derived는 모두 rename 이후의 이름을 가리킨다.
        derived:
          type: array
          items:
            $ref: "#/components/schemas/DerivedColumn"
          default: []
          description: >-
            기존 컬럼에서 새 컬럼을 만드는 규칙(#611). 캐스팅 뒤에 적용된다 —
            파생 규칙이 캐스팅된 값을 읽을 수 있어야 하기 때문이다.
        read_as:
          type: object
          additionalProperties:
            type: string
            enum: [str]
          default: {}
          description: >-
            원천 컬럼을 읽을 타입 선언(#613). 레코드마다 타입이 다른 원천 컬럼을
            선언으로 처리한다. 키는 rename *이전* 의 원 필드명이다 — 테이블이
            만들어지기 전에 적용되기 때문이다. CSV 원천에서는 파싱 단계에서
            적용되어 `00123` 같은 식별자의 앞자리 0이 보존된다.
        null_tokens:
          type: array
          items:
            type: string
          default: []
          description: >-
            결측을 나타내는 원천 표기(#613, 예: `[""]`). 캐스팅 전에 null로 모은다.
            결측을 지우는 것이 아니라 표기를 하나로 맞추는 것이며, 선언되지 않은
            값은 건드리지 않는다.
        coalesce:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            minItems: 1
          default: {}
          description: >-
            세대별 alias 컬럼을 하나의 canonical 컬럼으로 모으는 규칙(#620). 키는
            canonical 컬럼명, 값은 rename *이전* 의 후보 원 필드명이다. 수렴한 후보
            컬럼은 canonical 컬럼에 흡수되어 사라진다. 한 규칙의 target이 다른
            규칙의 후보이거나 두 규칙이 같은 후보를 두고 다투면, 결과가 선언 순서에
            달리므로 거부된다.
        zfill:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          default: {}
          description: >-
            canonical 식별자를 선언된 폭으로 왼쪽 0 padding 한다(#620). 키는 rename
            *이후* 의 이름이다. null은 null로 남고, 선언 폭보다 긴 값은 잘리지 않고
            빌드를 세운다.
        column_null_tokens:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnNullTokens"
          default: {}
          description: >-
            컬럼별 결측 표기 선언(#623). 키는 rename *이전* 의 원 필드명이다. 한
            컬럼에서 인정하는 결측 표현은 전역 `null_tokens` + 그 컬럼의 선언이며,
            컬럼별 선언이 전역을 덮어쓰지 않는다.

    ColumnNullTokens:
      type: object
      description: >-
        한 컬럼의 결측 표기 선언과, 그 컬럼이 없을 때의 정책(#623). "이 컬럼에서
        무엇이 결측인가"와 "이 컬럼이 반드시 있어야 하는가"는 별개의 계약이라
        presence 정책을 따로 둔다.
      properties:
        tokens:
          type: array
          items:
            type: string
          default: []
          description: 이 컬럼에서 결측으로 볼 원천 표기. 전역 null_tokens에 더해진다.
        on_absent:
          type: string
          enum: [error, ignore]
          default: error
          description: >-
            컬럼이 없을 때. `error`는 오타와 schema drift를 잡는다 — 선언이 조용한
            무동작이 되면 결측이 값으로 남은 채 품질 지표가 그것을 세지 않는다.
            `ignore`는 이 규칙의 적용만 건너뛰며, 그 컬럼을 optional로 만들지는
            않는다.

    DerivedColumn:
      type: object
      description: >-
        기존 컬럼에서 새 컬럼을 만드는 typed 규칙(#611). 자유형 표현식은 지원하지
        않는다 — RangeRule/CompareColumnsRule의 관례를 따른다.
      required: [name, kind, columns]
      properties:
        name:
          type: string
          description: 만들어질 컬럼명.
        kind:
          type: string
          enum: [date_parts, join_key]
          description: >-
            date_parts는 연/월/일 세 컬럼을 Date로 합치고, join_key는 여러 컬럼을
            하나의 문자열 복합키로 합친다.
        columns:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            입력 컬럼명. date_parts는 (year, month, day) 순서로 정확히 3개,
            join_key는 1개 이상.

    UploadMetadata:
      type: object
      description: >-
        안전한(secret-free) 업로드 메타데이터(#498). content는 절대 포함하지
        않으며, 이 API로는 원문 content를 다시 조회할 수 없다.
      required: [upload_id, format, encoding, size_bytes, original_filename, created_at]
      properties:
        upload_id:
          type: string
          pattern: "^upl_[a-f0-9]{32}$"
        format:
          type: string
          enum: [csv, json, jsonl, parquet]
        encoding:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        original_filename:
          type: [string, "null"]
          description: 표시 전용 원본 파일명(파일시스템 경로 아님).
        created_at:
          type: string
          format: date-time

    UploadDeleteResponse:
      type: object
      required: [upload_id, deleted]
      properties:
        upload_id:
          type: string
        deleted:
          type: boolean

    ExportTarget:
      type: object
      required: [kind, output_path]
      properties:
        kind:
          type: string
        output_path:
          type: string
        options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"

    SplitSpec:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ratio, key]
        ratios:
          type: object
          additionalProperties:
            type: number
          default: {}
        key:
          type: string
          default: ""
        seed:
          type: integer
          default: 0

    PiiPolicy:
      type: object
      description: >-
        The Silver PII scan gate (#441). Declared PII columns Gold masks (#689) are
        handled and not counted (#902). `allow_columns` accepts a column's plain
        values as publishable (the gate, warehouse profiles and exports read it so);
        it does not unmask a declared column, and `gold.publish_unmasked` does not
        exempt a column from the gate.
      properties:
        mode:
          type: string
          enum: [block, warn, allow]
          default: block
        allow_columns:
          type: array
          items:
            type: string
          default: []

    QualitySeverity:
      type: string
      description: >-
        quality rule 위반 시 심각도 (#486). "warn"(기본, Build 계속 진행) |
        "fail"(Gold 진입 전 소스 실패).
      enum: [warn, fail]
      default: warn

    QualityRangeRule:
      type: object
      description: >-
        숫자 컬럼의 최소/최대 범위 규칙 (#486). min/max는 포함(inclusive) 경계이며
        자유형 eval을 쓰지 않는 typed rule이다. null 값은 위반으로 계산하지 않는다.
      required: [column]
      properties:
        column:
          type: string
        min:
          type: [number, "null"]
        max:
          type: [number, "null"]
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityCompareColumnsRule:
      type: object
      description: >-
        두 컬럼 간 비교 규칙 (#486). operator는 제한된 어휘만 허용하며 자유형
        expression/eval을 쓰지 않는다. 두 컬럼 모두 null이 아닌 행만 평가한다.
      required: [left, operator, right]
      properties:
        left:
          type: string
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        right:
          type: string
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityPolicy:
      type: object
      description: >-
        데이터 품질 임계 정책. max_duplicate_rate/max_null_ratio/min_rows(#446)는
        기존 syntax와 100% 하위 호환이며 기본 severity는 "warn"이다. 대응하는
        ``*_severity`` 필드(#486)로 명시적 FAIL을 선언할 수 있다.
      properties:
        max_duplicate_rate:
          type: [number, "null"]
        max_duplicate_rate_severity:
          $ref: "#/components/schemas/QualitySeverity"
        max_null_ratio:
          type: object
          additionalProperties:
            type: number
          default: {}
        max_null_ratio_severity:
          type: object
          description: 컬럼별 max_null_ratio severity override. 선언 안 된 컬럼은 "warn".
          additionalProperties:
            $ref: "#/components/schemas/QualitySeverity"
          default: {}
        min_rows:
          type: [integer, "null"]
        min_rows_severity:
          $ref: "#/components/schemas/QualitySeverity"
        range:
          type: array
          items:
            $ref: "#/components/schemas/QualityRangeRule"
          default: []
        compare_columns:
          type: array
          items:
            $ref: "#/components/schemas/QualityCompareColumnsRule"
          default: []

    JoinSpec:
      type: object
      description: >-
        두 source를 결합하는 equi-join 계약(#506). 초기 범위는 두 source
        단일 join으로 제한한다 — 3개 이상 join graph, 자유형 SQL join
        조건은 지원하지 않는다. left/right는 sources[].alias를 참조해야
        하며, 참조되는 source는 alias를 반드시 선언해야 한다.
        The join key is given either as `keys` (a composite key) or as the
        single-pair shorthand `left_key`/`right_key` — exactly one of the two
        forms (#698); the spec loader refuses both and neither.
      required: [left, right]
      properties:
        left:
          type: string
          description: 왼쪽 source의 alias (sources[].alias 참조)
        right:
          type: string
          description: 오른쪽 source의 alias
        left_key:
          type: string
          description: 왼쪽 테이블의 join key 컬럼명 (single-pair shorthand)
        right_key:
          type: string
          description: 오른쪽 테이블의 join key 컬럼명 (single-pair shorthand)
        keys:
          type: array
          minItems: 1
          description: >-
            Composite join key as column pairs (#698). A row matches when every
            pair is equal.
          items:
            $ref: "#/components/schemas/JoinKeyPair"
        type:
          type: string
          enum: [inner, left]
          default: inner
        on_duplicate_key:
          type: string
          enum: [warn, fail]
          default: warn
          description: >-
            Handling when a key present on both sides repeats on both sides, so
            its rows multiply many-to-many. Keys that appear on only one side
            never trigger it (#698). warn은 경고만 남기고 결과를 만들고, fail은
            빌드를 실패시킨다.
        cardinality:
          oneOf:
            - type: string
              enum: [one_to_one, one_to_many, many_to_one, many_to_many]
            - type: "null"
          description: >-
            Declared cardinality, read left to right (#698): `many_to_one` means a
            key may repeat on the left and must be unique on the right. Verified
            against the keys present on both sides; a violation fails the build.
            A "many" side allows repeats but does not require them. Absent or
            null means not declared.
        on_null_key:
          type: string
          enum: [warn, fail]
          default: warn
          description: >-
            Handling of rows with a null in any key column (#698). Such rows never
            match; warn counts them in the manifest, fail refuses the build.

    JoinKeyPair:
      type: object
      description: One join key column pair (#698).
      required: [left, right]
      additionalProperties: false
      properties:
        left:
          type: string
          description: Key column in the left table
        right:
          type: string
          description: Key column in the right table

    CompositionSpec:
      type: object
      description: 여러 source를 하나의 결합 Gold dataset으로 조립하는 계약(#506).
      required: [name, join]
      properties:
        name:
          type: string
          description: >-
            결합 결과 Gold dataset 이름. 다른 source의 output key(alias 또는
            provider.dataset)와 겹치면 안 된다.
        join:
          $ref: "#/components/schemas/JoinSpec"

    SpecRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열

    PreviewRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 5
          description: >-
            상한 1000은 #497에서 새로 도입됐다(behavioral tightening — v1.8.0
            이전에는 상한이 없었다). 1000을 넘는 값은 400을 반환한다.
        sample_mode:
          type: string
          enum: [first, random]
          default: first
          description: >-
            "first"는 상위 N행, "random"은 seed 기반 결정적 무작위 N행이다(#497).
            Source sample과 Silver sample은 항상 같은 행 인덱스를 공유한다 —
            생략하면 기존 client와 동일하게 상위 N행을 반환한다.
        seed:
          type: integer
          description: >-
            sample_mode=random일 때 쓰는 결정적 시드(#497). 생략하면 고정
            기본값을 써서 seed 없이도 재현 가능하다. sample_mode=first에서는
            무시된다.

    BuildRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        run_id:
          type: string
          description: 명시 시 비어있지 않은 경로 안전한 단일 세그먼트여야 한다

    VersionResponse:
      type: object
      required: [service, api_version]
      properties:
        service:
          type: string
        api_version:
          type: string
          description: The HTTP contract version (this document's info.version).
        version:
          type: string
          description: >-
            The installed application version (#777). Builder and Studio share it
            (ADR 0004); it differs from api_version, which counts the wire contract.
        publish_credential:
          type: string
          enum: [request, stored, stored_or_server]
          description: >-
            이 배포가 게시 credential(Hugging Face·Kaggle 토큰)을 어디서 받는지(#938).
            `request` — 다중 사용자 배포: 요청의 `X-Publish-Credential` 헤더에서만
            받고 저장하지 않는다(#925). `stored` — 단일 사용자 배포에서
            `KPUBDATA_BUILDER_REQUIRE_OWN_PUBLISH_CREDENTIAL=true`: 요청자에게 저장된
            `publish-*` credential만 쓴다(#635). `stored_or_server` — 단일 사용자 기본값:
            저장된 credential, 없으면 서버의 `HF_TOKEN`/`KAGGLE_*`. 헤더는 `request`일
            때만 읽히고 그 밖에는 무시된다. 정책만 알리며 서버나 요청자에게 credential이
            실제로 있는지는 알리지 않는다 — 그건 readiness의 `credential_unavailable`/
            `credential_required`가 알린다. 1.69.0부터 항상 보낸다.

    HealthResponse:
      type: object
      required: [status]
      description: liveness probe 응답 (버전·메타 정보 없이 status만, #372)
      properties:
        status:
          type: string
          const: "ok"

    CatalogResponse:
      type: object
      required: [providers]
      description: provider/dataset 카탈로그 (#416, BL2)
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProvider"

    CatalogProvider:
      type: object
      required: [name, datasets]
      properties:
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDataset"

    CatalogDataset:
      type: object
      required:
        [
          name,
          title,
          description,
          tags,
          source_url,
          representation,
          operations,
          query_support,
          requires_service_key,
          request_parameters,
          application,
        ]
      description: >
        DatasetRef의 public/canonical metadata를 allowlist로 직렬화한다 (#490).
        raw_metadata는 provider 내부 정보/secret이 섞일 수 있어 노출하지 않는다.
        metadata가 없는 dataset은 description/source_url/query_support가 null,
        tags/operations가 빈 배열이다.
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
          description: 사람이 읽는 데이터셋 설명 (없으면 null)
        tags:
          type: array
          items:
            type: string
          description: 탐색용 분류 태그 (정렬된 문자열 배열, 없으면 빈 배열)
        source_url:
          type: [string, "null"]
          description: 원본 API 문서/데이터 포털 URL (없으면 null)
        representation:
          type: string
          enum: [api_json, api_xml, file_csv, file_excel, sheet, other]
          description: >-
            Builder's vocabulary (#831), currently mirroring kpubdata's Representation.
            A value Builder has not mapped is sent as `other`.
        operations:
          type: array
          items:
            type: string
            enum: [list, get, schema, raw, download]
          description: >-
            지원 작업 (정렬된 문자열 배열, 없으면 빈 배열). Builder's vocabulary (#831),
            currently mirroring kpubdata's Operation; an operation Builder has not
            mapped is left out.
        query_support:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CatalogQuerySupport"
          description: >-
            목록 질의 capability (알려진 경우만, 없으면 null). null too when kpubdata
            reports a paging mode Builder has not mapped (#831).
        requires_service_key:
          type: boolean
        request_parameters:
          type: array
          items:
            $ref: "#/components/schemas/CatalogRequestParameter"
          description: >
            선택한 Dataset에 전달하는 요청 파라미터의 secret-free 설명 (#490 후속,
            additive). raw_metadata에서 allowlist로 추린 것으로 serviceKey 등 시크릿
            파라미터는 포함되지 않는다. metadata가 없으면 빈 배열.
        application:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CatalogApplication"
          description: >
            공공데이터포털처럼 API Key 발급과 Dataset별 활용신청이 별개일 수 있는
            경우의 안내 (#490 후속, additive). raw_metadata.application에서
            그대로 전달한 것으로, 없으면 null(활용신청이 필요 없다는 뜻이 아니라
            알려진 바 없음). Studio는 신청 완료/승인 여부를 이 필드로 추측하지 않는다
            — Preview 성공이 실제 사용 가능 여부의 최종 확인이다.
        quota:
          type: [string, "null"]
          description: >-
            The provider's rate limit for this dataset, exactly as the kpubdata spec's
            licence declares it (for example `개발계정 일 10,000건`), not parsed (#778,
            additive). null when the spec declares no quota or the installed kpubdata
            does not expose licence terms yet — unknown, not unlimited. Builder does not
            count calls, so this is the budget, not the consumption.

    CatalogRequestParameter:
      type: object
      required: [name, required, description, example]
      properties:
        name:
          type: string
          description: 요청 파라미터 이름 (시크릿/serviceKey 계열은 제외됨)
        required:
          type: boolean
          description: 이 파라미터가 필수인지
        description:
          type: [string, "null"]
          description: 사람이 읽는 설명 (없으면 null)
        example:
          type: [string, "null"]
          description: 근거 있는 예시 값 (없으면 null)

    CatalogApplication:
      type: object
      required: [required, url]
      description: >
        Dataset별 활용신청 안내 (API Key 발급과 별개일 수 있음). Studio는 신청
        완료/승인 상태를 이 필드로 만들어내지 않는다 — 알 수 없으면 알 수 없는
        상태로 남긴다.
      properties:
        required:
          type: boolean
          description: 이 Dataset이 API Key 등록과 별도로 활용신청이 필요할 수 있는지
        url:
          type: string
          format: uri
          description: 공식 Dataset 상세/활용신청 페이지 (http/https만 허용)

    CatalogQuerySupport:
      type: object
      required: [pagination, filterable_fields, sortable_fields, time_range, max_page_size]
      properties:
        pagination:
          type: string
          enum: [offset, index, cursor, none]
          description: Builder's vocabulary (#831), currently mirroring kpubdata's PaginationMode.
        filterable_fields:
          type: array
          items:
            type: string
        sortable_fields:
          type: array
          items:
            type: string
        time_range:
          type: boolean
        max_page_size:
          type: [integer, "null"]
          minimum: 1

    ProviderListResponse:
      type: object
      required: [providers]
      additionalProperties: false
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"

    ProviderSummary:
      type: object
      required: [provider, requires_credential, configured]
      additionalProperties: false
      properties:
        provider:
          type: string
        requires_credential:
          type: boolean
        configured:
          type: boolean
          description: user credential, server default, 또는 무인증 Provider이면 true
        last_test:
          description: >-
            This principal's last connection test of the provider (#842); null when it
            was never tested. The key is never stored with it.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [status, checked_at, error_category, response_code, dataset]
              properties:
                status:
                  type: string
                  enum: [connected, failed, not_configured, not_testable]
                checked_at: {type: string, format: date-time}
                error_category:
                  type: [string, "null"]
                  enum: [auth, network, timeout, provider, unknown, null]
                response_code: {type: [integer, "null"], minimum: 100, maximum: 599}
                dataset:
                  type: [string, "null"]
                  description: The dataset the test called.

    ProviderCredentialPutRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential:
          type: string
          minLength: 1
          writeOnly: true
          description: 저장할 raw credential. 응답, 로그, manifest, event에 포함하지 않는다.

    ProviderCredentialMetadata:
      type: object
      required: [provider, configured, masked, updated_at]
      additionalProperties: false
      description: owner_id와 credential 원문을 포함하지 않는 사용자별 저장 메타데이터
      properties:
        provider:
          type: string
        configured:
          type: boolean
        masked:
          type: [string, "null"]
          description: 설정 시 고정 마스크. credential 일부도 노출하지 않는다.
        updated_at:
          type: [string, "null"]
          format: date-time

    ProviderCredentialGetResponse:
      type: object
      required: [configured, masked, updated_at]
      additionalProperties: false
      description: GET credential 응답. provider, owner_id, credential 원문을 포함하지 않는다.
      properties:
        configured:
          type: boolean
        masked:
          type: [string, "null"]
          description: 설정 시 고정 마스크. credential 일부도 노출하지 않는다.
        updated_at:
          type: [string, "null"]
          format: date-time

    ProviderTestResponse:
      type: object
      required: [provider, status, configured, latency_ms, checked_at]
      additionalProperties: false
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [connected, failed, not_configured, not_testable]
          description: >-
            `not_testable` (#842): no dataset of the provider can be called without
            guessing a parameter — none declares an example for every required one
            (dates excluded) and needs no per-dataset application. It says nothing
            about the key.
        configured:
          type: boolean
        dataset:
          type: string
          description: >-
            The dataset a `connected` test called (#842), chosen by declared parameters
            and application, not the provider's first dataset.
        latency_ms:
          type: integer
          minimum: 0
        checked_at:
          type: string
          format: date-time
        error_category:
          type: string
          enum: [auth, network, timeout, provider, unknown]
        response_code:
          type: integer
          minimum: 100
          maximum: 599
          description: kpubdata가 구조적으로 신뢰 가능한 status를 제공한 경우에만 포함

    StructuredProblem:
      type: object
      required: [code, path, message]
      description: 구조화된 검증 문제 (#417, BL3)
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string
        hint:
          type: string
          nullable: true

    ValidateResponse:
      type: object
      required: [status, dataset_id, api_version]
      properties:
        status:
          type: string
          enum: [valid]
        dataset_id:
          type: string
        api_version:
          type: string

    PreviewResponse:
      type: object
      required: [dataset_id, previews]
      properties:
        dataset_id:
          type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/SourcePreview"

    SourcePreview:
      type: object
      required:
        - source_key
        - status
        - error
        - schema
        - sample
        - total_rows
        - statistics
        - quality_results
        - source_sample
        - sample_mode
        - diff_available
        - diffs
        - transform_summary
        - diff_truncated
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        error:
          type: [string, "null"]
        schema:
          type: array
          items:
            type: object
            required: [name, dtype, nullable, unique_count, logical_type, wire_encoding]
            properties:
              name:
                type: string
              dtype:
                type: string
              nullable:
                type: boolean
              unique_count:
                type: integer
              logical_type:
                type: string
                description: >-
                  As `ColumnWireInfo.logical_type`: `identifier` for a text column the
                  source's kpubdata spec declares a code (#702).
              wire_encoding:
                $ref: "#/components/schemas/WireEncoding"
              semantic:
                $ref: "#/components/schemas/ColumnSemanticHint"
              display:
                $ref: "#/components/schemas/ColumnDisplayHint"
              unit:
                $ref: "#/components/schemas/ColumnUnitHint"
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        total_rows:
          type: integer
        statistics:
          $ref: "#/components/schemas/TableStatistics"
        quality_results:
          type: array
          description: >-
            구조화된 Quality/Schema 평가 결과 (#486). Build와 동일한 evaluator
            결과이며 PASS를 포함한 실제로 평가된 check만 담는다. drift는 preview가
            워크스페이스에 아무것도 쓰지 않으므로 포함하지 않는다.
          items:
            $ref: "#/components/schemas/QualityCheckResult"
        masked_columns:
          allOf:
            - $ref: "#/components/schemas/MaskedColumns"
          description: >-
            The declared PII columns masked in `sample`, in the `source_sample` fields
            that become them, and in their `diffs` (#900).
        source_sample:
          type: array
          description: >-
            변환 전 Bronze 원본 sample(#497). diff_available=false여도 최선
            노력으로 채워질 수 있다(조회 자체가 실패하면 빈 배열).
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        sample_mode:
          type: string
          enum: [first, random]
          description: 이 응답에 실제로 적용된 sampling 방식.
        diff_available:
          type: boolean
          description: >-
            source_sample[i]와 sample[i]가 동일 논리 행을 가리킨다고 보장할 수
            있을 때만 true다(#497). 행 수 불일치, row reorder/filter 가능성,
            조회 실패 등에서는 false이며 diffs/transform_summary는 빈 값이다.
            잘못된 index 기반 비교보다 false가 우선이다.
        diffs:
          type: array
          description: >-
            diff_available=true일 때만 채워지는 셀 단위 변경 목록(#497). limit은
            행 수만 제한하고 컬럼 수는 제한하지 않으므로, 실제 변경 셀 수가
            많으면 최대 1000개(MAX_PREVIEW_DIFF_ITEMS)까지만 담긴다 —
            diff_truncated로 잘렸는지 확인한다.
          items:
            $ref: "#/components/schemas/PreviewDiffItem"
        transform_summary:
          description: >-
            diff_available=true일 때만 채워지는 변경 요약(#497). 비교 가능한
            sample 범위 기준이며 전체 dataset 변화량이 아니다. diffs가
            diff_truncated로 잘려도 changed_cells/changed_rows는 잘리지 않은
            실제 합계를 유지한다.
          oneOf:
            - $ref: "#/components/schemas/PreviewTransformSummary"
            - type: "null"
        diff_truncated:
          type: boolean
          description: >-
            diffs가 MAX_PREVIEW_DIFF_ITEMS(1000) 상한에 걸려 실제 변경 셀 전부를
            담지 못했으면 true다(#497 sample/diff memory 상한). diffs를 전체
            diff로 오인하지 않도록 명시한다. diff_available=false면 애초에
            diff를 시도하지 않았으므로 항상 false다.

    PreviewDiffItem:
      type: object
      description: >-
        Source↔Silver 셀 단위 변경 하나(#497). diff_available=true인 source의
        diffs에만 등장한다.
      additionalProperties: false
      required: [row, column, before, after, transform]
      properties:
        row:
          type: integer
          minimum: 0
          description: source_sample/sample 배열 내 0-based 위치(전체 dataset의 절대 행 번호 아님).
        column:
          type: string
        before:
          $ref: "#/components/schemas/JsonValue"
        after:
          $ref: "#/components/schemas/JsonValue"
        transform:
          type: [string, "null"]
          description: >-
            컬럼에 선언된 캐스팅(schema.casts)이 있을 때만 "cast:{dtype}" 형태로
            채운다. 알 수 없는 변환은 추측하지 않고 null.

    PreviewTransformSummary:
      type: object
      description: 비교 가능한 sample 범위에서 계산한 변경 요약(#497).
      additionalProperties: false
      required: [changed_cells, changed_rows]
      properties:
        changed_cells:
          type: integer
          minimum: 0
        changed_rows:
          type: integer
          minimum: 0

    QualityIssuesResponse:
      type: object
      additionalProperties: false
      required: [issues, total, next_cursor, coverage]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
        total:
          type: integer
          minimum: 0
          description: Rows matching the filters, across all pages.
        next_cursor: {type: [string, "null"]}
        coverage:
          type: object
          additionalProperties: false
          required: [tables, evaluated, not_evaluated, partial, unreadable]
          description: >-
            Tables read (after the `dataset_id` filter) by what their latest run says
            about quality. `not_evaluated`: no results or zero checks. `partial`: some
            sources only. `unreadable`: the manifest cannot be read. None of these is
            a pass.
          properties:
            tables: {type: integer, minimum: 0}
            evaluated: {type: integer, minimum: 0}
            not_evaluated: {type: integer, minimum: 0}
            partial: {type: integer, minimum: 0}
            unreadable: {type: integer, minimum: 0}

    QualityIssue:
      type: object
      additionalProperties: false
      required:
        [dataset_id, title, run_id, finished_at, source_key, kind, status, category, check,
         drift]
      properties:
        dataset_id: {type: string}
        title: {type: [string, "null"]}
        run_id: {type: string}
        finished_at: {type: [string, "null"]}
        source_key: {type: string}
        kind: {type: string, enum: [check, drift]}
        status: {type: string, enum: [fail, warn, drift]}
        category: {type: [string, "null"]}
        check:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/QualityCheckResult"
        drift:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SchemaDriftFinding"

    QualityCheckResult:
      type: object
      description: 단일 quality/schema check의 구조화된 결과 (#486).
      additionalProperties: false
      required:
        - source_key
        - category
        - rule
        - column
        - status
        - actual
        - threshold
        - affected_rows
        - evaluated_rows
        - detail
      properties:
        source_key:
          type: string
        category:
          type: string
          description: >-
            check 대분류(예: duplicate, missing, row_count, schema, range,
            compare_columns).
        rule:
          type: string
          description: >-
            구체적 rule 이름(예: max_duplicate_rate, max_null_ratio, min_rows,
            required_column, dtype, range, compare_columns).
        column:
          type: [string, "null"]
          description: >-
            관련 컬럼명. 테이블 전체 규칙이면 null. compare_columns는
            "{left},{right}" 형식의 합성값을 쓴다.
        status:
          type: string
          enum: [pass, warn, fail]
        actual:
          $ref: "#/components/schemas/JsonValue"
        threshold:
          $ref: "#/components/schemas/JsonValue"
          description: >-
            원래 규칙의 비교 조건. 기존 비율/행 수 규칙은 numeric 값을 유지한다.
            range는 {min, max}, compare_columns는 {operator, right_column} 구조다.
        affected_rows:
          type: [integer, "null"]
          description: 위반 행 수. 정확히 셀 수 없으면 null(임의 추정 금지).
        evaluated_rows:
          type: [integer, "null"]
          description: 실제 평가에 사용된 행 수. 의미 없으면 null.
        detail:
          type: [string, "null"]
          description: >-
            평가 불가 이유 등 사용자가 이해할 수 있는 결정적 설명. 정상 평가 결과는
            null이며 내부 예외·스택 트레이스·절대 경로를 포함하지 않는다.

    SchemaDriftFinding:
      type: object
      description: >-
        구조화된 schema drift 관찰 (#445, #486). deterministic 감지 결과이며
        PASS/WARN/FAIL 게이트에는 관여하지 않는다(참고용).
      additionalProperties: false
      required: [kind, column, detail]
      properties:
        kind:
          type: string
          enum: [column_added, column_removed, dtype_changed, row_count_jump]
        column:
          type: [string, "null"]
        detail:
          type: string

    BuildQualityResponse:
      type: object
      description: >-
        run의 구조화된 quality_results/schema_drift 조회 응답 (#486). `availability`와
        `evaluated_checks`는 빈 `quality_results`가 "0건 평가"인지 "애초에 계산된 적
        없음"(legacy/partial run)인지 구분한다(#514).
      required: [run_id, availability, evaluated_checks, quality_results, schema_drift]
      properties:
        run_id:
          type: string
        availability:
          type: string
          enum: [available, partial, unavailable]
          description: >-
            available: 이 run이 시도한 모든 source의 quality 결과가 있다(0건일 수
            있음). partial: 일부 source만 있다(예: 한 source의 Silver 실패).
            unavailable: 결과가 전혀 없다 — quality_results 필드 자체가 없는 legacy
            run(#486 이전)뿐 아니라, 필드는 있지만(`{}`) 시도한 source 중 하나도
            결과가 없는 새 run도 포함한다(예: 모든 source가 quality 단계 진입 전에
            실패).
        evaluated_checks:
          type: integer
          minimum: 0
          description: quality_results 전체에서 실제로 평가된 check(PASS/WARN/FAIL) 총합.
        quality_results:
          type: object
          description: source_key → QualityCheckResult 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"

    DatasetQualityHistoryEntry:
      type: object
      description: >-
        단일 run의 quality PASS/WARN/FAIL 집계 (#486). evaluated_checks==0이면
        rule_pass_rate는 반드시 null이다(미평가를 100%로 위장하지 않는다).
      required:
        - run_id
        - timestamp
        - status
        - pass_count
        - warn_count
        - fail_count
        - evaluated_checks
        - rule_pass_rate
        - validated_rows
      properties:
        run_id:
          type: string
        timestamp:
          type: [string, "null"]
          description: finished_at(없으면 started_at).
        status:
          type: string
          enum: [ok, failed, cancelled]
        pass_count:
          type: integer
        warn_count:
          type: integer
        fail_count:
          type: integer
        evaluated_checks:
          type: integer
          description: pass_count + warn_count + fail_count.
        rule_pass_rate:
          type: [number, "null"]
          description: pass_count / evaluated_checks. evaluated_checks==0이면 null.
        validated_rows:
          type: [integer, "null"]
          description: >-
            run/source의 Silver row_count 합계(#488 row_counts semantics 재사용).
            evaluated_rows를 rule 수만큼 중복 합산하지 않는다.

    DatasetQualityHistoryResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          description: newest first.
          items:
            $ref: "#/components/schemas/DatasetQualityHistoryEntry"

    QualitySummaryResponse:
      type: object
      description: >-
        최근 window cross-run quality aggregate (#486 후속). 시간 기준은 canonical
        run timestamp(finished_at, 없으면 started_at)를 UTC로 파싱한
        `(generated_at - window, generated_at]`이며, 파싱 불가능한 timestamp를 가진
        run은 창에 놓을 수 없어 제외된다. 미평가/unavailable run을 PASS로 세지
        않는다.
      required:
        - window
        - generated_at
        - availability
        - total_runs
        - evaluated_runs
        - pass_runs
        - warn_runs
        - fail_runs
      additionalProperties: false
      properties:
        window:
          type: string
          enum: [24h]
        generated_at:
          type: string
          description: 집계 기준 시각(UTC, ISO 8601, 초 단위).
        availability:
          type: string
          enum: [available, unavailable]
          description: >-
            available: 집계 성공(run 0건이어도 유효). unavailable: 접근 가능한 run
            목록 자체를 열거하지 못함 — 이때 모든 count는 0이며 "0건"과 구분된다.
        total_runs:
          type: integer
          minimum: 0
          description: window 안의 접근 가능한 canonical run 수(status 무관).
        evaluated_runs:
          type: integer
          minimum: 0
          description: >-
            그 중 structured quality가 실제로 평가된(evaluated_checks > 0) run 수.
        pass_runs:
          type: integer
          minimum: 0
          description: evaluated run 중 WARN·FAIL 결과가 하나도 없는 run 수.
        warn_runs:
          type: integer
          minimum: 0
          description: >-
            evaluated run 중 WARN 결과가 하나 이상인 run 수(같은 run의 WARN check
            여러 개여도 1). Studio Home "QUALITY WARN (24H)" KPI. fail_runs와
            독립적이라 겹칠 수 있다.
        fail_runs:
          type: integer
          minimum: 0
          description: >-
            evaluated run 중 FAIL 결과가 하나 이상인 run 수. `pass_runs +
            (WARN 또는 FAIL이 있는 run 수) == evaluated_runs`.

    TableStatistics:
      type: object
      required: [row_count, null_counts, duplicate_rate]
      properties:
        row_count:
          type: integer
        null_counts:
          type: object
          additionalProperties:
            type: integer
        duplicate_rate:
          type: number

    BuildOutcome:
      type: object
      required: [source_key, status, stages_completed, error]
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        stages_completed:
          type: array
          items:
            type: string
        error:
          type: [string, "null"]

    BuildSuccessResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        composition:
          description: BuildSpec.composition이 없으면 null (#506).
          oneOf:
            - $ref: "#/components/schemas/CompositionOutcome"
            - type: "null"
        manifest:
          type: string
          description: 기록된 manifest.json의 경로
        api_version:
          type: string
        warehouse_failures:
          type: object
          description: >-
            Present only when a table commit failed (#788): source key -> reason
            (`conflict` when another build committed the table after this run
            started, `commit_failed` otherwise) and a human-readable detail.
          additionalProperties:
            type: object
            required: [reason, detail]
            properties:
              reason:
                type: string
                enum: [conflict, commit_failed]
              detail:
                type: string

    BuildFailureResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version, error]
      properties:
        status:
          type: string
          enum: [failed]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        composition:
          description: BuildSpec.composition이 없으면 null (#506).
          oneOf:
            - $ref: "#/components/schemas/CompositionOutcome"
            - type: "null"
        manifest:
          type: string
          description: partial 정책으로 남은 manifest.json의 경로
        api_version:
          type: string
        error:
          type: string
          description: >-
            첫 번째 실패 outcome의 error에서 파생된 human-readable 요약
            (#226). 모든 source가 성공하고 composition만 실패한 경우
            composition.error에서 파생된다 (#506).

    ArtifactsResponse:
      type: object
      required: [run_id, files]
      properties:
        run_id:
          type: string
        files:
          type: array
          items:
            type: string
            description: run 디렉터리 기준 상대 파일 경로

    BuildManifest:
      type: object
      required: [build_id, started_at, finished_at, schema_version]
      additionalProperties: true
      properties:
        reproducibility:
          type: object
          description: >-
            Present only when a source resumed a `param_grid` fetch from a checkpoint
            (#648): `reproducible: false`, `reason: resumed_from_checkpoint`, and per
            source how many combinations came from the checkpoint. Its records came from
            two fetches at two times, so an R1 rebuild comparison leaves the run out.
          properties:
            reproducible: {type: boolean, const: false}
            reason: {type: string, enum: [resumed_from_checkpoint]}
            resumed_sources:
              type: object
              additionalProperties:
                type: object
                properties:
                  resumed_combinations: {type: integer, minimum: 1}
                  total_combinations: {type: integer, minimum: 1}
        pii_masking:
          type: object
          description: >-
            Present only when a Gold holds a declared PII column, or kpubdata declares
            one the source lacks (#689, #902): Gold directory (source key or
            composition name) -> the mask `token`, the `masked` columns and the
            `unmasked` ones (`gold.publish_unmasked`, also listed in `warnings`), each
            with `declared_by` (`kpubdata_spec`, `build_spec`); each masked column
            says whether text cells hold the token (`masked_as: token`) or, for a
            non-text dtype, the column became null (`masked_as: null`), so Gold keeps
            Silver's schema. `declared_absent` lists kpubdata-declared fields, as
            kpubdata spells them, that the source does not carry.
          additionalProperties:
            type: object
            properties:
              token: {type: string}
              masked:
                type: array
                items:
                  type: object
                  properties:
                    column: {type: string}
                    declared_by:
                      type: array
                      items: {type: string, enum: [kpubdata_spec, build_spec]}
                    masked_as: {type: string, enum: [token, "null"]}
              unmasked:
                type: array
                items:
                  type: object
                  properties:
                    column: {type: string}
                    declared_by:
                      type: array
                      items: {type: string, enum: [kpubdata_spec, build_spec]}
              declared_absent:
                type: array
                items: {type: string}
        gold_selection:
          type: object
          description: >-
            Present only when a source declares `gold` (#659): source key -> Silver rows
            in (`input_rows`), Gold rows out (`output_rows`), `dropped_rows`, and the
            `select`/`filters` applied. `row_counts` stays Silver's.
          additionalProperties:
            type: object
            properties:
              input_rows: {type: integer, minimum: 0}
              output_rows: {type: integer, minimum: 0}
              dropped_rows: {type: integer, minimum: 0}
              select:
                type: array
                items: {type: string}
              filters:
                type: array
                items:
                  $ref: "#/components/schemas/JsonValue"
        build_id:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        schema_version:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
          description: >-
            run의 종단 상태 (#481, additive). `ok`/`failed`는 기존에 `errors`
            유무로 파생하던 값과 동일하고, `cancelled`는 협력적 취소로 종료된
            run이다. legacy manifest에는 이 필드가 없다 — reader는 부재 시
            기존대로 `errors` 유무에서 파생해야 한다. 취소된 run도 이미 실패한
            source의 사유를 `errors`에 그대로 보존한다(취소가 실패를 삼키지
            않는다).
        partial:
          type: boolean
          description: >-
            이 run이 정상 완료 전에 종료되어 `outputs`가 부분 산출물임을 뜻한다
            (#481, additive). 현재는 `status: cancelled`인 run에만 `true`이며,
            취소 시점까지 실제로 기록된 산출물만 담긴다 — 실행되지 않은 stage는
            성공으로 기록되지 않는다. 부분 산출물은 기본적으로 삭제하지
            않는다(감사/디버깅 목적 보존).
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        row_counts:
          type: object
          additionalProperties:
            type: integer
        provenance:
          type: array
          description: >-
            Per source fetch: when, with which parameters, how many rows, and — from
            1.42.0 — what the provider reported and whether the fetch collected it
            (#816). `row_counts` is the Gold (snapshot) count, which filtering and
            deduplication can make smaller than `fetched_row_count`.
          items:
            $ref: "#/components/schemas/SourceProvenance"
        inputs_fingerprint:
          type: [string, "null"]
        inputs_fingerprint_algorithm:
          type: string
          description: >-
            What made `inputs_fingerprint` (#867): `sources-sha256-v2`, which names each
            source checksum's algorithm. Absent in older manifests: `sources-sha256-v1`.
        split_algorithm:
          type: string
          description: >-
            What made the Gold ratio splits (#871): `hash-sort-v2` — rows ordered by
            `md5("<seed>:<row ordinal>")`, then the ordinal, and cut into exact counts.
            Present only when the spec declares a ratio split. Absent in older manifests
            that have ratio splits: `shuffle-v1`, whose membership differs for the same seed.
        artifacts:
          type: object
          description: >-
            Per Gold directory — source key or composition name — the digest of its
            files' bytes and the engine that wrote them (#867). Bytes, not data: the same
            records written differently change `artifact_digest` and not
            `provenance[].data_checksum`.
          additionalProperties:
            type: object
            required: [artifact_digest, artifact_writer]
            properties:
              artifact_digest: {type: string}
              artifact_writer:
                type: object
                required: [name, version]
                properties:
                  name: {type: string}
                  version: {type: string}
        created_by:
          type: [string, "null"]
          description: >-
            빌드를 요청한 principal의 display/legacy 라벨(#388). 사람이 읽는
            표시용이며, ownership 판정에는 owner_id가 없는 legacy run에 한해
            하위 호환 폴백으로만 쓰인다.
        quality_results:
          type: object
          description: >-
            source_key → QualityCheckResult 목록 (#486, additive). legacy
            manifest는 이 필드가 없다 — 부재를 "미평가"로 해석해야 하며
            "전부 PASS"로 해석하면 안 된다.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록 (#486, additive).
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"
        composition:
          description: >-
            BuildSpec.composition으로 두 source를 join한 결과의 출처 추적
            정보(#506, additive). composition이 없거나 실행되지 않았으면
            null이다 — legacy manifest reader는 부재와 null을 모두
            "composition 미사용 run"으로 해석해야 한다.
          oneOf:
            - $ref: "#/components/schemas/CompositionProvenance"
            - type: "null"

    CompositionProvenance:
      type: object
      description: composition(join) 실행 결과의 상세 출처 정보 (#506).
      required:
        - name
        - left
        - right
        - join_type
        - left_key
        - right_key
        - left_row_count
        - left_distinct_key_count
        - right_row_count
        - right_distinct_key_count
        - output_row_count
        - duplicate_key_warning
      properties:
        name:
          type: string
        left:
          type: string
        right:
          type: string
        join_type:
          type: string
          enum: [inner, left]
        left_key:
          type: string
        right_key:
          type: string
        left_row_count:
          type: integer
        left_distinct_key_count:
          type: integer
          description: 왼쪽 join key의 distinct 값 수 (null 제외)
        right_row_count:
          type: integer
        right_distinct_key_count:
          type: integer
          description: 오른쪽 join key의 distinct 값 수 (null 제외)
        output_row_count:
          type: integer
        duplicate_key_warning:
          type: boolean
          description: >-
            Whether some key present on both sides repeats on both sides, so its
            rows multiplied many-to-many (#698: intersecting keys only). 실제
            처리(경고만/빌드 실패)는 JoinSpec의 on_duplicate_key가 결정한다 — 이
            필드는 감지 여부만 기록한다.
        keys:
          type: array
          description: Every join key column pair (#698). Absent before 1.32.0.
          items:
            $ref: "#/components/schemas/JoinKeyPair"
        cardinality:
          oneOf:
            - type: string
              enum: [one_to_one, one_to_many, many_to_one, many_to_many]
            - type: "null"
          description: Declared JoinSpec.cardinality; null when not declared (#698).
        observed_cardinality:
          oneOf:
            - type: string
              enum: [one_to_one, one_to_many, many_to_one, many_to_many]
            - type: "null"
          description: >-
            Cardinality observed over the keys present on both sides (#698). A
            side is "many" when any intersecting key repeats on it; with no
            intersecting key it is one_to_one.
        left_unmatched_ratio:
          type: [number, "null"]
          description: >-
            Left rows whose key has no match on the right, null-key rows
            included, over left rows; 0.0 for an empty left side (#698).
        right_unmatched_ratio:
          type: [number, "null"]
          description: Same as left_unmatched_ratio for the right side (#698).
        expansion_ratio:
          type: [number, "null"]
          description: Output rows over left rows; null when the left side is empty (#698).
        left_null_key_rows:
          type: [integer, "null"]
          description: Left rows with a null in any key column (#698).
        right_null_key_rows:
          type: [integer, "null"]
          description: Right rows with a null in any key column (#698).

    CompositionOutcome:
      type: object
      description: >-
        composition(join) 실행 결과 (#506). source별 BuildOutcome과 별도로
        노출된다 — bronze/silver/gold stage 개념이 적용되지 않고, "combined
        result"로 명확히 구분되어야 하기 때문이다.
      required: [name, status, error]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, failed, skipped]
          description: >-
            ok(성공) / failed(join 자체 실행 실패: 키 부재·타입 불일치·명시적
            fail 게이트) / skipped(참조한 source가 실패해 join을 시도조차
            못함)
        error:
          type: [string, "null"]

    BuildSpecSnapshotResponse:
      type: object
      required: [run_id, spec, spec_digest]
      additionalProperties: false
      properties:
        run_id:
          type: string
        spec:
          type: string
          description: credential 값이 redaction된 canonical YAML
        spec_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            실제 저장된 redaction 후 canonical buildspec.yaml bytes의 SHA-256.
            credential 값만 다른 spec은 같은 digest가 될 수 있다.

    BuildSummary:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          description: 빌드 실행 식별자
        status:
          type: string
          enum: [ok, failed, cancelled]
          description: >-
            빌드 상태. `cancelled`(#481)는 협력적 취소로 종료된 run이며 부분
            산출물과 partial manifest가 함께 남는다 — 성공한 빌드로 취급하면
            안 된다.
        started_at:
          type: [string, "null"]
          description: 빌드 시작 시각 (ISO 8601 또는 null)
        finished_at:
          type: [string, "null"]
          description: 빌드 완료 시각 (ISO 8601 또는 null)
        dataset_id:
          type: [string, "null"]
          description: >-
            The dataset the run built, from its BuildSpec snapshot (#844); null when that
            cannot be read.
        dataset_title:
          type: [string, "null"]
          description: The BuildSpec's title; null when it cannot be read.
        snapshot_id:
          type: [string, "null"]
          description: >-
            The warehouse snapshot the run committed, when it committed exactly one;
            null when it committed none (no warehouse, a failed commit, or reclaimed
            since) or several — see `snapshots`.
        snapshots:
          type: array
          description: Every snapshot the run committed that still exists, by table.
          items:
            type: object
            additionalProperties: false
            required: [logical_name, snapshot_id]
            properties:
              logical_name: {type: string}
              snapshot_id: {type: string}

    BuildJob:
      type: object
      required: [run_id, status, created_at, updated_at]
      description: >-
        비동기 build job 스냅샷 (#482, #480). 프로세스 메모리 상주 registry
        기반이라 서버 재시작 후 active/terminal 잡은 더 이상 조회되지 않는다.
        `response`는 잡이 만든 응답 본문이다 — 성공한 잡은 최종 build 응답,
        실패한 잡은 오류 본문일 수 있다(빌드 본문이 생기기 전에 실패하면
        `{"error": ...}` 뿐이다, #921). 형태는 `object | null` 만 보장하며, 실패
        판정과 사유는 `status`와 `error`가 기준이다. internal `owner_id` 필드는
        wire로 노출되지 않는다.
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled]
          description: >-
            `POST /builds/{run_id}/cancel`(#481)이 `queued` job을 곧바로
            `cancelled`로, `running` job을 `cancelling`으로 전이시키고,
            `cancelling` job은 다음 안전한 stage 경계에서 `cancelled`가 된다.
            `succeeded`/`failed`/`cancelled`는 종단 상태이며 다시
            `running`/`cancelling`으로 돌아가지 않는다.
        created_at:
          type: string
          description: job 접수 시각 (ISO 8601)
        updated_at:
          type: string
          description: 마지막 상태 전이 시각 (ISO 8601)
        created_by:
          type: [string, "null"]
          description: 제출 principal의 display/legacy label (선택)
        response:
          type: [object, "null"]
          description: >-
            잡이 만든 응답 본문. 성공 시 최종 build 응답, 실패 시 오류 본문이거나
            null (#921). `object | null` 외의 형태는 보장하지 않는다 — 실패
            사유는 `error`를 읽는다.
        error:
          type: [string, "null"]
          description: 실패 사유 (실패 시에만)

    BuildsResponse:
      type: object
      required: [builds]
      properties:
        builds:
          type: array
          items:
            $ref: "#/components/schemas/BuildSummary"

    # ---------------------------------------------------------------------
    # Dataset Catalog / Stage Summary API (#488)
    # ---------------------------------------------------------------------

    DatasetSourceRef:
      type: object
      description: dataset의 canonical snapshot에 선언된 소스 참조 (secret 없음)
      required: [provider, dataset, alias]
      properties:
        provider:
          type: string
        dataset:
          type: string
        alias:
          type: string

    BuildEventName:
      type: string
      description: >-
        structured run event의 bounded vocabulary (#496). run_submitted은
        실제 async job submission이 있는 `POST /builds`(비동기)에서만 발생하며
        동기 `POST /build`에는 없다. run_cancelled(#481)도 async 전용이며 job이
        실제로 terminal `cancelled`로 확정되는 순간 run당 정확히 한 번만
        발생한다 — 같은 run에 run_finished/run_failed와 함께 나타나지 않는다.
        과도기 상태(`cancelling`)는 job status로만 노출되고 별도 event는 없다.
      enum:
        - run_submitted
        - run_started
        - run_finished
        - run_failed
        - run_cancelled
        - source_fetch_started
        - source_fetch_progress
        - source_fetch_completed
        - source_fetch_failed
        - stage_started
        - stage_completed
        - stage_failed
        - quality_evaluated

    BuildEventStatus:
      type: string
      description: >-
        event의 결과. ok(성공/정상 완료), warn(quality_evaluated에서 FAIL 없이
        WARN이 하나 이상), fail(실패).
      enum: [ok, warn, fail]

    BuildEventStageName:
      type: string
      description: 관련 medallion stage. export는 BuildSpec.exports 실행 단계다.
      enum: [bronze, silver, gold, export]

    BuildEvent:
      type: object
      description: >-
        단일 structured run event(#496). arbitrary object dump, exception
        객체, stack trace, raw provider response, raw path, credential은
        담기지 않는다 — message/metrics는 항상 bounded하고 안전하다.
      required: [seq, timestamp, run_id, event, status, source_key, stage, message, metrics]
      properties:
        seq:
          type: integer
          description: >-
            store가 append 시점에 부여하는 monotonic ordering identifier.
            병렬 source worker의 실제 append 순서를 그대로 보존하며, 존재하지
            않는 causal ordering을 지어내지 않는다.
        timestamp:
          type: string
          format: date-time
          description: timezone-aware UTC 시각.
        run_id:
          type: string
        event:
          $ref: "#/components/schemas/BuildEventName"
        status:
          $ref: "#/components/schemas/BuildEventStatus"
        source_key:
          type: [string, "null"]
          description: 관련 소스 식별자. run 수준 event는 null.
        stage:
          oneOf:
            - $ref: "#/components/schemas/BuildEventStageName"
            - type: "null"
          description: 관련 medallion stage. source fetch/run 수준 event는 null.
        message:
          type: [string, "null"]
          description: 사람이 읽는 bounded, 안전한 요약. 없으면 null.
        metrics:
          type: [object, "null"]
          description: >-
            JSON 직렬화 가능한 안전한 수치 요약(예: records/row_count/
            check_count). 원본 provider 응답이나 임의 object는 담지 않는다.
          additionalProperties: true

    BuildEventsResponse:
      type: object
      description: run identity와 chronological ascending으로 정렬된 event 목록.
      required: [run_id, events]
      properties:
        run_id:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/BuildEvent"

    StageStatusValue:
      type: string
      description: >-
        completed(완전한 산출물 존재) / failed(manifest에 실패로 기록됨) /
        not_run(상위 단계가 끝나지 못해 시도되지 않음) / unavailable(디렉터리는
        있지만 불완전·손상됨, legacy 형식 등)
      enum: [completed, failed, not_run, unavailable]

    PublishTarget:
      type: string
      description: >-
        HTTP publish API가 노출하는 target(#491). Local은 안전한 publish-root
        계약이 없고, Kaggle은 정상 pipeline packaging의 metadata.id가 publish
        destination과 정합하지 않아 이번 HTTP 계약에서 제외한다.
      enum: [huggingface]

    DatasetCard:
      type: object
      description: >-
        A Gold output's dataset card as data — `gold/<source>/card.json`, beside the
        `README.md` that shows the same sections as sentences (#694, #955;
        `stages.gold.card.card_sections`). Publish readiness reads it: an empty required
        section is `card_incomplete`, a missing file `card_missing`. Read the structured
        fields (`license_mismatch`, `processing_declared`) rather than matching the
        sentences, whose wording may change. A card written before v1.75.0 lacks
        `processing_declared` and the provenance entries' `license_declared`,
        `license_provider` and `license_mismatch`.
      required: [card_version, title, provenance, processing, personal_information]
      additionalProperties: false
      properties:
        card_version:
          type: integer
          description: Format of this file; 1 since v1.71.0 (the v1.75.0 fields are additive).
        title:
          type: string
          description: The BuildSpec's `title`.
        provenance:
          type: array
          description: >-
            One entry per source the output is built from — two for a composed output
            (the join's left and right).
          items:
            $ref: "#/components/schemas/DatasetCardSource"
        processing:
          type: array
          description: >-
            Each declared transformation, in the order it runs, as a sentence. A source
            with none has the single step `No transformation declared: values are as the
            source gave them.` (`processing_declared: false`). A composed output prefixes
            each source's steps with its key and ends with the join.
          items:
            type: string
        processing_declared:
          type: boolean
          description: >-
            False when no transformation was declared — `processing` then holds only the
            "No transformation declared" sentence; true otherwise (a composed output's
            join counts). Sent from v1.75.0.
        personal_information:
          type: string
          description: >-
            How personal information was handled — what Gold masked or published
            unmasked, and how the `pii` policy scanned — as sentences.
    DatasetCardSource:
      type: object
      description: Where one source's data comes from, as recorded (#694).
      required: [source, institution, url, license, collected_at]
      additionalProperties: false
      properties:
        source:
          type: string
          description: The source's output key.
        institution:
          type: string
          description: >-
            The BuildSpec's `attribution`, or the attribution text the kpubdata catalog
            declares; empty when neither does (publishing then reports `card_incomplete`).
        url:
          type: string
          description: >-
            The catalog's `source_url`, a URL source's endpoint without its query, or
            `uploaded file`; empty when not known.
        license:
          type: string
          description: >-
            The licence as a sentence for the README: the declared licence under its
            original name (with `license_link` in parentheses), followed by `; the
            provider declares: <terms>` when `license_mismatch` is true; the provider's
            terms alone when nothing is declared; empty when neither is known.
        collected_at:
          type: string
          description: When the source was fetched, `YYYY-MM-DD HH:MM UTC`; empty when not recorded.
        license_declared:
          type: [string, "null"]
          description: >-
            The BuildSpec's `license_name` or `license`, as written, with `license_link`
            in parentheses when given; null when none is declared. Sent from v1.75.0.
        license_provider:
          type: [string, "null"]
          description: >-
            The terms the provider declares in the kpubdata catalog (`license_type`);
            null when kpubdata declares none or the source is not a catalog dataset.
            Sent from v1.75.0.
        license_mismatch:
          type: boolean
          description: >-
            True when both `license_declared` and `license_provider` are known and the
            provider's terms do not appear in the declared licence (compared without
            case) — what the `; the provider declares:` sentence says. Sent from v1.75.0.
    PublishIssue:
      type: object
      description: 안정적인 code + 사람이 읽는 message. UI가 문자열 파싱을 하지 않아도 된다.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            readiness와 publish가 보고하는 blocker 코드. 가능한 값과 각 값이
            나오는 조건은 `x-codes`에 전부 있다(#939) — 실행 상태 `run_not_terminal`,
            `run_failed`, `run_cancelled`; Gold artifact `gold_unavailable`,
            `artifact_missing`, `artifact_invalid`; spec 정책 `license_missing`,
            `pii_allow_with_publish`; credential `credential_unavailable`,
            `credential_required`; local target `local_publish_root_unconfigured`,
            `destination_outside_publish_root`; Kaggle packaging
            `kaggle_metadata_missing`, `kaggle_metadata_ambiguous`,
            `kaggle_metadata_unreadable`, `kaggle_destination_mismatch`; 소스
            재배포 조건 `redistribution_forbidden`, `redistribution_unknown`,
            `non_commercial_unconfirmed`, `non_commercial_marker_missing`;
            목적지 공개 여부(POST만) `destination_public`,
            `destination_visibility_unknown`; 데이터셋 카드 `card_missing`,
            `card_incomplete`. 이 목록은 구현의
            `PUBLISH_ISSUE_CODES`와 테스트로 맞춰진다. 예외로, 저장된 BuildSpec이
            현재 검증 규칙을 통과하지 못하면 그 검증 문제 코드(`ValidationProblem.code`,
            예 `source_key_path_collision`)가 그대로 blocker로 나올 수 있다 —
            클라이언트는 모르는 코드를 일반 blocker로 표시해야 한다.
          x-codes:
            run_not_terminal: run이 아직 끝나지 않았다(queued/running/cancelling) (#491)
            run_failed: run이 오류로 끝났다 (#491)
            run_cancelled: run이 취소됐다 (#491)
            gold_unavailable: >-
              성공한 Gold 출력이 없거나, 끝난 run에 manifest가 없다 (#491)
            artifact_missing: manifest.outputs의 Gold artifact가 디스크에 없다 (#491)
            artifact_invalid: >-
              canonical manifest.outputs 항목이 run 작업 공간을 벗어나거나(symlink
              escape 포함) resolve할 수 없다 — fail-closed (#491)
            license_missing: BuildSpec.license가 선언되지 않았다(공백만 있어도 미선언) (#443, #491)
            pii_allow_with_publish: pii.mode가 allow인 spec은 게시할 수 없다 (#441)
            credential_unavailable: 이 target에 쓸 credential이 없다 (#491)
            credential_required: >-
              요청자 자신의 credential이 필요하다 — 단일 사용자 배포에서
              `KPUBDATA_BUILDER_REQUIRE_OWN_PUBLISH_CREDENTIAL=true`일 때 저장된
              credential이 없거나(#635), 다중 사용자 배포에서
              `X-Publish-Credential` 헤더가 없을 때(#925)
            local_publish_root_unconfigured: >-
              `KPUBDATA_BUILDER_LOCAL_PUBLISH_ROOT`가 설정되지 않아 local target을 쓸 수 없다 (#550)
            destination_outside_publish_root: local destination이 publish root를 벗어난다 (#550)
            kaggle_metadata_missing: run에 Kaggle packaging(dataset-metadata.json)이 없다 (#550)
            kaggle_metadata_ambiguous: run에 Kaggle packaging이 둘 이상이다 (#550)
            kaggle_metadata_unreadable: dataset-metadata.json을 읽을 수 없거나 id가 없다 (#550)
            kaggle_destination_mismatch: packaging의 dataset id가 destination과 다르다 (#550)
            redistribution_forbidden: 소스 조건이 재배포를 금지한다 (#688)
            redistribution_unknown: 소스 조건을 알 수 없어 공개 게시할 수 없다 (#688)
            non_commercial_unconfirmed: >-
              비상업 조건인데 `options.confirm_non_commercial: true`가 없다 (#688)
            non_commercial_marker_missing: >-
              비상업 데이터의 공개 게시에 비상업 라이선스 표시(예 cc-by-nc-4.0)가 없다 (#688)
            destination_public: >-
              비공개로만 게시할 수 있는데 목적지가 이미 공개다 — POST에서만 (#688)
            destination_visibility_unknown: >-
              비공개로만 게시할 수 있는데 목적지 공개 여부를 읽을 수 없다 — POST에서만 (#688)
            card_missing: >-
              Gold 출력에 `card.json`이 없다 — 카드 이전에 만든 run이며, 다시 빌드하면 생긴다 (#694)
            card_incomplete: >-
              카드의 필수 절(provenance의 제공 기관·출처 URL·라이선스·수집 일시,
              processing, personal_information)이 비었다. message가 빈 절의 이름을 알려 준다 (#694)
        message:
          type: string

    PublishReadinessResponse:
      type: object
      description: >-
        side-effect-free readiness 판정. `ready`는 항상 `blockers`가 비어
        있는지로 계산된다. `warnings`는 게시 자체를 막지 않는다.
      required: [run_id, target, ready, blockers, warnings]
      additionalProperties: false
      properties:
        run_id:
          type: string
        target:
          $ref: "#/components/schemas/PublishTarget"
        ready:
          type: boolean
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PublishIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PublishIssue"
        redistribution:
          description: >-
            The source terms' verdict on redistribution (#688), evaluated for the
            target's default options; the publish request's options are checked again
            on POST. Null when the run has no manifest yet.
          oneOf:
            - $ref: "#/components/schemas/RedistributionVerdict"
            - type: "null"

    RedistributionVerdict:
      type: object
      description: >-
        Whether a build's data may leave Builder (#688), from each source's declared
        terms. The build's verdict is its most restricted source's: forbidden, then
        unknown, then non_commercial, then allowed.
      required: [verdict, sources]
      additionalProperties: false
      properties:
        verdict:
          type: string
          enum: [allowed, non_commercial, unknown, forbidden]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RedistributionSourceVerdict"

    RedistributionSourceVerdict:
      type: object
      required: [source, verdict, reason]
      additionalProperties: false
      properties:
        source: {type: string}
        verdict:
          type: string
          enum: [allowed, non_commercial, unknown, forbidden]
        reason: {type: string}

    DeclaredPiiWithheldError:
      type: object
      description: >-
        403 for a Bronze or Silver artifact file of a source with declared PII (#900):
        the file holds the original values, so it does not leave Builder. The Gold
        files of the same run hold them masked.
      required: [error, code, columns]
      properties:
        error: {type: string}
        code:
          type: string
          enum: [declared_pii_withheld]
        columns:
          type: array
          description: The declared Silver columns the file holds unmasked. Names only.
          items: {type: string}

    PiiDeclarationUnavailableError:
      type: object
      description: >-
        503 when a public_api source's kpubdata PII declaration cannot be read (#900):
        the read fails closed instead of masking only what the manifest recorded.
      required: [error, code, dataset]
      properties:
        error: {type: string}
        code:
          type: string
          enum: [pii_declaration_unavailable]
        dataset:
          type: string
          description: The `provider.dataset` (or source key) whose declaration was unreadable.

    MaskedColumns:
      type: array
      description: >-
        Declared PII columns this read shows masked as Gold masks them (#900): each
        text value is the mask token, any other dtype null, and nulls stay null.
        Present only when at least one column was masked.
      items: {type: string}

    RedistributionForbiddenError:
      type: object
      description: >-
        403 when the build's source terms forbid redistribution (#688): the data
        does not leave Builder.
      required: [error, code, redistribution]
      properties:
        error: {type: string}
        code:
          type: string
          enum: [redistribution_forbidden]
        redistribution:
          $ref: "#/components/schemas/RedistributionVerdict"

    PublishRequest:
      type: object
      description: >-
        게시 요청. destination은 filesystem path로 해석되지 않고 target별
        canonical identifier("owner/name")만 허용된다. options는 target이
        실제로 지원하는 키만 허용하며(#491), 미지원 키는 조용히 무시되지 않고
        400으로 거부된다.
      required: [target, destination]
      additionalProperties: false
      properties:
        target:
          $ref: "#/components/schemas/PublishTarget"
        destination:
          type: string
          description: "target별 owner/name 형태의 게시 대상 식별자."
        options:
          $ref: "#/components/schemas/PublishHuggingFaceOptions"

    PublishHuggingFaceOptions:
      type: object
      description: >-
        신규 Hugging Face dataset repo 생성 시 visibility. 기존 repo의
        visibility는 변경하지 않는다. 생략 시 안전한 기본값 private=true다.
      additionalProperties: false
      properties:
        private:
          type: boolean
          default: true
        confirm_non_commercial:
          type: boolean
          description: >-
            The publisher's statement that data whose terms allow non-commercial use
            only is published for that use (#688). Required for such data; also
            accepted by the kaggle and local targets.

    PublishResponse:
      type: object
      description: >-
        기존 Publisher(PublishResult, publishers/base.py)의 결과를 그대로
        노출한다. 서버 절대 경로는 담지 않는다 — reference는 안전한 외부
        참조(URL 등)만 담는다.
      required:
        - run_id
        - target
        - publisher
        - destination
        - reference
        - artifact_count
        - status
      additionalProperties: false
      properties:
        run_id:
          type: string
        target:
          $ref: "#/components/schemas/PublishTarget"
        publisher:
          type: string
        destination:
          type: string
        reference:
          type: string
          description: 게시 위치에 대한 안전한 외부 참조(URL 등). 서버 내부 경로가 아니다.
        artifact_count:
          type: integer
          minimum: 0
        status:
          type: string
        redistribution:
          description: >-
            The terms this publish went out under (#688); null when the run has no
            readable spec.
          oneOf:
            - $ref: "#/components/schemas/PublishRedistributionRecord"
            - type: "null"

    PublishRedistributionRecord:
      type: object
      description: >-
        The redistribution verdict this publish was allowed under (#688), recorded
        with the kpubdata release whose catalog it came from and whether the caller
        confirmed non-commercial use. The same record goes into the publish receipt.
      required: [verdict, sources, kpubdata_version, confirm_non_commercial]
      additionalProperties: false
      properties:
        verdict:
          type: string
          enum: [allowed, non_commercial, unknown, forbidden]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RedistributionSourceVerdict"
        kpubdata_version:
          type: [string, "null"]
          description: The installed kpubdata release; null when it cannot be read.
        confirm_non_commercial:
          type: boolean

    PublishBlockedResponse:
      type: object
      description: readiness 재검증에서 blocker가 발견되어 Publisher를 호출하지 않았음.
      required: [error, blockers]
      additionalProperties: false
      properties:
        error:
          type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PublishIssue"
        redistribution:
          description: >-
            The source terms' verdict for this request (#688). Blockers from it use
            the codes redistribution_forbidden, redistribution_unknown,
            non_commercial_unconfirmed, non_commercial_marker_missing,
            destination_public (a private-only publish to an existing public
            destination) and destination_visibility_unknown (the destination's
            visibility could not be read). Null when the run has no spec.
          oneOf:
            - $ref: "#/components/schemas/RedistributionVerdict"
            - type: "null"

    DatasetStageMap:
      type: object
      description: source_key → {bronze, silver, gold} 상태 맵
      additionalProperties:
        type: object
        required: [bronze, silver, gold]
        properties:
          bronze:
            $ref: "#/components/schemas/StageStatusValue"
          silver:
            $ref: "#/components/schemas/StageStatusValue"
          gold:
            $ref: "#/components/schemas/StageStatusValue"

    DatasetSummary:
      type: object
      description: >-
        동일 dataset_id를 공유하는 여러 run을 접근 가능한 latest run 기준으로
        묶은 built dataset 요약. quality는 #486의 구조화된 품질 게이트가
        선반영되지 않았으므로 항상 null이다(N/A) — 미평가를 PASS로 표시하지 않는다.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
          description: latest run의 finished_at(없으면 started_at)
        row_counts:
          type: object
          description: >-
            source_key별 Silver row_count. multi-source dataset을 단일 값으로
            축약하지 않는다.
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
          description: row_counts 값의 합계
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
          description: "#486 선반영 안 함 — 구조화된 quality 결과가 없으므로 항상 null"
        status_axes:
          $ref: "#/components/schemas/DatasetStatusAxes"

    DatasetStatusAxes:
      type: object
      description: >-
        The table's state on each axis kpubdata's TERMINOLOGY keeps apart (#781) —
        one field per axis, never merged into one badge. An axis with nothing to go on
        is `unknown`, not a guess. health comes from the spec's declared
        `refresh_cadence` (#781); access and maturity are always `unknown` for now:
        access needs kpubdata's probe results and maturity the source spec's grade.
      required: [refresh, completeness, health, access, maturity]
      properties:
        refresh:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, unknown]
          description: >-
            A queued or running async refresh this principal may see wins over the last
            finished run's result.
        completeness:
          type: string
          enum: [complete, partial, unknown]
          description: >-
            From the latest run's manifest — partial when marked partial or failed after
            writing rows, complete when it succeeded.
        health:
          type: string
          enum: [healthy, stale, degraded, unknown]
          description: >-
            `stale` when the last successful refresh is older than the spec's
            `refresh_cadence`, `healthy` when it is not, `unknown` without a declared
            cadence or without any successful refresh (#781). `degraded` is not produced
            yet.
        access:
          type: string
          enum:
            - available
            - auth_unknown
            - application_required
            - params_invalid
            - rate_limited
            - temporarily_unavailable
            - network_error
            - insufficient_metadata
            - retired
            - unknown
          description: >-
            Builder owns this vocabulary (`AccessStatus`, #831). The values currently
            mirror kpubdata's probe classification, plus `unknown`; Builder maps each
            probe status explicitly, and one it has not mapped is sent as `unknown`,
            never as kpubdata's raw value.
        maturity:
          type: string
          enum: [stable, beta, experimental, unknown]

    DatasetDetailResponse:
      type: object
      description: DatasetSummary와 동일한 필드에 run_count가 추가된 단일 dataset 상세 응답.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
        - run_count
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
        row_counts:
          type: object
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
        status_axes:
          $ref: "#/components/schemas/DatasetStatusAxes"
        run_count:
          type: integer
          description: 이 principal에게 접근 가능한 이 dataset_id의 run 총 개수

    DatasetsResponse:
      type: object
      required: [datasets, total]
      properties:
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"
        total:
          type: integer
          minimum: 0
          description: >-
            canonical dataset grouping과 ownership/visibility 필터를 적용한 뒤,
            pagination(limit)을 적용하기 전의 접근 가능한 distinct dataset_id
            개수(#488 후속, additive). limit이 무한이면 `datasets` 길이와 같다.
            `datasets` 길이·요청한 limit·기본 page 크기를 total로 사용하지 않는다.
            다른 principal 소유 run만 있는 dataset은 포함되지 않는다.

    DatasetRunSummary:
      type: object
      required: [run_id, status, started_at, finished_at, spec_digest, created_by]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        started_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]
        spec_digest:
          type: [string, "null"]
        created_by:
          type: [string, "null"]

    DatasetRunsResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRunSummary"

    DatasetRunResponse:
      type: object
      additionalProperties: false
      required: [dataset_id, run]
      properties:
        dataset_id:
          type: string
        run:
          $ref: "#/components/schemas/DatasetRunSummary"

    StageState:
      type: object
      required: [status, available]
      properties:
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
          description: "status == completed 의 편의 boolean"

    RunStageEntry:
      type: object
      required: [source_key, bronze, silver, gold]
      properties:
        source_key:
          type: string
        bronze:
          $ref: "#/components/schemas/StageState"
        silver:
          $ref: "#/components/schemas/StageState"
        gold:
          $ref: "#/components/schemas/StageState"

    RunStagesResponse:
      type: object
      required: [run_id, sources]
      properties:
        run_id:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RunStageEntry"

    StageDetailResponse:
      description: >-
        실제 stage 값에 따라 Bronze/Silver/Gold 상세 응답 중 하나를 반환한다.
        모든 분기는 runtime wire response의 필드를 명시하며 raw fetch_params,
        export options, credential, 절대 filesystem 경로를 노출하지 않는다.
      required: [run_id, stage, source_key, status, available]
      oneOf:
        - $ref: "#/components/schemas/BronzeStageDetailResponse"
        - $ref: "#/components/schemas/SilverStageDetailResponse"
        - $ref: "#/components/schemas/GoldStageDetailResponse"

    BronzeStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - provider
        - dataset
        - fetched_at
        - record_count
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [bronze]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        provider:
          type: [string, "null"]
        dataset:
          type: [string, "null"]
        fetched_at:
          type: [string, "null"]
        record_count:
          type: [integer, "null"]

    SilverColumnInfo:
      type: object
      additionalProperties: false
      required: [name, dtype, nullable, unique_count]
      properties:
        name:
          type: string
        dtype:
          type: string
        nullable:
          type: boolean
        unique_count:
          type: integer
        logical_type:
          type: string
          description: Absent for runs written before 1.30.0 (#735).
        wire_encoding:
          $ref: "#/components/schemas/WireEncoding"
        semantic:
          $ref: "#/components/schemas/ColumnSemanticHint"
        display:
          $ref: "#/components/schemas/ColumnDisplayHint"
        unit:
          $ref: "#/components/schemas/ColumnUnitHint"

    SilverValidationProblem:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
        field:
          type: [string, "null"]
        message:
          type: string

    SilverValidationResult:
      type: object
      additionalProperties: false
      required: [ok, problems]
      properties:
        ok:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/SilverValidationProblem"

    SilverStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - schema
        - statistics
        - validation
        - sample
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [silver]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        schema:
          type: array
          items:
            $ref: "#/components/schemas/SilverColumnInfo"
        statistics:
          oneOf:
            - $ref: "#/components/schemas/TableStatistics"
            - type: "null"
        validation:
          oneOf:
            - $ref: "#/components/schemas/SilverValidationResult"
            - type: "null"
        masked_columns:
          allOf:
            - $ref: "#/components/schemas/MaskedColumns"
          description: The declared PII columns masked in `sample` (#900).
        sample_withheld:
          type: string
          enum: [redistribution_forbidden, pii_declaration_unavailable]
          description: >-
            Present when the sample was withheld; ``sample`` is then empty.
            ``redistribution_forbidden``: the source terms forbid redistribution
            (#688). ``pii_declaration_unavailable``: the source's kpubdata PII
            declaration could not be read, so which columns to mask is not known
            (#900).
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"

    GoldExportSummary:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string

    GoldStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - columns
        - splits
        - exports
        - sample
        - sample_available
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [gold]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        columns:
          type: array
          items:
            type: string
        splits:
          oneOf:
            - type: object
              additionalProperties:
                type: integer
            - type: "null"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/GoldExportSummary"
        sample:
          type: "null"
        sample_available:
          type: boolean
          enum: [false]

    # ---------------------------------------------------------------------
    # Monitoring API (#516)
    # ---------------------------------------------------------------------

    MonitoringApiStatus:
      type: object
      description: >-
        Builder API 요청 처리 latency 상태. availability=available은 latency
        collector(ring buffer)가 정상적으로 표본을 읽어낼 수 있었다는 뜻이며,
        collector 자체가 손상되어 표본을 읽을 수 없으면(#527) unavailable +
        sample_count=null + p95_latency_ms=null이다 — "정상 무표본"
        (available + sample_count=0 + p95_latency_ms=null)과 "측정 불가"를
        같은 값으로 뭉개지 않는다. 이 subsystem 실패는 원 요청이나 이
        monitoring 응답 자체를 실패시키지 않는다. Healthy/Degraded 같은
        latency 임계값 판정은 근거(ADR/config)가 없어 이번 버전에서 발명하지
        않는다 — raw sample_count/p95_latency_ms만 제공한다.
      required: [availability, sample_count, p95_latency_ms]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        sample_count:
          type: [integer, "null"]
          minimum: 0
          description: >-
            최근 최대 1000개 요청 ring buffer에 현재 보관된 표본 수.
            availability가 unavailable이면(collector 실패) null.
        p95_latency_ms:
          type: [number, "null"]
          description: >-
            sample_count가 0이거나 availability가 unavailable이면 null.
            nearest-rank 방식(보간 없음)으로 계산.

    MonitoringQueueStatus:
      type: object
      description: >-
        Async build queue 상태(#516). AsyncBuildExecutor/AsyncBuildJobRegistry
        (#511/#513)의 read-only snapshot을 반영하며, 이 서비스는 항상
        AsyncBuildExecutor를 생성하므로 정상 runtime에서는 항상
        availability: available이다. waiting/running=0은 "대기/실행 중인 job이
        실제로 없다"는 뜻이며, availability가 unavailable일 때만(예: async
        build를 지원하지 않는 구성) 나머지 필드가 null이다 — "0건"과 "확인
        불가"를 구분한다. total = waiting + running이며 terminal
        (succeeded/failed/cancelled) job 이력은 포함하지 않는다.
      required: [availability, waiting, running, total]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        waiting:
          type: [integer, "null"]
          description: status=queued인 active job 수. unavailable이면 null.
        running:
          type: [integer, "null"]
          description: status=running인 active job 수. unavailable이면 null.
        total:
          type: [integer, "null"]
          description: waiting + running. unavailable이면 null.

    MonitoringWorkerStatus:
      type: object
      description: >-
        Async build worker pool 상태(#516). 근거는 MonitoringQueueStatus와
        동일 — AsyncBuildExecutor가 항상 생성되므로 정상 runtime에서는 항상
        availability: available이다. utilization은 0.0~1.0 ratio다(퍼센트
        아님). unavailable일 때만 나머지 필드가 null이다.
      required: [availability, active, capacity, utilization]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        active:
          type: [integer, "null"]
          description: 현재 running job 수. unavailable이면 null.
        capacity:
          type: [integer, "null"]
          description: >-
            AsyncBuildExecutor 생성 시 지정한 max_workers. unavailable이면
            null.
        utilization:
          type: [number, "null"]
          description: >-
            active / capacity ratio, 0.0~1.0. capacity가 0보다 클 때만 계산되며
            unavailable이면 null(0.0으로 위장하지 않는다).

    MonitoringArtifactStatus:
      type: object
      description: >-
        Artifact Store 상태. output_root 폴더가 존재한다는 사실만으로
        available로 간주하지 않는다 — BuildIndex 쿼리도 성공해야 available이다.
        절대 파일시스템 경로는 노출하지 않는다.
      required: [availability, last_write_at]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        last_write_at:
          type: [string, "null"]
          format: date-time
          description: >-
            BuildIndex에 기록된 가장 최근 성공(ok) 빌드의 완료 시각. 성공 기록이
            없으면 available이되 null(0건과 확인 불가를 구분).

    MonitoringSummaryResponse:
      type: object
      description: >-
        Studio Monitoring 화면용 시스템 상태 요약 (#516). Provider 상태는
        요청마다 네트워크 프로브를 유발하므로(#492) 이번 버전에서는 포함하지
        않는다.
      required: [generated_at, status, api, queue, workers, artifact_store]
      additionalProperties: false
      properties:
        generated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [healthy, degraded]
          description: >-
            required subsystem(api/queue/workers/artifact_store) availability로부터
            계산되는 deterministic aggregate status. 넷 모두 available이면
            healthy, 하나라도 partial/unavailable이면 degraded. latency
            threshold(SLA)는 사용하지 않으며 sample_count=0/p95_latency_ms=null
            자체는 degraded 근거가 아니다. Provider status(#492, optional)는
            이 판정에 포함되지 않는다.
        api:
          $ref: "#/components/schemas/MonitoringApiStatus"
        queue:
          $ref: "#/components/schemas/MonitoringQueueStatus"
        workers:
          $ref: "#/components/schemas/MonitoringWorkerStatus"
        artifact_store:
          $ref: "#/components/schemas/MonitoringArtifactStatus"

    MonitoringBuildBucket:
      type: object
      description: >-
        [bucket_start, bucket_end) 반열린 구간의 build 카운트 (UTC). success는
        내부 BuildIndex status "ok"를 외부 wire 명명으로 매핑한 값이다(#527) —
        내부 BuildIndex status vocabulary(ok/failed/cancelled) 자체는 바뀌지
        않는다.
      required: [bucket_start, bucket_end, total, success, failed, cancelled]
      additionalProperties: false
      properties:
        bucket_start:
          type: string
          format: date-time
        bucket_end:
          type: string
          format: date-time
        total:
          type: integer
          minimum: 0
        success:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0

    MonitoringRecentRun:
      type: object
      description: Monitoring 화면용 최소 run 요약. dataset_id/owner_id/error 등은 노출하지 않는다.
      required: [run_id, status, started_at, finished_at]
      additionalProperties: false
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        started_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]

    MonitoringBuildsResponse:
      type: object
      description: >-
        window/bucket별 build 통계(#516). timezone은 UTC. bucket 기준
        timestamp는 finished_at. excluded_count는 malformed timestamp로 집계에서
        제외된 행 수이며, 0보다 크면 availability는 partial이다.
      required: [window, bucket, availability, excluded_count, buckets, recent_runs]
      additionalProperties: false
      properties:
        window:
          type: string
          enum: [24h]
        bucket:
          type: string
          enum: [hour]
        availability:
          type: string
          enum: [available, partial, unavailable]
          description: >-
            available: 집계 성공(0건이어도 유효). partial: BuildIndex 쿼리는
            성공했지만 malformed timestamp로 일부 행이 제외됨. unavailable:
            BuildIndex 쿼리 자체가 실패함(buckets는 빈 배열).
        excluded_count:
          type: integer
          minimum: 0
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringBuildBucket"
        recent_runs:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringRecentRun"
    WarehouseExportRequest:
      type: object
      additionalProperties: false
      required: [table, sql]
      properties:
        table:
          type: string
          description: A table's logical name in the caller's workspace.
        snapshot:
          type: string
          default: current
          description: "`current`, or a `snapshot_id` returned by an earlier read to export that snapshot."
        sql:
          type: string
          maxLength: 65536
          description: One read-only query over `dataset`, as for `POST /warehouse/query`. Its own LIMIT is kept.
        format:
          type: string
          enum: [csv, jsonl]
          default: csv
        profile:
          type: string
          enum: [machine, spreadsheet]
          default: machine
          description: >-
            `machine` — values exactly as sent on the wire, UTF-8 without a BOM, nothing
            altered. `spreadsheet` (csv only) — UTF-8 with a BOM, and text cells starting
            with a formula trigger prefixed with an apostrophe, counted in
            `manifest.output.values_altered`.
        max_rows:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
          description: A result with more rows is refused (422 `row_limit_exceeded`), not cut.
    WarehouseExport:
      type: object
      additionalProperties: false
      required: [export_id, status, created_at, expires_at, request, manifest, bundle, download_path]
      properties:
        export_id: {type: string}
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, expired]
          description: >-
            `completed` or `expired` today: an export runs synchronously and is kept only
            when complete. `queued`, `running`, `failed` and `cancelled` are reserved for
            queued exports.
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        request:
          type: object
          additionalProperties: false
          required: [table, snapshot, sql, format, profile, max_rows]
          description: The request as it was made; `snapshot` may be `current`.
          properties:
            table: {type: string}
            snapshot: {type: string}
            sql: {type: string}
            format: {type: string, enum: [csv, jsonl]}
            profile: {type: string, enum: [machine, spreadsheet]}
            max_rows: {type: integer, minimum: 1}
        manifest:
          $ref: "#/components/schemas/WarehouseExportManifest"
        bundle:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [filename, media_type, bytes, sha256, files]
              properties:
                filename: {type: string}
                media_type: {type: string}
                bytes: {type: integer, minimum: 0}
                sha256: {type: string}
                files:
                  type: array
                  items: {type: string}
          description: The zip bundle; null once expired.
        download_path:
          type: [string, "null"]
          description: Where to GET the bundle; null once expired.
    WarehouseExportManifest:
      type: object
      additionalProperties: false
      description: >-
        What the export holds and under which terms. The same object is `manifest.json`
        in the bundle.
      required: [manifest_version, export_id, created_at, expires_at, query, snapshot, source, output, pii]
      properties:
        manifest_version: {type: integer, const: 1}
        export_id: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        query:
          type: object
          additionalProperties: false
          required: [sql, user_derived]
          properties:
            sql: {type: string}
            user_derived:
              type: boolean
              description: >-
                Always true for a query export: Builder cannot tell a query that does not
                reshape, filter or compute from one that does.
        snapshot:
          type: object
          additionalProperties: false
          required: [table_id, logical_name, snapshot_id, revision, run_id, artifact_digest, row_count, coverage]
          description: The concrete snapshot read — never `current` — with its table revision and artifact digest.
          properties:
            table_id: {type: string}
            logical_name: {type: string}
            snapshot_id: {type: string}
            revision: {type: integer, minimum: 0}
            run_id: {type: string}
            artifact_digest: {type: string}
            row_count: {type: [integer, "null"], minimum: 0}
            coverage:
              description: The snapshot's fetch coverage (#816), or null when not recorded (unknown, not complete).
              type: [object, "null"]
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
        source:
          type: object
          additionalProperties: false
          required: [dataset_id, terms, provenance]
          properties:
            dataset_id: {type: [string, "null"]}
            terms:
              type: object
              additionalProperties: false
              required: [status, license, license_name, license_link, attribution]
              description: Copied verbatim from the build spec; never restated as another licence.
              properties:
                status:
                  type: string
                  enum: [declared, undeclared, unknown]
                  description: "`unknown` when the build's spec could not be read."
                license: {type: [string, "null"]}
                license_name: {type: [string, "null"]}
                license_link: {type: [string, "null"]}
                attribution: {type: [string, "null"]}
            provenance:
              type: array
              description: The build manifest's provenance entries for this table's source.
              items:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
        output:
          type: object
          additionalProperties: false
          required: [format, profile, encoding, bom, row_count, completeness, columns, values_altered, file]
          properties:
            format: {type: string, enum: [csv, jsonl]}
            profile: {type: string, enum: [machine, spreadsheet]}
            encoding: {type: string}
            bom: {type: boolean}
            row_count: {type: integer, minimum: 0}
            completeness:
              type: string
              enum: [full]
              description: An export is only ever kept complete; a result over a limit is refused.
            columns:
              type: array
              items:
                $ref: "#/components/schemas/ColumnWireInfo"
            values_altered:
              type: array
              description: Cells the spreadsheet profile changed, per column. Empty for `machine`.
              items:
                type: object
                additionalProperties: false
                required: [column, count, reason]
                properties:
                  column: {type: string}
                  count: {type: integer, minimum: 1}
                  reason: {type: string, enum: [formula_prefix]}
            file:
              type: object
              additionalProperties: false
              required: [name, bytes, sha256]
              properties:
                name: {type: string}
                bytes: {type: integer, minimum: 0}
                sha256: {type: string}
        pii:
          type: object
          additionalProperties: false
          required: [policy, allowed_findings]
          properties:
            policy:
              type: [string, "null"]
              description: The source spec's PII mode, or null when it declared none.
            allowed_findings:
              type: array
              description: PII-pattern findings the policy let out (column, kind, count; never a value).
              items:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
    WarehouseExportList:
      type: object
      additionalProperties: false
      required: [exports]
      properties:
        exports:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseExport"
    WarehouseExportDeleted:
      type: object
      additionalProperties: false
      required: [export_id, deleted]
      properties:
        export_id: {type: string}
        deleted: {type: boolean, const: true}
