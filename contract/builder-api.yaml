            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /warehouse/tables/{name}/profile:
    get:
      operationId: getWarehouseTableProfile
      summary: Column profile of one snapshot of a warehouse table (#817)
      description: >-
        Computed exactly over every row, under a query's memory cap and concurrency
        slot with its own 60-second timeout, and cached per snapshot id, content digest
        and algorithm version. The snapshot is never modified. Quantiles, histograms,
        distinct counts and top values are not included.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: snapshot
          in: query
          required: false
          description: "`current` (default) or a snapshot id of this table."
          schema: {type: string}
      responses:
        "200":
          description: The pinned snapshot and its column profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotProfileResponse"
        "400":
          description: The name is not one path segment, or profiling failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RedistributionForbidden"
        "404":
          description: >-
            No warehouse, no such table or snapshot in the caller's workspace, or a
            snapshot without a table file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The snapshot cannot be read (`snapshot_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Query capacity is exhausted (`query_busy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: >-
            Profiling timed out (`query_timeout`). The timeout is remembered for this
            snapshot for 5 minutes; until then the same request answers 504 at once,
            without profiling again or taking a query slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

