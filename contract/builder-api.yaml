          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStagesResponse"
              examples:
                CompletedStages:
                  summary: 단일 source의 모든 medallion stage 완료
                  value:
                    run_id: air-quality-20260815
                    sources:
                      - source_key: air
                        bronze:
                          status: completed
                          available: true
                        silver:
                          status: completed
                          available: true
                        gold:
                          status: completed
                          available: true
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/stages/{stage}:
    get:
      operationId: getBuildStageDetail
      summary: >-
        단일 source의 단일 stage(bronze/silver/gold)에 대한 안전한 summary/preview
        조회 (#488). raw fetch_params, export options, credential, 절대 경로는
        어디에도 담기지 않는다. Silver sample은 build 시점에 이미 persist된 상한
        (기본 5행) 안에서만 반환되며 parquet 전체를 읽지 않는다.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Stage"
        - name: source
          in: query
          required: true
          description: 조회할 source_key (run에 알려진 source여야 함)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Silver sample 행 수 상한 (기본값: 5, 다른 stage에서는 무시됨)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 5
      responses:
        "200":
          description: stage summary/preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageDetailResponse"
              examples:
                BronzeDetail:
                  summary: credential과 fetch params가 제거된 Bronze summary
                  value:
                    run_id: air-quality-20260815
                    stage: bronze
                    source_key: air
                    status: completed
                    available: true
                    provider: datago
                    dataset: air_quality
                    fetched_at: "2026-08-15T09:30:02+00:00"
                    record_count: 25
                SilverDetail:
                  summary: persist된 bounded Silver sample
                  value:
                    run_id: air-quality-20260815
                    stage: silver
                    source_key: air
                    status: completed
                    available: true
                    row_count: 25
                    schema:
                      - name: station_name
                        dtype: String
                        nullable: false
                        unique_count: 25
                      - name: pm10_value
                        dtype: Int64
                        nullable: true
                        unique_count: 18
                    statistics:
                      row_count: 25
                      null_counts:
                        station_name: 0
                        pm10_value: 1
                      duplicate_rate: 0.0
                    validation:
                      ok: true
                      problems: []
                    sample:
                      - station_name: 종로구
                        pm10_value: 31
                      - station_name: 중구
                        pm10_value: 28
                GoldDetail:
                  summary: export options와 내부 경로가 없는 Gold summary
                  value:
                    run_id: air-quality-20260815
                    stage: gold
                    source_key: air
                    status: completed
                    available: true
                    row_count: 25
                    columns: [station_name, pm10_value]
                    splits: null
                    exports:
                      - kind: jsonl
                    sample: null
                    sample_available: false
        "400":
          description: >-
            경로 안전하지 않은 run_id/source, 잘못된 stage 이름, source 누락,
            또는 잘못된 limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                MissingSource:
                  summary: 필수 source query parameter 누락
                  value:
                    error: source query parameter is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run이 없거나, source가 이 run에 알려지지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /datasets/{dataset_id}/quality/history:
    get:
      operationId: getDatasetQualityHistory
      summary: >-
        dataset_id의 접근 가능한 run들에 대한 Quality PASS/WARN/FAIL 집계 이력
        (#486). dataset→run 조회는 #488과 동일한 helper를 재사용하며, ownership도
        동일 semantics를 공유한다.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: limit
          in: query
          required: false
          description: "반환할 최대 run 수 (기본값: 30)"
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: run별 quality 집계 이력 (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetQualityHistoryResponse"
              examples:
                AirQualityHistory:
                  summary: 평가 건수와 검증 행 수를 분리한 quality 이력
                  value:
                    dataset_id: seoul-air-quality
                    runs:
                      - run_id: air-quality-20260815
                        timestamp: "2026-08-15T09:30:07+00:00"
                        status: ok
                        pass_count: 2
                        warn_count: 1
                        fail_count: 0
                        evaluated_checks: 3
                        rule_pass_rate: 0.6666666666666666
                        validated_rows: 25
                      - run_id: air-quality-legacy
                        timestamp: null
                        status: ok
                        pass_count: 0
                        warn_count: 0
                        fail_count: 0
                        evaluated_checks: 0
                        rule_pass_rate: null
                        validated_rows: null
        "400":
          description: dataset_id가 비어 있거나 limit이 잘못됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 접근 가능한 run이 없는 dataset_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                DatasetNotFound:
                  summary: quality history가 없는 dataset
                  value:
                    error: "dataset not found: unknown-dataset"

  /builds/{run_id}/quality:
    get:
      operationId: getBuildQuality
      summary: >-
        run의 구조화된 Quality 결과와 schema drift 조회 (#486). manifest에 저장된
        source_key별 QualityCheckResult(PASS 포함)와 SchemaDriftFinding을 그대로
        반환한다 — 로그를 파싱하지 않고 JSON으로 조회 가능하다. `availability`가
        `available`/`partial`/`unavailable`를 구분하므로, 빈 `quality_results`가
        "0건 평가"인지 "애초에 계산된 적 없음"인지 클라이언트가 판별할 수 있다(#514).
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: run의 quality_results/schema_drift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildQualityResponse"
              examples:
                EvaluatedQuality:
                  summary: PASS와 WARN 및 schema drift를 포함한 run quality
                  value:
                    run_id: air-quality-20260815
                    availability: available
                    evaluated_checks: 2
                    quality_results:
                      air:
                        - source_key: air
                          category: row_count
                          rule: min_rows
                          column: null
                          status: pass
                          actual: 25
                          threshold: 10
                          affected_rows: null
                          evaluated_rows: null
                          detail: null
                        - source_key: air
                          category: missing
                          rule: max_null_ratio
                          column: pm10_value
                          status: warn
                          actual: 0.04
                          threshold: 0.01
                          affected_rows: 1
                          evaluated_rows: 25
                          detail: null
                    schema_drift:
                      air:
                        - kind: column_added
                          column: station_code
                          detail: column added since previous successful run
                LegacyQualityUnavailable:
                  summary: quality 결과가 없던 legacy run
                  value:
                    run_id: air-quality-legacy
                    availability: unavailable
                    evaluated_checks: 0
                    quality_results: {}
                    schema_drift: {}
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                RunNotFound:
                  summary: manifest가 없는 run
                  value:
                    error: "manifest not found: missing-run"

  /quality/summary:
    get:
      operationId: getQualitySummary
      summary: >-
        최근 window(24h) cross-run quality aggregate (#486 후속, additive — API
        1.22.0). 접근 가능한 run들의 structured quality를 PASS/WARN/FAIL run 수로
        요약한다. Studio Home의 "QUALITY WARN (24H)" KPI가 임의 숫자 합성 없이
        authoritative aggregate를 읽도록 하는 bounded 집계다. 개별 run의
        `quality_results`/dataset/owner는 노출하지 않는다 — 그건 per-run
        `GET /builds/{run_id}/quality`의 몫이다. 시스템 observability
        (`GET /monitoring/summary`·`GET /monitoring/builds`, #516)와 도메인
        quality를 한 응답에 섞지 않는다. ENFORCE_OWNERSHIP+oidc principal이면
        본인이 접근 가능한 run만 집계한다(#505). legacy run(BuildSpec snapshot
        없음)은 structured quality가 없으므로 자연히 제외된다.
      parameters:
        - name: window
          in: query
          required: false
          description: "집계 기간. 현재 24h만 지원 (기본값: 24h)"
          schema:
            type: string
            enum: [24h]
            default: 24h
      responses:
        "200":
          description: 최근 window의 PASS/WARN/FAIL run 수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualitySummaryResponse"
              examples:
                RecentWindow:
                  summary: 최근 24h에 평가된 run 요약
                  value:
                    window: 24h
                    generated_at: "2026-09-01T09:30:00+00:00"
                    availability: available
                    total_runs: 7
                    evaluated_runs: 5
                    pass_runs: 3
                    warn_runs: 2
                    fail_runs: 1
        "400":
          description: 지원하지 않는 window 값
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /query:
    post:
      operationId: queryBuiltDataset
      summary: 서버가 resolve한 Silver/Gold table에 read-only SQL 실행
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              AveragePm10ByStation:
                summary: 서버가 resolve한 Silver table 집계
                value:
                  dataset_id: seoul-air-quality
                  run_id: air-quality-20260815
                  stage: silver
                  source: air
                  sql: SELECT station_name, AVG(pm10_value) AS avg_pm10 FROM dataset GROUP BY station_name ORDER BY avg_pm10 DESC
                  limit: 100
      responses:
        "200":
          description: bounded query result preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              examples:
                AveragePm10Result:
                  summary: bounded row 결과와 현재 1.9.0 실행 시간 필드
                  value:
                    columns: [station_name, avg_pm10]
                    rows:
                      - station_name: 종로구
                        avg_pm10: 31.5
                      - station_name: 중구
                        avg_pm10: 28.0
                    truncated: false
                    execution_ms: 7
                    startup_ms: 12
                    engine_execution_ms: 5
        "400":
          description: invalid context, unsafe SQL, syntax/execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UnsafeQuery:
                  summary: write statement가 포함된 SQL 거부
                  value:
                    error: only read-only SELECT queries are allowed
                    code: unsafe_query
                InvalidContext:
                  summary: dataset_id와 run snapshot이 일치하지 않음
                  value:
                    error: dataset does not match run snapshot
                    code: invalid_context
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: query context 소유권 위반
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                Forbidden:
                  summary: 다른 principal 소유 run
                  value:
                    error: forbidden
                    code: forbidden
        "404":
          description: stage artifact unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ArtifactUnavailable:
                  summary: 요청 stage의 table artifact가 없음
                  value:
                    error: query artifact unavailable
                    code: artifact_unavailable
        "429":
          description: query 전용 capacity 포화. child process는 생성되지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                QueryBusy:
                  summary: query 전용 동시 실행 capacity 포화
                  value:
                    error: query is busy
                    code: query_busy
        "504":
          description: query process timeout 및 강제 종료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                QueryTimeout:
                  summary: 격리된 query process 제한 시간 초과
                  value:
                    error: query timed out
                    code: query_timeout

  /monitoring/summary:
    get:
      operationId: getMonitoringSummary
      summary: Builder API/Queue/Worker/Artifact Store 시스템 상태 요약 (#516)
      description: >-
        시스템 aggregate만 반환하며 개별 run의 dataset/owner/credential 정보는
        포함하지 않는다. Async build queue/worker(#511/#513)는 이 서비스가 항상
        생성하는 AsyncBuildExecutor의 read-only snapshot을 반영하므로 항상
        `availability: available`이다(#516). Provider 상태는 네트워크 프로브를
        유발하므로 이번 버전에서는 포함하지 않는다.
      responses:
        "200":
          description: 시스템 상태 요약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /monitoring/builds:
    get:
      operationId: getMonitoringBuilds
      summary: 시간대별 build 통계와 recent runs (#516)
      description: >-
        BuildIndex(ADR 0003) 기반 파생 집계. timezone은 UTC이며 bucket 경계는
        `[start, end)` 반열린이다. bucket 기준 timestamp는 `finished_at`이다.
        ENFORCE_OWNERSHIP+oidc principal일 때는 본인이 접근 가능한 run만
        집계·노출한다(#505).
      parameters:
        - name: window
          in: query
          required: false
          description: "집계 기간. 현재 24h만 지원 (기본값: 24h)"
          schema:
            type: string
            enum: [24h]
            default: 24h
        - name: bucket
          in: query
          required: false
          description: "집계 단위. 현재 hour만 지원 (기본값: hour)"
          schema:
            type: string
            enum: [hour]
            default: hour
      responses:
        "200":
          description: build 통계와 recent runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBuildsResponse"
        "400":
          description: 지원하지 않는 window/bucket 값
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/runs:
    get:
      operationId: adminListRuns
      summary: 모든 소유자의 run 상태 조회 (관리자 전용, #679)
      description: >-
        관리자 principal에게 모든 소유자의 run을 **메타데이터만** 반환한다.
        산출물 바이트·credential·응답 본문은 어떤 경우에도 포함하지 않는다 —
        이 제품은 BYOK이고, 관리자가 사용자 데이터를 열 수 있는지는 아직
        결정되지 않았다(#679). 소유자는 되돌릴 수 없는 `owner_id` 해시로만
        구분된다. 관리자가 아니면 403이다.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 모든 소유자의 run 메타데이터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRunsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 관리자 역할이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: build index를 읽을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/config:
    get:
      operationId: adminGetConfig
      summary: 적용 중인 정책 설정 조회 (관리자 전용, #679)
      description: >-
        지금 적용 중인 정책의 **상태**만 반환한다. 토큰·키·issuer URL 같은
        설정 값은 포함하지 않는다. 관리자가 아니면 403이다.
      responses:
        "200":
          description: 적용 중인 정책 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 관리자 역할이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        서버에 KPUBDATA_BUILDER_API_KEY가 설정된 경우 필수. 미설정 시(로컬 개발 기본값)
        인증 없이 모든 요청이 허용된다 (#248).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Google OIDC ID 토큰 (ADR 0009). Authorization: Bearer <jwt>.
        OIDC_ISSUER 미설정 시 비활성 — 기존 ApiKeyAuth 배포에 영향 없음 (#385).

  responses:
    Unauthorized:
      description: X-API-Key가 누락되었거나 서버에 설정된 키와 일치하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            MissingOrInvalidApiKey:
              summary: 인증 정보가 없거나 일치하지 않음
              value:
                error: unauthorized

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: build 실행 식별자(경로 안전한 단일 세그먼트)
      schema:
        type: string

    DatasetId:
      name: dataset_id
      in: path
      required: true
      description: >-
        BuildSpec.dataset_id 값. slash/space 등 경로에 그대로 쓸 수 없는 문자를
        포함할 수 있으므로 클라이언트는 percent-encoding해야 한다(#488).
      schema:
        type: string

    Stage:
      name: stage
      in: path
      required: true
      description: 조회할 medallion stage
      schema:
        type: string
        enum: [bronze, silver, gold]

    ProviderName:
      name: provider
      in: path
      required: true
      description: kpubdata runtime catalog에 등록된 Provider 식별자
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"

    UploadId:
      name: upload_id
      in: path
      required: true
      description: >-
        POST /uploads가 발급한 불투명한 식별자(#498). 사용자가 지정한 값이 아니다.
      schema:
        type: string
        pattern: "^upl_[a-f0-9]{32}$"

  schemas:
    AdminRunsResponse:
      type: object
      additionalProperties: false
      required: [runs, count]
      properties:
        count:
          type: integer
        runs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [run_id, status]
            properties:
              run_id:
                type: string
              status:
                type: string
              started_at:
                type: string
                nullable: true
              finished_at:
                type: string
                nullable: true
              owner_id:
                type: string
                nullable: true
                description: 되돌릴 수 없는 소유자 해시. 사용자 신원을 담지 않는다.
    AdminConfigResponse:
      type: object
      additionalProperties: false
      required: [enforce_ownership, publish_server_credential_fallback]
      properties:
        enforce_ownership:
          type: boolean
        publish_server_credential_fallback:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 사람이 읽는 오류 요약 메시지
        code:
          type: string
          description: 클라이언트 분기용 안정적인 오류 코드(새 endpoint에서 사용)

    QueryRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, run_id, stage, sql]
      properties:
        dataset_id: {type: string}
        run_id: {type: string}
        stage: {type: string, enum: [silver, gold]}
        source: {type: string}
        sql: {type: string, maxLength: 65536}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}

    QueryResponse:
      type: object
      additionalProperties: false
      required: [columns, rows, truncated, execution_ms, startup_ms, engine_execution_ms]
      properties:
        columns:
          type: array
          items: {type: string}
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        truncated: {type: boolean}
        execution_ms:
          type: integer
          minimum: 0
          description: >-
            QueryEngine.execute 진입부터 child payload 수신·검증과 child join까지의
            parent end-to-end monotonic wall time(ms). 기존 필드 의미를 유지한다.
        startup_ms:
          type: integer
          minimum: 0
          description: >-
            Parent의 QueryEngine.execute 진입부터 spawned child가 Polars import와 bounded
            SQL setup을 끝내고 scan_parquet를 시작하기 직전까지의 monotonic time(ms).
        engine_execution_ms:
          type: integer
          minimum: 0
          description: >-
            Child에서 scan_parquet 직전부터 SQLContext 생성, execute, collect 완료
            직후까지의 Polars engine monotonic time(ms).

    ValidationError:
      type: object
      description: >-
        validate/build/preview의 spec 검증 실패 응답. SpecLoadError는
        {status:"error", error}, ValidationError는 {status:"invalid", problems}로
        나뉜다.
      required: [status]
      properties:
        status:
          type: string
          enum: [error, invalid]
        error:
          type: string
          description: status=error일 때의 파싱 오류 메시지
        problems:
          type: array
          description: status=invalid일 때의 검증 문제 목록
          items:
            type: string

    JsonValue:
      description: 표준 JSON으로 직렬화 가능한 값(null, scalar, array, object)
      type: [string, number, boolean, object, array, "null"]
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      items:
        $ref: "#/components/schemas/JsonValue"

    BuildSpec:
      type: object
      description: >-
        선언적 빌드 명세(snake_case). dataset_id/title/description/sources/exports는
        필수이고 나머지 필드는 선택이다. 세부 스키마는 spec 모델
        (spec/models.py)을 따른다. 제거된 transforms/normalization_mode 필드는
        허용하지 않는다.
      additionalProperties: true
      allOf:
        - not:
            required: [transforms]
        - not:
            required: [normalization_mode]
      required: [dataset_id, title, description, sources, exports]
      properties:
        dataset_id:
          type: string
        title:
          type: string
        description:
          type: string
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        exports:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExportTarget"
        metadata:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        publish:
          type: boolean
          default: false
        splits:
          oneOf:
            - $ref: "#/components/schemas/SplitSpec"
            - type: "null"
        pii:
          oneOf:
            - $ref: "#/components/schemas/PiiPolicy"
            - type: "null"
        license:
          type: [string, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/QualityPolicy"
            - type: "null"
        composition:
          description: >-
            두 source를 join해 하나의 결합 Gold dataset을 추가로 만드는 계약
            (#506). None이면 기존과 동일하게 source별 독립 Gold만 생성한다.
          oneOf:
            - $ref: "#/components/schemas/CompositionSpec"
            - type: "null"

    SourceRef:
      type: object
      description: >-
        Canonical source 참조(#498). `kind`로 public_api(기본, 하위 호환)/file/url을
        구분한다. `kind`를 생략한 source는 항상 `public_api`로 해석되며
        provider/dataset이 필수다. `file`은 upload_id+format(+encoding)이,
        `url`은 endpoint(+method+format)가 필수다 — kind별 조건부 필수/금지
        조합은 OpenAPI object schema로 표현하지 않고(이 계약의 기존 패턴과 동일하게
        `additionalProperties`로 열어두고) `spec/loader.py`·`validator.py`가
        엄격히 강제한다. url source는 P0 범위(GET, Auth=None)의 SSRF-safe fetch만
        허용하며 https가 아닌 scheme·userinfo가 포함된 endpoint는 거부된다.
        제거된 normalization_mode 필드는 허용하지 않는다.
      additionalProperties: true
      not:
        required: [normalization_mode]
      properties:
        kind:
          type: string
          enum: [public_api, file, url]
          default: public_api
        provider:
          type: string
          description: kind="public_api"에서 필수.
        dataset:
          type: string
          description: kind="public_api"에서 필수.
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: >-
            list 호출에 전달할 원시 파라미터. `param_grid`와 함께 쓰면 전개된
            모든 조합에 공통으로 붙는 값이 된다(예: `numOfRows`).
        param_grid:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/JsonValue"
            minItems: 1
          default: {}
          description: >-
            여러 파라미터 조합에 걸쳐 반복 호출하기 위한 선언(#613). 값마다
            리스트를 주면 데카르트 곱으로 전개되고, 각 조합의 결과가 하나의
            Bronze artifact로 이어붙는다. `kind="public_api"`에서만 유효하다.
            전개 순서는 고정이다 — 키를 이름순으로 정렬하고 마지막 키가 가장
            빨리 변하며, 각 축 안에서는 선언된 값 순서를 지킨다. 순서가 바뀌면
            Bronze 바이트가 바뀌어 재빌드 결정성이 깨진다. 같은 키를 `params`와
            양쪽에 두는 선언은 거부된다.
        alias:
          type: string
          default: ""
        schema:
          oneOf:
            - $ref: "#/components/schemas/SchemaContract"
            - type: "null"
        upload_id:
          type: string
          pattern: "^upl_[a-f0-9]{32}$"
          description: kind="file"에서 필수. POST /uploads가 발급한 식별자.
        format:
          type: string
          enum: [csv, json, jsonl, parquet]
          description: >-
            kind="file"에서 필수(업로드 시 검증된 format과 정확히 일치해야 함).
            kind="url"에서는 선택(json/jsonl/csv만 허용, 생략 시 응답
            Content-Type로 추론).
        encoding:
          type: string
          default: utf-8
          description: kind="file"에서 텍스트(csv/json/jsonl) 디코딩에 쓰는 인코딩.
        endpoint:
          type: string
          format: uri
          description: kind="url"에서 필수. https만 허용한다(SSRF 정책, #498).
        method:
          type: string
          enum: [GET]
          default: GET
          description: kind="url"에서만 쓰이며 P0는 GET만 허용한다.

    SchemaContract:
      type: object
      description: Silver 정규화 및 required-column/dtype 검증 계약
      properties:
        required:
          type: array
          items:
            type: string
          default: []
        dtypes:
          type: object
          additionalProperties:
            type: string
          default: {}
        casts:
          type: object
          additionalProperties:
            type: string
          default: {}
        rename:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: >-
            원 필드명 → canonical 컬럼명 매핑(#611). 캐스팅보다 먼저 적용되므로
            required/dtypes/casts/derived는 모두 rename 이후의 이름을 가리킨다.
        derived:
          type: array
          items:
            $ref: "#/components/schemas/DerivedColumn"
          default: []
          description: >-
            기존 컬럼에서 새 컬럼을 만드는 규칙(#611). 캐스팅 뒤에 적용된다 —
            파생 규칙이 캐스팅된 값을 읽을 수 있어야 하기 때문이다.
        read_as:
          type: object
          additionalProperties:
            type: string
            enum: [str]
          default: {}
          description: >-
            원천 컬럼을 읽을 타입 선언(#613). 레코드마다 타입이 다른 원천 컬럼을
            선언으로 처리한다. 키는 rename *이전* 의 원 필드명이다 — 테이블이
            만들어지기 전에 적용되기 때문이다. CSV 원천에서는 파싱 단계에서
            적용되어 `00123` 같은 식별자의 앞자리 0이 보존된다.
        null_tokens:
          type: array
          items:
            type: string
          default: []
          description: >-
            결측을 나타내는 원천 표기(#613, 예: `[""]`). 캐스팅 전에 null로 모은다.
            결측을 지우는 것이 아니라 표기를 하나로 맞추는 것이며, 선언되지 않은
            값은 건드리지 않는다.
        coalesce:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            minItems: 1
          default: {}
          description: >-
            세대별 alias 컬럼을 하나의 canonical 컬럼으로 모으는 규칙(#620). 키는
            canonical 컬럼명, 값은 rename *이전* 의 후보 원 필드명이다. 수렴한 후보
            컬럼은 canonical 컬럼에 흡수되어 사라진다. 한 규칙의 target이 다른
            규칙의 후보이거나 두 규칙이 같은 후보를 두고 다투면, 결과가 선언 순서에
            달리므로 거부된다.
        zfill:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          default: {}
          description: >-
            canonical 식별자를 선언된 폭으로 왼쪽 0 padding 한다(#620). 키는 rename
            *이후* 의 이름이다. null은 null로 남고, 선언 폭보다 긴 값은 잘리지 않고
            빌드를 세운다.
        column_null_tokens:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnNullTokens"
          default: {}
          description: >-
            컬럼별 결측 표기 선언(#623). 키는 rename *이전* 의 원 필드명이다. 한
            컬럼에서 인정하는 결측 표현은 전역 `null_tokens` + 그 컬럼의 선언이며,
            컬럼별 선언이 전역을 덮어쓰지 않는다.

    ColumnNullTokens:
      type: object
      description: >-
        한 컬럼의 결측 표기 선언과, 그 컬럼이 없을 때의 정책(#623). "이 컬럼에서
        무엇이 결측인가"와 "이 컬럼이 반드시 있어야 하는가"는 별개의 계약이라
        presence 정책을 따로 둔다.
      properties:
        tokens:
          type: array
          items:
            type: string
          default: []
          description: 이 컬럼에서 결측으로 볼 원천 표기. 전역 null_tokens에 더해진다.
        on_absent:
          type: string
          enum: [error, ignore]
          default: error
          description: >-
            컬럼이 없을 때. `error`는 오타와 schema drift를 잡는다 — 선언이 조용한
            무동작이 되면 결측이 값으로 남은 채 품질 지표가 그것을 세지 않는다.
            `ignore`는 이 규칙의 적용만 건너뛰며, 그 컬럼을 optional로 만들지는
            않는다.

    DerivedColumn:
      type: object
      description: >-
        기존 컬럼에서 새 컬럼을 만드는 typed 규칙(#611). 자유형 표현식은 지원하지
        않는다 — RangeRule/CompareColumnsRule의 관례를 따른다.
      required: [name, kind, columns]
      properties:
        name:
          type: string
          description: 만들어질 컬럼명.
        kind:
          type: string
          enum: [date_parts, join_key]
          description: >-
            date_parts는 연/월/일 세 컬럼을 Date로 합치고, join_key는 여러 컬럼을
            하나의 문자열 복합키로 합친다.
        columns:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            입력 컬럼명. date_parts는 (year, month, day) 순서로 정확히 3개,
            join_key는 1개 이상.

    UploadMetadata:
      type: object
      description: >-
        안전한(secret-free) 업로드 메타데이터(#498). content는 절대 포함하지
        않으며, 이 API로는 원문 content를 다시 조회할 수 없다.
      required: [upload_id, format, encoding, size_bytes, original_filename, created_at]
      properties:
        upload_id:
          type: string
          pattern: "^upl_[a-f0-9]{32}$"
        format:
          type: string
          enum: [csv, json, jsonl, parquet]
        encoding:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        original_filename:
          type: [string, "null"]
          description: 표시 전용 원본 파일명(파일시스템 경로 아님).
        created_at:
          type: string
          format: date-time

    UploadDeleteResponse:
      type: object
      required: [upload_id, deleted]
      properties:
        upload_id:
          type: string
        deleted:
          type: boolean

    ExportTarget:
      type: object
      required: [kind, output_path]
      properties:
        kind:
          type: string
        output_path:
          type: string
        options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"

    SplitSpec:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ratio, key]
        ratios:
          type: object
          additionalProperties:
            type: number
          default: {}
        key:
          type: string
          default: ""
        seed:
          type: integer
          default: 0

    PiiPolicy:
      type: object
      properties:
        mode:
          type: string
          enum: [block, warn, allow]
          default: block
        allow_columns:
          type: array
          items:
            type: string
          default: []

    QualitySeverity:
      type: string
      description: >-
        quality rule 위반 시 심각도 (#486). "warn"(기본, Build 계속 진행) |
        "fail"(Gold 진입 전 소스 실패).
      enum: [warn, fail]
      default: warn

    QualityRangeRule:
      type: object
      description: >-
        숫자 컬럼의 최소/최대 범위 규칙 (#486). min/max는 포함(inclusive) 경계이며
        자유형 eval을 쓰지 않는 typed rule이다. null 값은 위반으로 계산하지 않는다.
      required: [column]
      properties:
        column:
          type: string
        min:
          type: [number, "null"]
        max:
          type: [number, "null"]
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityCompareColumnsRule:
      type: object
      description: >-
        두 컬럼 간 비교 규칙 (#486). operator는 제한된 어휘만 허용하며 자유형
        expression/eval을 쓰지 않는다. 두 컬럼 모두 null이 아닌 행만 평가한다.
      required: [left, operator, right]
      properties:
        left:
          type: string
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        right:
          type: string
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityPolicy:
      type: object
      description: >-
        데이터 품질 임계 정책. max_duplicate_rate/max_null_ratio/min_rows(#446)는
        기존 syntax와 100% 하위 호환이며 기본 severity는 "warn"이다. 대응하는
        ``*_severity`` 필드(#486)로 명시적 FAIL을 선언할 수 있다.
      properties:
        max_duplicate_rate:
          type: [number, "null"]
        max_duplicate_rate_severity:
          $ref: "#/components/schemas/QualitySeverity"
        max_null_ratio:
          type: object
          additionalProperties:
            type: number
          default: {}
        max_null_ratio_severity:
          type: object
          description: 컬럼별 max_null_ratio severity override. 선언 안 된 컬럼은 "warn".
          additionalProperties:
            $ref: "#/components/schemas/QualitySeverity"
          default: {}
        min_rows:
          type: [integer, "null"]
        min_rows_severity:
          $ref: "#/components/schemas/QualitySeverity"
        range:
          type: array
          items:
            $ref: "#/components/schemas/QualityRangeRule"
          default: []
        compare_columns:
          type: array
          items:
            $ref: "#/components/schemas/QualityCompareColumnsRule"
          default: []

    JoinSpec:
      type: object
      description: >-
        두 source를 결합하는 equi-join 계약(#506). 초기 범위는 두 source
        단일 join으로 제한한다 — 3개 이상 join graph, 자유형 SQL join
        조건은 지원하지 않는다. left/right는 sources[].alias를 참조해야
        하며, 참조되는 source는 alias를 반드시 선언해야 한다.
      required: [left, right, left_key, right_key]
      properties:
        left:
          type: string
          description: 왼쪽 source의 alias (sources[].alias 참조)
        right:
          type: string
          description: 오른쪽 source의 alias
        left_key:
          type: string
          description: 왼쪽 테이블의 join key 컬럼명
        right_key:
          type: string
          description: 오른쪽 테이블의 join key 컬럼명
        type:
          type: string
          enum: [inner, left]
          default: inner
        on_duplicate_key:
          type: string
          enum: [warn, fail]
          default: warn
          description: >-
            양쪽 join key가 모두 중복 값을 가져(many-to-many) 결과 행이
            곱셈으로 폭증할 수 있을 때의 처리. warn은 경고만 남기고 결과를
            만들고, fail은 빌드를 실패시킨다.

    CompositionSpec:
      type: object
      description: 여러 source를 하나의 결합 Gold dataset으로 조립하는 계약(#506).
      required: [name, join]
      properties:
        name:
          type: string
          description: >-
            결합 결과 Gold dataset 이름. 다른 source의 output key(alias 또는
            provider.dataset)와 겹치면 안 된다.
        join:
          $ref: "#/components/schemas/JoinSpec"

    SpecRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열

    PreviewRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 5
          description: >-
            상한 1000은 #497에서 새로 도입됐다(behavioral tightening — v1.8.0
            이전에는 상한이 없었다). 1000을 넘는 값은 400을 반환한다.
        sample_mode:
          type: string
          enum: [first, random]
          default: first
          description: >-
            "first"는 상위 N행, "random"은 seed 기반 결정적 무작위 N행이다(#497).
            Source sample과 Silver sample은 항상 같은 행 인덱스를 공유한다 —
            생략하면 기존 client와 동일하게 상위 N행을 반환한다.
        seed:
          type: integer
          description: >-
            sample_mode=random일 때 쓰는 결정적 시드(#497). 생략하면 고정
            기본값을 써서 seed 없이도 재현 가능하다. sample_mode=first에서는
            무시된다.

    BuildRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        run_id:
          type: string
          description: 명시 시 비어있지 않은 경로 안전한 단일 세그먼트여야 한다

    VersionResponse:
      type: object
      required: [service, api_version]
      properties:
        service:
          type: string
        api_version:
          type: string

    HealthResponse:
      type: object
      required: [status]
      description: liveness probe 응답 (버전·메타 정보 없이 status만, #372)
      properties:
        status:
          type: string
          const: "ok"

    CatalogResponse:
      type: object
      required: [providers]
      description: provider/dataset 카탈로그 (#416, BL2)
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProvider"

    CatalogProvider:
      type: object
      required: [name, datasets]
      properties:
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDataset"

    CatalogDataset:
      type: object
      required:
        [
          name,
          title,
          description,
          tags,
          source_url,
          representation,
          operations,
          query_support,
          requires_service_key,
          request_parameters,
          application,
        ]
      description: >
        DatasetRef의 public/canonical metadata를 allowlist로 직렬화한다 (#490).
        raw_metadata는 provider 내부 정보/secret이 섞일 수 있어 노출하지 않는다.
        metadata가 없는 dataset은 description/source_url/query_support가 null,
        tags/operations가 빈 배열이다.
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
          description: 사람이 읽는 데이터셋 설명 (없으면 null)
        tags:
          type: array
          items:
            type: string
          description: 탐색용 분류 태그 (정렬된 문자열 배열, 없으면 빈 배열)
        source_url:
          type: [string, "null"]
          description: 원본 API 문서/데이터 포털 URL (없으면 null)
        representation:
          type: string
          enum: [api_json, api_xml, file_csv, file_excel, sheet, other]
        operations:
          type: array
          items:
            type: string
            enum: [list, get, schema, raw, download]
          description: 지원 작업 (정렬된 문자열 배열, 없으면 빈 배열)
        query_support:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CatalogQuerySupport"
          description: 목록 질의 capability (알려진 경우만, 없으면 null)
        requires_service_key:
          type: boolean
        request_parameters:
          type: array
          items:
            $ref: "#/components/schemas/CatalogRequestParameter"
          description: >
            선택한 Dataset에 전달하는 요청 파라미터의 secret-free 설명 (#490 후속,
            additive). raw_metadata에서 allowlist로 추린 것으로 serviceKey 등 시크릿
            파라미터는 포함되지 않는다. metadata가 없으면 빈 배열.
        application:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CatalogApplication"
          description: >
            공공데이터포털처럼 API Key 발급과 Dataset별 활용신청이 별개일 수 있는
            경우의 안내 (#490 후속, additive). raw_metadata.application에서
            그대로 전달한 것으로, 없으면 null(활용신청이 필요 없다는 뜻이 아니라
            알려진 바 없음). Studio는 신청 완료/승인 여부를 이 필드로 추측하지 않는다
            — Preview 성공이 실제 사용 가능 여부의 최종 확인이다.

    CatalogRequestParameter:
      type: object
      required: [name, required, description, example]
      properties:
        name:
          type: string
          description: 요청 파라미터 이름 (시크릿/serviceKey 계열은 제외됨)
        required:
          type: boolean
          description: 이 파라미터가 필수인지
        description:
          type: [string, "null"]
          description: 사람이 읽는 설명 (없으면 null)
        example:
          type: [string, "null"]
          description: 근거 있는 예시 값 (없으면 null)

    CatalogApplication:
      type: object
      required: [required, url]
      description: >
        Dataset별 활용신청 안내 (API Key 발급과 별개일 수 있음). Studio는 신청
        완료/승인 상태를 이 필드로 만들어내지 않는다 — 알 수 없으면 알 수 없는
        상태로 남긴다.
      properties:
        required:
          type: boolean
          description: 이 Dataset이 API Key 등록과 별도로 활용신청이 필요할 수 있는지
        url:
          type: string
          format: uri
          description: 공식 Dataset 상세/활용신청 페이지 (http/https만 허용)

    CatalogQuerySupport:
      type: object
      required: [pagination, filterable_fields, sortable_fields, time_range, max_page_size]
      properties:
        pagination:
          type: string
          enum: [offset, index, cursor, none]
        filterable_fields:
          type: array
          items:
            type: string
        sortable_fields:
          type: array
          items:
            type: string
        time_range:
          type: boolean
        max_page_size:
          type: [integer, "null"]
          minimum: 1

    ProviderListResponse:
      type: object
      required: [providers]
      additionalProperties: false
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"

    ProviderSummary:
      type: object
      required: [provider, requires_credential, configured]
      additionalProperties: false
      properties:
        provider:
          type: string
        requires_credential:
          type: boolean
        configured:
          type: boolean
          description: user credential, server default, 또는 무인증 Provider이면 true

    ProviderCredentialPutRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential:
          type: string
          minLength: 1
          writeOnly: true
          description: 저장할 raw credential. 응답, 로그, manifest, event에 포함하지 않는다.

    ProviderCredentialMetadata:
      type: object
      required: [provider, configured, masked, updated_at]
      additionalProperties: false
      description: owner_id와 credential 원문을 포함하지 않는 사용자별 저장 메타데이터
      properties:
        provider:
          type: string
        configured:
          type: boolean
        masked:
          type: [string, "null"]
          description: 설정 시 고정 마스크. credential 일부도 노출하지 않는다.
        updated_at:
          type: [string, "null"]
          format: date-time

    ProviderCredentialGetResponse:
      type: object
      required: [configured, masked, updated_at]
      additionalProperties: false
      description: GET credential 응답. provider, owner_id, credential 원문을 포함하지 않는다.
      properties:
        configured:
          type: boolean
        masked:
          type: [string, "null"]
          description: 설정 시 고정 마스크. credential 일부도 노출하지 않는다.
        updated_at:
          type: [string, "null"]
          format: date-time

    ProviderTestResponse:
      type: object
      required: [provider, status, configured, latency_ms, checked_at]
      additionalProperties: false
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [connected, failed, not_configured]
        configured:
          type: boolean
        latency_ms:
          type: integer
          minimum: 0
        checked_at:
          type: string
          format: date-time
        error_category:
          type: string
          enum: [auth, network, timeout, provider, unknown]
        response_code:
          type: integer
          minimum: 100
          maximum: 599
          description: kpubdata가 구조적으로 신뢰 가능한 status를 제공한 경우에만 포함

    StructuredProblem:
      type: object
      required: [code, path, message]
      description: 구조화된 검증 문제 (#417, BL3)
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string
        hint:
          type: string
          nullable: true

    ValidateResponse:
      type: object
      required: [status, dataset_id, api_version]
      properties:
        status:
          type: string
          enum: [valid]
        dataset_id:
          type: string
        api_version:
          type: string

    PreviewResponse:
      type: object
      required: [dataset_id, previews]
      properties:
        dataset_id:
          type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/SourcePreview"

    SourcePreview:
      type: object
      required:
        - source_key
        - status
        - error
        - schema
        - sample
        - total_rows
        - statistics
        - quality_results
        - source_sample
        - sample_mode
        - diff_available
        - diffs
        - transform_summary
        - diff_truncated
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        error:
          type: [string, "null"]
        schema:
          type: array
          items:
            type: object
            required: [name, dtype, nullable, unique_count]
            properties:
              name:
                type: string
              dtype:
                type: string
              nullable:
                type: boolean
              unique_count:
                type: integer
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        total_rows:
          type: integer
        statistics:
          $ref: "#/components/schemas/TableStatistics"
        quality_results:
          type: array
          description: >-
            구조화된 Quality/Schema 평가 결과 (#486). Build와 동일한 evaluator
            결과이며 PASS를 포함한 실제로 평가된 check만 담는다. drift는 preview가
            워크스페이스에 아무것도 쓰지 않으므로 포함하지 않는다.
          items:
            $ref: "#/components/schemas/QualityCheckResult"
        source_sample:
          type: array
          description: >-
            변환 전 Bronze 원본 sample(#497). diff_available=false여도 최선
            노력으로 채워질 수 있다(조회 자체가 실패하면 빈 배열).
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        sample_mode:
          type: string
          enum: [first, random]
          description: 이 응답에 실제로 적용된 sampling 방식.
        diff_available:
          type: boolean
          description: >-
            source_sample[i]와 sample[i]가 동일 논리 행을 가리킨다고 보장할 수
            있을 때만 true다(#497). 행 수 불일치, row reorder/filter 가능성,
            조회 실패 등에서는 false이며 diffs/transform_summary는 빈 값이다.
            잘못된 index 기반 비교보다 false가 우선이다.
        diffs:
          type: array
          description: >-
            diff_available=true일 때만 채워지는 셀 단위 변경 목록(#497). limit은
            행 수만 제한하고 컬럼 수는 제한하지 않으므로, 실제 변경 셀 수가
            많으면 최대 1000개(MAX_PREVIEW_DIFF_ITEMS)까지만 담긴다 —
            diff_truncated로 잘렸는지 확인한다.
          items:
            $ref: "#/components/schemas/PreviewDiffItem"
        transform_summary:
          description: >-
            diff_available=true일 때만 채워지는 변경 요약(#497). 비교 가능한
            sample 범위 기준이며 전체 dataset 변화량이 아니다. diffs가
            diff_truncated로 잘려도 changed_cells/changed_rows는 잘리지 않은
            실제 합계를 유지한다.
          oneOf:
            - $ref: "#/components/schemas/PreviewTransformSummary"
            - type: "null"
        diff_truncated:
          type: boolean
          description: >-
            diffs가 MAX_PREVIEW_DIFF_ITEMS(1000) 상한에 걸려 실제 변경 셀 전부를
            담지 못했으면 true다(#497 sample/diff memory 상한). diffs를 전체
            diff로 오인하지 않도록 명시한다. diff_available=false면 애초에
            diff를 시도하지 않았으므로 항상 false다.

    PreviewDiffItem:
      type: object
      description: >-
        Source↔Silver 셀 단위 변경 하나(#497). diff_available=true인 source의
        diffs에만 등장한다.
      additionalProperties: false
      required: [row, column, before, after, transform]
      properties:
        row:
          type: integer
          minimum: 0
          description: source_sample/sample 배열 내 0-based 위치(전체 dataset의 절대 행 번호 아님).
        column:
          type: string
        before:
          $ref: "#/components/schemas/JsonValue"
        after:
          $ref: "#/components/schemas/JsonValue"
        transform:
          type: [string, "null"]
          description: >-
            컬럼에 선언된 캐스팅(schema.casts)이 있을 때만 "cast:{dtype}" 형태로
            채운다. 알 수 없는 변환은 추측하지 않고 null.

    PreviewTransformSummary:
      type: object
      description: 비교 가능한 sample 범위에서 계산한 변경 요약(#497).
      additionalProperties: false
      required: [changed_cells, changed_rows]
      properties:
        changed_cells:
          type: integer
          minimum: 0
        changed_rows:
          type: integer
          minimum: 0

    QualityCheckResult:
      type: object
      description: 단일 quality/schema check의 구조화된 결과 (#486).
      additionalProperties: false
      required:
        - source_key
        - category
        - rule
        - column
        - status
        - actual
        - threshold
        - affected_rows
        - evaluated_rows
        - detail
      properties:
        source_key:
          type: string
        category:
          type: string
          description: >-
            check 대분류(예: duplicate, missing, row_count, schema, range,
            compare_columns).
        rule:
          type: string
          description: >-
            구체적 rule 이름(예: max_duplicate_rate, max_null_ratio, min_rows,
            required_column, dtype, range, compare_columns).
        column:
          type: [string, "null"]
          description: >-
            관련 컬럼명. 테이블 전체 규칙이면 null. compare_columns는
            "{left},{right}" 형식의 합성값을 쓴다.
        status:
          type: string
          enum: [pass, warn, fail]
        actual:
          $ref: "#/components/schemas/JsonValue"
        threshold:
          $ref: "#/components/schemas/JsonValue"
          description: >-
            원래 규칙의 비교 조건. 기존 비율/행 수 규칙은 numeric 값을 유지한다.
            range는 {min, max}, compare_columns는 {operator, right_column} 구조다.
        affected_rows:
          type: [integer, "null"]
          description: 위반 행 수. 정확히 셀 수 없으면 null(임의 추정 금지).
        evaluated_rows:
          type: [integer, "null"]
          description: 실제 평가에 사용된 행 수. 의미 없으면 null.
        detail:
          type: [string, "null"]
          description: >-
            평가 불가 이유 등 사용자가 이해할 수 있는 결정적 설명. 정상 평가 결과는
            null이며 내부 예외·스택 트레이스·절대 경로를 포함하지 않는다.

    SchemaDriftFinding:
      type: object
      description: >-
        구조화된 schema drift 관찰 (#445, #486). deterministic 감지 결과이며
        PASS/WARN/FAIL 게이트에는 관여하지 않는다(참고용).
      additionalProperties: false
      required: [kind, column, detail]
      properties:
        kind:
          type: string
          enum: [column_added, column_removed, dtype_changed, row_count_jump]
        column:
          type: [string, "null"]
        detail:
          type: string

    BuildQualityResponse:
      type: object
      description: >-
        run의 구조화된 quality_results/schema_drift 조회 응답 (#486). `availability`와
        `evaluated_checks`는 빈 `quality_results`가 "0건 평가"인지 "애초에 계산된 적
        없음"(legacy/partial run)인지 구분한다(#514).
      required: [run_id, availability, evaluated_checks, quality_results, schema_drift]
      properties:
        run_id:
          type: string
        availability:
          type: string
          enum: [available, partial, unavailable]
          description: >-
            available: 이 run이 시도한 모든 source의 quality 결과가 있다(0건일 수
            있음). partial: 일부 source만 있다(예: 한 source의 Silver 실패).
            unavailable: 결과가 전혀 없다 — quality_results 필드 자체가 없는 legacy
            run(#486 이전)뿐 아니라, 필드는 있지만(`{}`) 시도한 source 중 하나도
            결과가 없는 새 run도 포함한다(예: 모든 source가 quality 단계 진입 전에
            실패).
        evaluated_checks:
          type: integer
          minimum: 0
          description: quality_results 전체에서 실제로 평가된 check(PASS/WARN/FAIL) 총합.
        quality_results:
          type: object
          description: source_key → QualityCheckResult 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"

    DatasetQualityHistoryEntry:
      type: object
      description: >-
        단일 run의 quality PASS/WARN/FAIL 집계 (#486). evaluated_checks==0이면
        rule_pass_rate는 반드시 null이다(미평가를 100%로 위장하지 않는다).
      required:
        - run_id
        - timestamp
        - status
        - pass_count
        - warn_count
        - fail_count
        - evaluated_checks
        - rule_pass_rate
        - validated_rows
      properties:
        run_id:
          type: string
        timestamp:
          type: [string, "null"]
          description: finished_at(없으면 started_at).
        status:
          type: string
          enum: [ok, failed, cancelled]
        pass_count:
          type: integer
        warn_count:
          type: integer
        fail_count:
          type: integer
        evaluated_checks:
          type: integer
          description: pass_count + warn_count + fail_count.
        rule_pass_rate:
          type: [number, "null"]
          description: pass_count / evaluated_checks. evaluated_checks==0이면 null.
        validated_rows:
          type: [integer, "null"]
          description: >-
            run/source의 Silver row_count 합계(#488 row_counts semantics 재사용).
            evaluated_rows를 rule 수만큼 중복 합산하지 않는다.

    DatasetQualityHistoryResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          description: newest first.
          items:
            $ref: "#/components/schemas/DatasetQualityHistoryEntry"

    QualitySummaryResponse:
      type: object
      description: >-
        최근 window cross-run quality aggregate (#486 후속). 시간 기준은 canonical
        run timestamp(finished_at, 없으면 started_at)를 UTC로 파싱한
        `(generated_at - window, generated_at]`이며, 파싱 불가능한 timestamp를 가진
        run은 창에 놓을 수 없어 제외된다. 미평가/unavailable run을 PASS로 세지
        않는다.
      required:
        - window
        - generated_at
        - availability
        - total_runs
        - evaluated_runs
        - pass_runs
        - warn_runs
        - fail_runs
      additionalProperties: false
      properties:
        window:
          type: string
          enum: [24h]
        generated_at:
          type: string
          description: 집계 기준 시각(UTC, ISO 8601, 초 단위).
        availability:
          type: string
          enum: [available, unavailable]
          description: >-
            available: 집계 성공(run 0건이어도 유효). unavailable: 접근 가능한 run
            목록 자체를 열거하지 못함 — 이때 모든 count는 0이며 "0건"과 구분된다.
        total_runs:
          type: integer
          minimum: 0
          description: window 안의 접근 가능한 canonical run 수(status 무관).
        evaluated_runs:
          type: integer
          minimum: 0
          description: >-
            그 중 structured quality가 실제로 평가된(evaluated_checks > 0) run 수.
        pass_runs:
          type: integer
          minimum: 0
          description: evaluated run 중 WARN·FAIL 결과가 하나도 없는 run 수.
        warn_runs:
          type: integer
          minimum: 0
          description: >-
            evaluated run 중 WARN 결과가 하나 이상인 run 수(같은 run의 WARN check
            여러 개여도 1). Studio Home "QUALITY WARN (24H)" KPI. fail_runs와
            독립적이라 겹칠 수 있다.
        fail_runs:
          type: integer
          minimum: 0
          description: >-
            evaluated run 중 FAIL 결과가 하나 이상인 run 수. `pass_runs +
            (WARN 또는 FAIL이 있는 run 수) == evaluated_runs`.

    TableStatistics:
      type: object
      required: [row_count, null_counts, duplicate_rate]
      properties:
        row_count:
          type: integer
        null_counts:
          type: object
          additionalProperties:
            type: integer
        duplicate_rate:
          type: number

    BuildOutcome:
      type: object
      required: [source_key, status, stages_completed, error]
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        stages_completed:
          type: array
          items:
            type: string
        error:
          type: [string, "null"]

    BuildSuccessResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        composition:
          description: BuildSpec.composition이 없으면 null (#506).
          oneOf:
            - $ref: "#/components/schemas/CompositionOutcome"
            - type: "null"
        manifest:
          type: string
          description: 기록된 manifest.json의 경로
        api_version:
          type: string

    BuildFailureResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version, error]
      properties:
        status:
          type: string
          enum: [failed]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        composition:
          description: BuildSpec.composition이 없으면 null (#506).
          oneOf:
            - $ref: "#/components/schemas/CompositionOutcome"
            - type: "null"
        manifest:
          type: string
          description: partial 정책으로 남은 manifest.json의 경로
        api_version:
          type: string
        error:
          type: string
          description: >-
            첫 번째 실패 outcome의 error에서 파생된 human-readable 요약
            (#226). 모든 source가 성공하고 composition만 실패한 경우
            composition.error에서 파생된다 (#506).

    ArtifactsResponse:
      type: object
      required: [run_id, files]
      properties:
        run_id:
          type: string
        files:
          type: array
          items:
            type: string
            description: run 디렉터리 기준 상대 파일 경로

    BuildManifest:
      type: object
      required: [build_id, started_at, finished_at, schema_version]
      additionalProperties: true
      properties:
        build_id:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        schema_version:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
          description: >-
            run의 종단 상태 (#481, additive). `ok`/`failed`는 기존에 `errors`
            유무로 파생하던 값과 동일하고, `cancelled`는 협력적 취소로 종료된
            run이다. legacy manifest에는 이 필드가 없다 — reader는 부재 시
            기존대로 `errors` 유무에서 파생해야 한다. 취소된 run도 이미 실패한
            source의 사유를 `errors`에 그대로 보존한다(취소가 실패를 삼키지
            않는다).
        partial:
          type: boolean
          description: >-
            이 run이 정상 완료 전에 종료되어 `outputs`가 부분 산출물임을 뜻한다
            (#481, additive). 현재는 `status: cancelled`인 run에만 `true`이며,
            취소 시점까지 실제로 기록된 산출물만 담긴다 — 실행되지 않은 stage는
            성공으로 기록되지 않는다. 부분 산출물은 기본적으로 삭제하지
            않는다(감사/디버깅 목적 보존).
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        row_counts:
          type: object
          additionalProperties:
            type: integer
        inputs_fingerprint:
          type: [string, "null"]
        created_by:
          type: [string, "null"]
          description: >-
            빌드를 요청한 principal의 display/legacy 라벨(#388). 사람이 읽는
            표시용이며, ownership 판정에는 owner_id가 없는 legacy run에 한해
            하위 호환 폴백으로만 쓰인다.
        quality_results:
          type: object
          description: >-
            source_key → QualityCheckResult 목록 (#486, additive). legacy
            manifest는 이 필드가 없다 — 부재를 "미평가"로 해석해야 하며
            "전부 PASS"로 해석하면 안 된다.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록 (#486, additive).
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"
        composition:
          description: >-
            BuildSpec.composition으로 두 source를 join한 결과의 출처 추적
            정보(#506, additive). composition이 없거나 실행되지 않았으면
            null이다 — legacy manifest reader는 부재와 null을 모두
            "composition 미사용 run"으로 해석해야 한다.
          oneOf:
            - $ref: "#/components/schemas/CompositionProvenance"
            - type: "null"

    CompositionProvenance:
      type: object
      description: composition(join) 실행 결과의 상세 출처 정보 (#506).
      required:
        - name
        - left
        - right
        - join_type
        - left_key
        - right_key
        - left_row_count
        - left_distinct_key_count
        - right_row_count
        - right_distinct_key_count
        - output_row_count
        - duplicate_key_warning
      properties:
        name:
          type: string
        left:
          type: string
        right:
          type: string
        join_type:
          type: string
          enum: [inner, left]
        left_key:
          type: string
        right_key:
          type: string
        left_row_count:
          type: integer
        left_distinct_key_count:
          type: integer
          description: 왼쪽 join key의 distinct 값 수 (null 제외)
        right_row_count:
          type: integer
        right_distinct_key_count:
          type: integer
          description: 오른쪽 join key의 distinct 값 수 (null 제외)
        output_row_count:
          type: integer
        duplicate_key_warning:
          type: boolean
          description: >-
            양쪽 join key가 모두 중복 값을 가져(many-to-many) 행 폭증 위험이
            감지됐는지 여부. 실제 처리(경고만/빌드 실패)는 JoinSpec의
            on_duplicate_key가 결정한다 — 이 필드는 감지 여부만 기록한다.

    CompositionOutcome:
      type: object
      description: >-
        composition(join) 실행 결과 (#506). source별 BuildOutcome과 별도로
        노출된다 — bronze/silver/gold stage 개념이 적용되지 않고, "combined
        result"로 명확히 구분되어야 하기 때문이다.
      required: [name, status, error]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, failed, skipped]
          description: >-
            ok(성공) / failed(join 자체 실행 실패: 키 부재·타입 불일치·명시적
            fail 게이트) / skipped(참조한 source가 실패해 join을 시도조차
            못함)
        error:
          type: [string, "null"]

    BuildSpecSnapshotResponse:
      type: object
      required: [run_id, spec, spec_digest]
      additionalProperties: false
      properties:
        run_id:
          type: string
        spec:
          type: string
          description: credential 값이 redaction된 canonical YAML
        spec_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            실제 저장된 redaction 후 canonical buildspec.yaml bytes의 SHA-256.
            credential 값만 다른 spec은 같은 digest가 될 수 있다.

    BuildSummary:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          description: 빌드 실행 식별자
        status:
          type: string
          enum: [ok, failed, cancelled]
          description: >-
            빌드 상태. `cancelled`(#481)는 협력적 취소로 종료된 run이며 부분
            산출물과 partial manifest가 함께 남는다 — 성공한 빌드로 취급하면
            안 된다.
        started_at:
          type: [string, "null"]
          description: 빌드 시작 시각 (ISO 8601 또는 null)
        finished_at:
          type: [string, "null"]
          description: 빌드 완료 시각 (ISO 8601 또는 null)

    BuildJob:
      type: object
      required: [run_id, status, created_at, updated_at]
      description: >-
        비동기 build job 스냅샷 (#482, #480). 프로세스 메모리 상주 registry
        기반이라 서버 재시작 후 active/terminal 잡은 더 이상 조회되지 않는다.
        `response`는 성공한 잡의 최종 build 응답 본문이고, `error`는 실패한
        잡의 사유다. internal `owner_id` 필드는 wire로 노출되지 않는다.
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled]
          description: >-
            `POST /builds/{run_id}/cancel`(#481)이 `queued` job을 곧바로
            `cancelled`로, `running` job을 `cancelling`으로 전이시키고,
            `cancelling` job은 다음 안전한 stage 경계에서 `cancelled`가 된다.
            `succeeded`/`failed`/`cancelled`는 종단 상태이며 다시
            `running`/`cancelling`으로 돌아가지 않는다.
        created_at:
          type: string
          description: job 접수 시각 (ISO 8601)
        updated_at:
          type: string
          description: 마지막 상태 전이 시각 (ISO 8601)
        created_by:
          type: [string, "null"]
          description: 제출 principal의 display/legacy label (선택)
        response:
          type: [object, "null"]
          description: 성공한 잡의 최종 build 응답 본문 (성공 시에만)
        error:
          type: [string, "null"]
          description: 실패 사유 (실패 시에만)

    BuildsResponse:
      type: object
      required: [builds]
      properties:
        builds:
          type: array
          items:
            $ref: "#/components/schemas/BuildSummary"

    # ---------------------------------------------------------------------
    # Dataset Catalog / Stage Summary API (#488)
    # ---------------------------------------------------------------------

    DatasetSourceRef:
      type: object
      description: dataset의 canonical snapshot에 선언된 소스 참조 (secret 없음)
      required: [provider, dataset, alias]
      properties:
        provider:
          type: string
        dataset:
          type: string
        alias:
          type: string

    BuildEventName:
      type: string
      description: >-
        structured run event의 bounded vocabulary (#496). run_submitted은
        실제 async job submission이 있는 `POST /builds`(비동기)에서만 발생하며
        동기 `POST /build`에는 없다. run_cancelled(#481)도 async 전용이며 job이
        실제로 terminal `cancelled`로 확정되는 순간 run당 정확히 한 번만
        발생한다 — 같은 run에 run_finished/run_failed와 함께 나타나지 않는다.
        과도기 상태(`cancelling`)는 job status로만 노출되고 별도 event는 없다.
      enum:
        - run_submitted
        - run_started
        - run_finished
        - run_failed
        - run_cancelled
        - source_fetch_started
        - source_fetch_completed
        - source_fetch_failed
        - stage_started
        - stage_completed
        - stage_failed
        - quality_evaluated

    BuildEventStatus:
      type: string
      description: >-
        event의 결과. ok(성공/정상 완료), warn(quality_evaluated에서 FAIL 없이
        WARN이 하나 이상), fail(실패).
      enum: [ok, warn, fail]

    BuildEventStageName:
      type: string
      description: 관련 medallion stage. export는 BuildSpec.exports 실행 단계다.
      enum: [bronze, silver, gold, export]

    BuildEvent:
      type: object
      description: >-
        단일 structured run event(#496). arbitrary object dump, exception
        객체, stack trace, raw provider response, raw path, credential은
        담기지 않는다 — message/metrics는 항상 bounded하고 안전하다.
      required: [seq, timestamp, run_id, event, status, source_key, stage, message, metrics]
      properties:
        seq:
          type: integer
          description: >-
            store가 append 시점에 부여하는 monotonic ordering identifier.
            병렬 source worker의 실제 append 순서를 그대로 보존하며, 존재하지
            않는 causal ordering을 지어내지 않는다.
        timestamp:
          type: string
          format: date-time
          description: timezone-aware UTC 시각.
        run_id:
          type: string
        event:
          $ref: "#/components/schemas/BuildEventName"
        status:
          $ref: "#/components/schemas/BuildEventStatus"
        source_key:
          type: [string, "null"]
          description: 관련 소스 식별자. run 수준 event는 null.
        stage:
          oneOf:
            - $ref: "#/components/schemas/BuildEventStageName"
            - type: "null"
          description: 관련 medallion stage. source fetch/run 수준 event는 null.
        message:
          type: [string, "null"]
          description: 사람이 읽는 bounded, 안전한 요약. 없으면 null.
        metrics:
          type: [object, "null"]
          description: >-
            JSON 직렬화 가능한 안전한 수치 요약(예: records/row_count/
            check_count). 원본 provider 응답이나 임의 object는 담지 않는다.
          additionalProperties: true

    BuildEventsResponse:
      type: object
      description: run identity와 chronological ascending으로 정렬된 event 목록.
      required: [run_id, events]
      properties:
        run_id:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/BuildEvent"

    StageStatusValue:
      type: string
      description: >-
        completed(완전한 산출물 존재) / failed(manifest에 실패로 기록됨) /
        not_run(상위 단계가 끝나지 못해 시도되지 않음) / unavailable(디렉터리는
        있지만 불완전·손상됨, legacy 형식 등)
      enum: [completed, failed, not_run, unavailable]

    PublishTarget:
      type: string
      description: >-
        HTTP publish API가 노출하는 target(#491). Local은 안전한 publish-root
        계약이 없고, Kaggle은 정상 pipeline packaging의 metadata.id가 publish
        destination과 정합하지 않아 이번 HTTP 계약에서 제외한다.
      enum: [huggingface]

    PublishIssue:
      type: object
      description: 안정적인 code + 사람이 읽는 message. UI가 문자열 파싱을 하지 않아도 된다.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            run_not_terminal / run_failed / run_cancelled / gold_unavailable /
            artifact_missing / artifact_invalid / license_missing /
            pii_allow_with_publish / credential_unavailable 중 하나(#491).
            artifact_invalid는 canonical
            manifest.outputs 항목이 gold root를 벗어나거나(symlink escape
            포함) resolve할 수 없을 때 fail-closed로 반환된다.
        message:
          type: string

    PublishReadinessResponse:
      type: object
      description: >-
        side-effect-free readiness 판정. `ready`는 항상 `blockers`가 비어
        있는지로 계산된다. `warnings`는 게시 자체를 막지 않는다.
      required: [run_id, target, ready, blockers, warnings]
      additionalProperties: false
      properties:
        run_id:
          type: string
        target:
          $ref: "#/components/schemas/PublishTarget"
        ready:
          type: boolean
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PublishIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PublishIssue"

    PublishRequest:
      type: object
      description: >-
        게시 요청. destination은 filesystem path로 해석되지 않고 target별
        canonical identifier("owner/name")만 허용된다. options는 target이
        실제로 지원하는 키만 허용하며(#491), 미지원 키는 조용히 무시되지 않고
        400으로 거부된다.
      required: [target, destination]
      additionalProperties: false
      properties:
        target:
          $ref: "#/components/schemas/PublishTarget"
        destination:
          type: string
          description: "target별 owner/name 형태의 게시 대상 식별자."
        options:
          $ref: "#/components/schemas/PublishHuggingFaceOptions"

    PublishHuggingFaceOptions:
      type: object
      description: >-
        신규 Hugging Face dataset repo 생성 시 visibility. 기존 repo의
        visibility는 변경하지 않는다. 생략 시 안전한 기본값 private=true다.
      additionalProperties: false
      properties:
        private:
          type: boolean
          default: true

    PublishResponse:
      type: object
      description: >-
        기존 Publisher(PublishResult, publishers/base.py)의 결과를 그대로
        노출한다. 서버 절대 경로는 담지 않는다 — reference는 안전한 외부
        참조(URL 등)만 담는다.
      required:
        - run_id
        - target
        - publisher
        - destination
        - reference
        - artifact_count
        - status
      additionalProperties: false
      properties:
        run_id:
          type: string
        target:
          $ref: "#/components/schemas/PublishTarget"
        publisher:
          type: string
        destination:
          type: string
        reference:
          type: string
          description: 게시 위치에 대한 안전한 외부 참조(URL 등). 서버 내부 경로가 아니다.
        artifact_count:
          type: integer
          minimum: 0
        status:
          type: string

    PublishBlockedResponse:
      type: object
      description: readiness 재검증에서 blocker가 발견되어 Publisher를 호출하지 않았음.
      required: [error, blockers]
      additionalProperties: false
      properties:
        error:
          type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PublishIssue"

    DatasetStageMap:
      type: object
      description: source_key → {bronze, silver, gold} 상태 맵
      additionalProperties:
        type: object
        required: [bronze, silver, gold]
        properties:
          bronze:
            $ref: "#/components/schemas/StageStatusValue"
          silver:
            $ref: "#/components/schemas/StageStatusValue"
          gold:
            $ref: "#/components/schemas/StageStatusValue"

    DatasetSummary:
      type: object
      description: >-
        동일 dataset_id를 공유하는 여러 run을 접근 가능한 latest run 기준으로
        묶은 built dataset 요약. quality는 #486의 구조화된 품질 게이트가
        선반영되지 않았으므로 항상 null이다(N/A) — 미평가를 PASS로 표시하지 않는다.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
          description: latest run의 finished_at(없으면 started_at)
        row_counts:
          type: object
          description: >-
            source_key별 Silver row_count. multi-source dataset을 단일 값으로
            축약하지 않는다.
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
          description: row_counts 값의 합계
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
          description: "#486 선반영 안 함 — 구조화된 quality 결과가 없으므로 항상 null"

    DatasetDetailResponse:
      type: object
      description: DatasetSummary와 동일한 필드에 run_count가 추가된 단일 dataset 상세 응답.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
        - run_count
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
        row_counts:
          type: object
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
        run_count:
          type: integer
          description: 이 principal에게 접근 가능한 이 dataset_id의 run 총 개수

    DatasetsResponse:
      type: object
