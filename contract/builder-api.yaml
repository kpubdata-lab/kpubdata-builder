  /builds/{run_id}/stages/{stage}:
    get:
      operationId: getBuildStageDetail
      summary: >-
        단일 source의 단일 stage(bronze/silver/gold)에 대한 안전한 summary/preview
        조회 (#488). raw fetch_params, export options, credential, 절대 경로는
        어디에도 담기지 않는다. Silver sample은 build 시점에 이미 persist된 상한
        (기본 5행) 안에서만 반환되며 parquet 전체를 읽지 않는다.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Stage"
        - name: source
          in: query
          required: true
          description: 조회할 source_key (run에 알려진 source여야 함)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Silver sample 행 수 상한 (기본값: 5, 다른 stage에서는 무시됨)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 5
      responses:
        "200":
          description: stage summary/preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageDetailResponse"
              examples:
                BronzeDetail:
                  summary: credential과 fetch params가 제거된 Bronze summary
                  value:
                    run_id: air-quality-20260815
                    stage: bronze
                    source_key: air
                    status: completed
                    available: true
                    provider: datago
                    dataset: air_quality
                    fetched_at: "2026-08-15T09:30:02+00:00"
                    record_count: 25
                SilverDetail:
                  summary: persist된 bounded Silver sample
                  value:
                    run_id: air-quality-20260815
                    stage: silver
                    source_key: air
                    status: completed
                    available: true
                    row_count: 25
                    schema:
                      - name: station_name
                        dtype: String
                        nullable: false
                        unique_count: 25
                        logical_type: string
                        wire_encoding: string
                      - name: pm10_value
                        dtype: Int64
                        nullable: true
                        unique_count: 18
                        logical_type: int64
                        wire_encoding: number
                    statistics:
                      row_count: 25
                      null_counts:
                        station_name: 0
                        pm10_value: 1
                      duplicate_rate: 0.0
                    validation:
                      ok: true
                      problems: []
                    sample:
                      - station_name: 종로구
                        pm10_value: 31
                      - station_name: 중구
                        pm10_value: 28
                GoldDetail:
                  summary: export options와 내부 경로가 없는 Gold summary
                  value:
                    run_id: air-quality-20260815
                    stage: gold
                    source_key: air
                    status: completed
                    available: true
                    row_count: 25
                    columns: [station_name, pm10_value]
                    splits: null
                    exports:
                      - kind: jsonl
                    sample: null
                    sample_available: false
        "400":
          description: >-
            경로 안전하지 않은 run_id/source, 잘못된 stage 이름, source 누락,
            또는 잘못된 limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                MissingSource:
                  summary: 필수 source query parameter 누락
                  value:
                    error: source query parameter is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run이 없거나, source가 이 run에 알려지지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /datasets/{dataset_id}/quality/history:
