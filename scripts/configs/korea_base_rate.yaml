# BOK Base Rate — HuggingFace Dataset Publishing Config
# Dataset: kpubdata/korea-base-rate
# Source: Bank of Korea ECOS base interest rate

source:
  provider: bok
  dataset: base_rate
  list_all: false
  fetch_params:
    - start_date: "200101"
      end_date: "202412"

transform:
  column_mapping:
    TIME: year_month
    DATA_VALUE: base_rate_pct
    STAT_NAME: stat_name
    UNIT_NAME: unit

  dtypes:
    year_month: str
    base_rate_pct: float
    stat_name: str
    unit: str

  derived: []
  filters: []

output:
  hf_repo: "kpubdata/korea-base-rate"
  parquet_filename: "data/train.parquet"
  staging_dir: "./staging/korea-base-rate"

card:
  title: "Korea Base Interest Rate (한국은행 기준금리)"
  description: |
    Historical base interest rate of the Bank of Korea (BOK),
    sourced from the Economic Statistics System (ECOS) via
    kpubdata.

    Monthly time series suitable for economic analysis and
    forecasting tasks.
  # Bank of Korea terms (#677): its copyright policy requires naming the Bank of Korea as
  # the source and saying so when the data is modified; ECOS's statistics guideline lets
  # statistics the Bank compiles be used, processed and redistributed, commercially
  # included, as long as the source is stated. Not a KOGL licence.
  license: other
  license_name: bok-ecos-attribution
  license_link: "https://www.bok.or.kr/portal/main/contents.do?menuNo=200228"
  attribution: |
    데이터 출처: 한국은행 경제통계시스템(ECOS), 한국은행 기준금리
    (Bank of Korea — Economic Statistics System)
    원문: https://ecos.bok.or.kr/
    이용 조건: 한국은행 저작권보호방침 — 출처(한국은행) 표시, 수정·가공 시 그 사실을 밝힘
    가공: kpubdata-builder 가 컬럼 이름을 바꾸고(TIME→year_month, DATA_VALUE→base_rate_pct)
    기준금리를 실수형으로 변환했다. 값 자체는 바꾸지 않았다.
  language:
    - ko
  tags:
    - economics
    - interest-rate
    - korea
    - time-series
  features:
    - name: year_month
      description: "YYYYMM format period identifier"
    - name: base_rate_pct
      description: "Base rate in annual percent (연%)"
    - name: stat_name
      description: "Statistic name from BOK"
    - name: unit
      description: "Unit description"
